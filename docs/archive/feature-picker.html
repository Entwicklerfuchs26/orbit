<title>Feature Picker — Fuchs Launcher + Desktop</title>
<style>
:root {
  --bg: #F5F4F1;
  --surface: #FFFFFF;
  --surface-hover: #F0EFEC;
  --text: #1A1D27;
  --text-muted: #6B7280;
  --border: #E2E1DD;
  --accent: #3B7BF7;
  --accent-soft: #3B7BF714;
  --yes: #2EAE65;
  --yes-bg: #2EAE6518;
  --no: #D94444;
  --no-bg: #D9444418;
  --maybe: #E5A118;
  --maybe-bg: #E5A11818;
  --niagara: #E87B35;
  --openwebui: #7C3AED;
  --hermes: #0891B2;
  --shadow: 0 1px 3px #0001, 0 1px 2px #0001;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1118;
    --surface: #171B24;
    --surface-hover: #1E2330;
    --text: #E4E5E9;
    --text-muted: #8B8FA3;
    --border: #2A2E3A;
    --accent: #5B93F7;
    --accent-soft: #5B93F714;
    --yes-bg: #2EAE6520;
    --no-bg: #D9444420;
    --maybe-bg: #E5A11820;
    --shadow: 0 1px 3px #0003;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1118;
  --surface: #171B24;
  --surface-hover: #1E2330;
  --text: #E4E5E9;
  --text-muted: #8B8FA3;
  --border: #2A2E3A;
  --accent: #5B93F7;
  --accent-soft: #5B93F714;
  --yes-bg: #2EAE6520;
  --no-bg: #D9444420;
  --maybe-bg: #E5A11820;
  --shadow: 0 1px 3px #0003;
}
:root[data-theme="light"] {
  --bg: #F5F4F1;
  --surface: #FFFFFF;
  --surface-hover: #F0EFEC;
  --text: #1A1D27;
  --text-muted: #6B7280;
  --border: #E2E1DD;
  --accent: #3B7BF7;
  --accent-soft: #3B7BF714;
  --yes-bg: #2EAE6518;
  --no-bg: #D9444418;
  --maybe-bg: #E5A11818;
  --shadow: 0 1px 3px #0001, 0 1px 2px #0001;
}

* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  margin: 0;
  min-height: 100vh;
}

.app {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 16px 80px;
}

/* Header */
.header {
  margin-bottom: 24px;
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  margin: 0 0 4px;
  letter-spacing: -0.3px;
}
.header p {
  color: var(--text-muted);
  font-size: 14px;
  margin: 0;
}

/* Progress */
.progress-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.progress-stats {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.progress-stats .stat {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.progress-bar-track {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  display: flex;
}
.progress-bar-track > div {
  height: 100%;
  transition: width 0.3s ease;
}

/* Controls */
.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  align-items: center;
}
.source-tabs {
  display: flex;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-x: auto;
  flex-shrink: 0;
}
.source-tab {
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: var(--surface);
  border: none;
  border-right: 1px solid var(--border);
  color: var(--text-muted);
  transition: all 0.15s;
  white-space: nowrap;
}
.source-tab:last-child { border-right: none; }
.source-tab:hover { background: var(--surface-hover); }
.source-tab.active { color: var(--text); font-weight: 600; background: var(--accent-soft); }
.source-tab .count {
  font-size: 11px;
  opacity: 0.7;
  margin-left: 4px;
  font-variant-numeric: tabular-nums;
}

.filter-pills {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.filter-pill {
  padding: 5px 10px;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.filter-pill:hover { background: var(--surface-hover); }
.filter-pill.active { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

.search-wrap {
  flex: 1;
  min-width: 160px;
}
.search-wrap input {
  width: 100%;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text-muted); }

/* Category sections */
.category-section {
  margin-bottom: 12px;
}
.category-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.category-header:hover { background: var(--surface-hover); }
.category-header .arrow {
  font-size: 11px;
  color: var(--text-muted);
  transition: transform 0.2s;
  flex-shrink: 0;
}
.category-header.open .arrow { transform: rotate(90deg); }
.category-header .cat-name {
  font-size: 13px;
  font-weight: 600;
  flex: 1;
}
.category-header .cat-count {
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.category-header .cat-progress {
  width: 40px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
}
.category-header .cat-progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s;
}

.category-items {
  display: none;
  padding: 4px 0 0;
}
.category-section.open .category-items { display: block; }

/* Feature card */
.feature {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 4px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s;
}
.feature.decided-yes { border-left: 3px solid var(--yes); background: var(--yes-bg); }
.feature.decided-no { border-left: 3px solid var(--no); background: var(--no-bg); }
.feature.decided-maybe { border-left: 3px solid var(--maybe); background: var(--maybe-bg); }

.feature-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.feature-info { flex: 1; min-width: 0; }
.feature-name {
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 2px;
  line-height: 1.3;
}
.feature-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin: 0;
  line-height: 1.45;
}
.feature-source-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
  position: relative;
  top: -1px;
}

.feature-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.btn-vote {
  width: 34px;
  height: 30px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  padding: 0;
}
.btn-vote:hover { background: var(--surface-hover); }
.btn-vote.vote-yes.active { background: var(--yes); color: #fff; border-color: var(--yes); }
.btn-vote.vote-no.active { background: var(--no); color: #fff; border-color: var(--no); }
.btn-vote.vote-maybe.active { background: var(--maybe); color: #fff; border-color: var(--maybe); }

/* Priority */
.priority-row {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.feature.decided-yes .priority-row,
.feature.decided-maybe .priority-row { display: flex; }

.priority-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
.priority-stars {
  display: flex;
  gap: 2px;
}
.priority-star {
  width: 24px;
  height: 24px;
  border: none;
  background: none;
  color: var(--border);
  cursor: pointer;
  font-size: 16px;
  padding: 0;
  transition: color 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.priority-star.filled { color: var(--accent); }
.priority-star:hover { color: var(--accent); }
.priority-text {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}

/* Target selector */
.target-row {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.feature.decided-yes .target-row,
.feature.decided-maybe .target-row { display: flex; }

.target-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
.target-pills {
  display: flex;
  gap: 4px;
}
.target-pill {
  padding: 3px 10px;
  font-size: 11px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}
.target-pill:hover { background: var(--surface-hover); }
.target-pill.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

/* Notes field */
.note-row {
  display: none;
  margin-top: 6px;
}
.feature.decided-yes .note-row,
.feature.decided-maybe .note-row,
.feature.decided-no .note-row { display: block; }

.note-input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  resize: none;
  outline: none;
  transition: border-color 0.15s;
  min-height: 28px;
}
.note-input:focus { border-color: var(--accent); }
.note-input::placeholder { color: var(--text-muted); }

/* Export */
.export-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  justify-content: center;
  gap: 10px;
  z-index: 100;
  box-shadow: 0 -2px 8px #0002;
}
.btn-export {
  padding: 8px 20px;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-export:hover { opacity: 0.9; }
.btn-reset {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-reset:hover { background: var(--surface-hover); color: var(--no); }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

/* Collapse all / expand all */
.section-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.section-control-btn {
  font-size: 12px;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.section-control-btn:hover { opacity: 0.8; }

@media (max-width: 600px) {
  .controls { flex-direction: column; }
  .source-tabs { width: 100%; }
  .source-tab { flex: 1; text-align: center; padding: 8px 6px; font-size: 12px; }
  .feature-top { flex-direction: column; }
  .feature-actions { align-self: flex-start; }
}
</style>

<div class="app">
  <div class="header">
    <h1>Feature Picker</h1>
    <p>Launcher + Sojus Desktop — Features aus Niagara, Open WebUI und Hermes bewerten <span id="syncStatus" style="font-size:11px;opacity:0.6"></span> <span id="evtStatus" style="font-size:11px;color:var(--no);font-weight:700">EVENTS: LADEN...</span></p>
  </div>

  <div class="progress-wrap" id="progress"></div>

  <div class="controls">
    <div class="source-tabs" id="sourceTabs"></div>
    <div class="filter-pills" id="filterPills"></div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Suchen...">
    </div>
  </div>

  <div class="section-controls">
    <button class="section-control-btn" id="btnExpandAll">Alle aufklappen</button>
    <button class="section-control-btn" id="btnCollapseAll">Alle zuklappen</button>
    <button class="section-control-btn" id="btnTestDirect" style="background:var(--accent);color:#fff;border-radius:4px;padding:4px 8px;border:1px solid var(--accent)">Test-Klick</button>
  </div>

  <div id="featureList"></div>
</div>

<div class="export-bar">
  <button class="btn-export" id="btnExport">Entscheidungen exportieren (JSON)</button>
  <button class="btn-reset" id="btnReset">Alles zurücksetzen</button>
</div>

<script>
const FEATURES = [{"id": "niagara-001", "source": "niagara", "category": "Home Screen", "name": "Single Unified Home Screen", "description": "Vereint App-Übersicht und Startbildschirm in einer einzigen vertikalen Liste — keine mehreren Seiten, kein Icon-Raster. Alles ist auf einer Seite erreichbar: Favoriten oben, darunter alle Apps alphabetisch. Deutlich aufgeräumter als herkömmliche Launcher mit mehreren Home-Screens."}, {"id": "niagara-002", "source": "niagara", "category": "Home Screen", "name": "Favorites List (max 8)", "description": "Bis zu 8 Lieblings-Apps werden oben auf dem Startbildschirm prominent angezeigt und umgehen die alphabetische Sortierung. Du wählst selbst, welche Apps angepinnt werden — ideal für die Apps, die du am häufigsten brauchst, damit sie immer sofort erreichbar sind."}, {"id": "niagara-003", "source": "niagara", "category": "Home Screen", "name": "Alphabetical App List", "description": "Alle installierten Apps werden unterhalb der Favoriten alphabetisch in einer scrollbaren vertikalen Liste angezeigt — kein Icon-Raster, sondern saubere Zeilen mit Icon und Name. Dadurch findet man jede App schnell, ohne sich durch mehrere Seiten wischen zu müssen."}, {"id": "niagara-004", "source": "niagara", "category": "Navigation", "name": "Wave Alphabet / Edge Scroll", "description": "Wenn du am rechten (oder linken) Bildschirmrand entlang gleitest, erscheint ein Buchstaben-Index. Damit springst du mit einer einzigen Geste direkt zu einem bestimmten Buchstabenbereich in der App-Liste. Besonders praktisch für Einhand-Bedienung auf großen Handys."}, {"id": "niagara-005", "source": "niagara", "category": "Navigation", "name": "Left-Hand Mode", "description": "Der Buchstaben-Index kann auf die linke Bildschirmseite verschoben werden, ideal für Linkshänder. Das Scrollen funktioniert auf beiden Seiten des Bildschirms, sodass jeder bequem navigieren kann."}, {"id": "niagara-006", "source": "niagara", "category": "Navigation", "name": "One-Handed Thumb Navigation", "description": "Die gesamte Benutzeroberfläche ist für die Bedienung mit einer Hand auf großen Handys optimiert. Alle wichtigen Elemente befinden sich im Daumen-Erreichungsbereich, sodass du dich nicht strecken musst, um eine App zu öffnen."}, {"id": "niagara-007", "source": "niagara", "category": "Search", "name": "App Search by Typing", "description": "Sofortige Suche nach Apps durch einfaches Tippen: Sobald du anfängst zu schreiben, werden die Ergebnisse live gefiltert. Die Suchleiste erscheint, wenn du nach oben wischst oder einfach losschreibst. Besonders schnell, wenn du weißt, welche App du willst."}, {"id": "niagara-008", "source": "niagara", "category": "Search", "name": "Contact Search", "description": "Kontakte können direkt vom Startbildschirm aus gesucht werden, ohne die Kontakte-App zu öffnen. Personen finden und sofort anrufen oder eine Nachricht schreiben — alles in einem Schritt. Nur in der Pro-Version verfügbar."}, {"id": "niagara-009", "source": "niagara", "category": "Search", "name": "Web Search Suggestions", "description": "Während du in der Suchleiste tippst, erscheinen Web-Suchvorschläge. Unterstützt verschiedene Suchmaschinen wie Google und Bing. So kannst du direkt vom Startbildschirm aus im Internet suchen, ohne erst einen Browser zu öffnen."}, {"id": "niagara-010", "source": "niagara", "category": "Search", "name": "Integrated Calculator", "description": "Rechenausdrücke direkt in die Suchleiste eingeben und sofort ein Ergebnis bekommen — keine separate Taschenrechner-App nötig. Einfach z.B. '15*3+7' eingeben und das Ergebnis erscheint sofort."}, {"id": "niagara-011", "source": "niagara", "category": "Search", "name": "Direct Call/Message from Search", "description": "Aus den Suchergebnissen heraus direkt anrufen oder Nachrichten senden, ohne erst die Kontakte- oder Telefon-App zu öffnen. Kontakt suchen, antippen, fertig. Nur in der Pro-Version verfügbar."}, {"id": "niagara-012", "source": "niagara", "category": "Gestures", "name": "Swipe Right on App — Shortcuts/Notifications", "description": "Nach rechts wischen auf einer App zeigt Schnellzugriffe (Shortcuts), Benachrichtigungen oder verwandte Popup-Inhalte an. So erreichst du App-Funktionen direkt, ohne die App erst komplett zu öffnen — z.B. direkt eine bestimmte WhatsApp-Gruppe öffnen."}, {"id": "niagara-013", "source": "niagara", "category": "Gestures", "name": "Swipe Left on App — Dismiss Notification", "description": "Nach links wischen auf einer App verwirft deren Benachrichtigung direkt vom Startbildschirm aus. Kein Öffnen der Benachrichtigungsleiste nötig — einfach wegwischen und es ist erledigt."}, {"id": "niagara-014", "source": "niagara", "category": "Gestures", "name": "Swipe Down — Notification Tray", "description": "Von irgendwo auf dem Startbildschirm nach unten wischen öffnet die Android-Benachrichtigungsleiste. Funktioniert überall auf dem Bildschirm, nicht nur am oberen Rand — dadurch auch mit einer Hand bequem erreichbar."}, {"id": "niagara-015", "source": "niagara", "category": "Gestures", "name": "Double-Tap to Lock Screen", "description": "Doppeltippen auf den Buchstabenbereich schaltet den Bildschirm sofort aus und sperrt das Gerät. Erfordert die Pro-Version und Android 9+. Nutzt den Accessibility-Service von Android, sammelt dabei aber keine Daten."}, {"id": "niagara-016", "source": "niagara", "category": "Gestures", "name": "Swipe Up — Search Activation", "description": "Vom unteren Bildschirmrand nach oben wischen aktiviert die Suchleiste. Eine intuitive Geste, die auch mit einer Hand leicht auszuführen ist und die Suche sofort öffnet."}, {"id": "niagara-017", "source": "niagara", "category": "Notifications", "name": "Embedded Notification Previews", "description": "Benachrichtigungen erscheinen als kleine Textvorschau direkt neben der zugehörigen App auf dem Startbildschirm. Du kannst Nachrichten lesen, ohne irgendetwas zu öffnen — der Inhalt wird einfach neben dem App-Namen angezeigt. Ein Kernmerkmal, das Niagara von anderen Launchern unterscheidet."}, {"id": "niagara-018", "source": "niagara", "category": "Notifications", "name": "Expandable Notification Bubbles", "description": "Tippst du auf eine Benachrichtigungsvorschau, klappt sie zu einer größeren Blase auf, die den vollständigen Nachrichteninhalt, Aktionsschaltflächen und eine Antwort-Option zeigt. So bekommst du alle Details, ohne die App öffnen zu müssen."}, {"id": "niagara-019", "source": "niagara", "category": "Notifications", "name": "Quick Reply from Home Screen", "description": "Direkt vom Startbildschirm aus auf Nachrichten antworten, ohne die Messaging-App zu öffnen. Die Antwort wird in der aufgeklappten Benachrichtigungs-Blase geschrieben — spart Zeit und unterbricht den Arbeitsfluss nicht."}, {"id": "niagara-020", "source": "niagara", "category": "Notifications", "name": "Notification Filtering", "description": "Statt herkömmlicher Benachrichtigungs-Punkte (Badges) zeigt Niagara den tatsächlichen Inhalt der Benachrichtigung. So siehst du nicht nur 'Es gibt 3 neue Nachrichten', sondern direkt den Text — deutlich informativer als ein bloßer Zähler."}, {"id": "niagara-021", "source": "niagara", "category": "Widgets", "name": "Built-in Clock Widget", "description": "Minimalistisches Uhr-Widget oben auf dem Startbildschirm, das Uhrzeit und Datum anzeigt. In der Pro-Version stehen sechs verschiedene Uhrstile zur Auswahl. Passt sich dezent ins Gesamtbild ein, ohne viel Platz einzunehmen."}, {"id": "niagara-022", "source": "niagara", "category": "Widgets", "name": "Calendar Agenda Widget", "description": "Integrierter Kalender, der bevorstehende Termine und Erinnerungen anzeigt. Tippe auf das Uhr-Widget, um die Tagesansicht mit anstehenden Events aufzuklappen. Nur in der Pro-Version verfügbar — praktisch, um den nächsten Termin im Blick zu behalten."}, {"id": "niagara-023", "source": "niagara", "category": "Widgets", "name": "Weather Widget", "description": "Eingebaute Wetteranzeige mit OpenWeather-Daten: aktuelles Wetter, 24-Stunden-Vorhersage und 7-Tage-Ausblick. Aktualisiert sich automatisch alle 30 Minuten. Standort kann automatisch erkannt oder fest eingestellt werden. Nur in der Pro-Version."}, {"id": "niagara-024", "source": "niagara", "category": "Widgets", "name": "Media Player Widget", "description": "Eingebaute Mediensteuerung, die automatisch erscheint, wenn Musik, Videos oder Podcasts abgespielt werden, und wieder verschwindet, wenn die Wiedergabe stoppt. Zeigt Play/Pause, Vor/Zurück-Tasten direkt auf dem Startbildschirm an. Benötigt Benachrichtigungszugriff."}, {"id": "niagara-025", "source": "niagara", "category": "Widgets", "name": "Widget Stacks (Carousel)", "description": "Bis zu 4 Widgets können als Karussell oben auf dem Startbildschirm gestapelt werden. Zwischen ihnen wischen und trotzdem ein minimalistisches Aussehen behalten. Nur in der Pro-Version — ideal, um mehrere Infos auf engem Raum unterzubringen."}, {"id": "niagara-026", "source": "niagara", "category": "Widgets", "name": "Third-Party Widget Support", "description": "Widgets von beliebigen installierten Apps können hinzugefügt werden. Die eingebaute Uhr lässt sich per langem Drücken durch jedes andere Widget ersetzen. So lässt sich der Startbildschirm mit den eigenen Lieblings-Widgets bestücken."}, {"id": "niagara-027", "source": "niagara", "category": "Widgets", "name": "Pop-up Widgets", "description": "Widgets können in Popups versteckt werden, die per langem Drücken auf Apps oder den Niagara-Button erscheinen. Hält den Startbildschirm sauber, während die Informationen trotzdem schnell erreichbar bleiben. Nur in der Pro-Version."}, {"id": "niagara-028", "source": "niagara", "category": "Organization", "name": "Pop-up Folders", "description": "Vielseitige Ordner, die Apps, Shortcuts, Benachrichtigungen und Widgets enthalten können. Auf einer Favoriten-App nach rechts wischen zeigt die gruppierten verwandten Apps an. Flexibler als herkömmliche Ordner, weil verschiedene Inhaltstypen kombiniert werden. Nur in der Pro-Version."}, {"id": "niagara-029", "source": "niagara", "category": "Organization", "name": "App List Pop-ups", "description": "Apps lassen sich in ausklappbare Popup-Listen organisieren, die an Favoriten angehängt sind. Durch Wischen nach rechts auf einer App öffnet sich die Liste. Nur in der Pro-Version — praktisch, um zusammengehörige Apps zu gruppieren, z.B. alle Social-Media-Apps unter einer Favoriten-App."}, {"id": "niagara-030", "source": "niagara", "category": "Organization", "name": "Hide Apps", "description": "Unerwünschte Apps (Bloatware, vorinstallierte System-Apps) aus der App-Liste entfernen. Versteckte Apps sind nur noch über die Suche oder in den Einstellungen erreichbar. Ideal, um den Startbildschirm von Apps zu befreien, die man nie nutzt aber nicht deinstallieren kann."}, {"id": "niagara-031", "source": "niagara", "category": "Organization", "name": "Frequently-Used Apps Suggestions", "description": "Nach einer Eingewöhnungszeit erscheinen die am häufigsten verwendeten Apps automatisch unten in den Favoriten als Vorschläge. Langes Drücken auf einen Vorschlag blendet ihn aus. Die Liste passt sich selbstlernend an dein Nutzungsverhalten an."}, {"id": "niagara-032", "source": "niagara", "category": "Organization", "name": "App Shortcuts (Android 7.1+)", "description": "Unterstützung für Android App-Shortcuts — Schnellzugriffe auf bestimmte App-Funktionen, erreichbar durch Wischen nach rechts auf einer App. Zum Beispiel direkt einen bestimmten Chat öffnen oder ein neues Dokument erstellen, ohne den Umweg über den App-Hauptbildschirm."}, {"id": "niagara-033", "source": "niagara", "category": "Organization", "name": "Rename Apps", "description": "Apps können individuell umbenannt werden: Lang auf die App drücken und den Namen antippen. Praktisch, um Apps persönlichere oder kürzere Namen zu geben — z.B. 'Insta' statt 'Instagram' oder Beschreibungen wie 'Arbeit-Mail' statt 'Outlook'."}, {"id": "niagara-034", "source": "niagara", "category": "Organization", "name": "Long-Press App Management", "description": "Langes Drücken auf eine App öffnet ein Menü zum Hinzufügen/Entfernen/Verschieben in den Favoriten, zum Bearbeiten des Icons, zum Umbenennen oder zum Zugriff auf die App-Informationen. Alles zur App-Verwaltung an einem Ort."}, {"id": "niagara-035", "source": "niagara", "category": "Customization", "name": "Themes System", "description": "Zentrale Theme-Verwaltung mit einem Tipp. 3 kostenlose Themes plus 18+ Premium-Themes von natürlich inspiriert bis minimalistisch. Themes sind bearbeitbare Ausgangspunkte, keine starren Voreinstellungen — du kannst jedes Theme weiter anpassen."}, {"id": "niagara-036", "source": "niagara", "category": "Customization", "name": "Community Themes", "description": "Hunderte von Nutzern erstellte Themes können aus der Discord-Community heruntergeladen werden. Die .nlt-Dateien einfach importieren und anwenden. Nur in der Pro-Version — so bekommt man Zugang zu einer riesigen Auswahl an Gestaltungsmöglichkeiten."}, {"id": "niagara-037", "source": "niagara", "category": "Customization", "name": "Niagara Studio (Theme Creator)", "description": "Eigene Themes erstellen und mit anderen teilen. Tiefgehende Anpassung von Hintergrundbild, Uhrstil, Schriftart, Icons und Farben. Ein visueller Editor, mit dem man das Aussehen des Launchers komplett selbst gestalten kann."}, {"id": "niagara-038", "source": "niagara", "category": "Customization", "name": "Theme Sharing", "description": "Eigene Themes als .nlt-Dateien exportieren und mit anderen Nutzern teilen. So können Themes zwischen Geräten übertragen oder in der Community veröffentlicht werden."}, {"id": "niagara-039", "source": "niagara", "category": "Customization", "name": "Anycons Icon Packs (9 styles)", "description": "Integriertes Icon-Pack-System mit 9 Stilen: Material, Sticker, Dots, Outline, Outline Chroma, Watercolor, Marble, Bright, Stellar. Eine ML-basierte Kategorisierung stellt sicher, dass wirklich jede App ein passendes Icon bekommt — auch obskure Apps. Nur in der Pro-Version."}, {"id": "niagara-040", "source": "niagara", "category": "Customization", "name": "Third-Party Icon Pack Support", "description": "Beliebige Icon-Packs von Drittanbietern aus dem Play Store verwenden. So kannst du den visuellen Stil deines Launchers komplett verändern, indem du ein Icon-Pack wählst, das zu deinem Geschmack passt. Nur in der Pro-Version."}, {"id": "niagara-041", "source": "niagara", "category": "Customization", "name": "Individual App Icon Editing", "description": "Icons für einzelne Apps individuell ändern: Lang auf die App drücken, dann das Icon antippen. Die neuen Icons müssen aus einem installierten Icon-Pack stammen (keine eigenen Bilder aus der Galerie möglich). Gut, um einzelne Apps visuell hervorzuheben."}, {"id": "niagara-042", "source": "niagara", "category": "Customization", "name": "Icon Shape Picker", "description": "Auswahl der App-Icon-Form: Kreis, Squircle (abgerundetes Quadrat), Rounded Square und weitere. Einstellbar unter Einstellungen > Aussehen > App-Icons. Gibt dem Startbildschirm ein einheitliches Erscheinungsbild."}, {"id": "niagara-043", "source": "niagara", "category": "Customization", "name": "Icon Assistant", "description": "Intelligentes Werkzeug mit automatischer Wiederherstellung, Schnellbearbeitung und automatischem Ersetzen von Icons. Die ML-basierte Kategorisierung lernt kontinuierlich dazu und verbessert sich. Hilft dabei, Icons konsistent und ansprechend zu halten."}, {"id": "niagara-044", "source": "niagara", "category": "Customization", "name": "Niagara Dots Icon Pack", "description": "Minimalistisches eingebautes Icon-Pack, das jede App unterstützt — reduziert die visuelle Unordnung auf das absolute Minimum. Jede App wird als simpler farbiger Punkt dargestellt. Ideal für Nutzer, die maximale Reduktion wollen."}, {"id": "niagara-045", "source": "niagara", "category": "Customization", "name": "Custom Fonts", "description": "Die im Launcher verwendete Schriftart kann geändert werden. Enthält die markante geometrische Schriftart 'Niagara Neo'. Nur in der Pro-Version — eine andere Schriftart verändert das gesamte Erscheinungsbild des Startbildschirms deutlich."}, {"id": "niagara-046", "source": "niagara", "category": "Customization", "name": "Font Size Adjustment", "description": "Die Textgröße auf dem Startbildschirm kann angepasst werden — größer für bessere Lesbarkeit oder kleiner für eine kompaktere Darstellung. Besonders nützlich für Menschen mit Sehschwäche oder wenn man einfach mehr auf den Bildschirm passen lassen will."}, {"id": "niagara-047", "source": "niagara", "category": "Customization", "name": "Personalized Clock Styles", "description": "Sechs eingebaute Uhrstile zur Auswahl. Die Uhr kann auch durch ein beliebiges Widget eines Drittanbieters ersetzt werden. Antippen der Uhr öffnet die System-Uhr oder den Kalender. Nur in der Pro-Version."}, {"id": "niagara-048", "source": "niagara", "category": "Customization", "name": "Date Display Customization", "description": "Auswählen, welche Datumselemente auf dem Startbildschirm angezeigt oder ausgeblendet werden sollen. So lässt sich festlegen, ob Wochentag, Monat, Jahr oder nur das Nötigste angezeigt wird."}, {"id": "niagara-049", "source": "niagara", "category": "Customization", "name": "Built-in Wallpaper Collection", "description": "Kuratierte Hintergrundbilder-Sammlung mit handgezeichneten Illustrationen (nicht nur Fotos). Natur-inspirierte und künstlerische Designs mit einem einfachen Auswahl-Werkzeug. Speziell für den minimalistischen Stil von Niagara abgestimmt."}, {"id": "niagara-050", "source": "niagara", "category": "Customization", "name": "Material You / Dynamic Colors", "description": "Die Oberflächenfarben passen sich automatisch an das Hintergrundbild an, basierend auf Androids Material-You-Farbpalette. Funktioniert rückportiert auch auf älteren Android-Versionen, nicht nur ab Android 12+. Wenn die automatisch erkannten Farben nicht zum Hintergrundbild passen, gibt es ein intelligentes Fallback."}, {"id": "niagara-051", "source": "niagara", "category": "Customization", "name": "Accent Color Override", "description": "Manuell eine eigene Akzentfarbe festlegen über Einstellungen > Themes > Aktuelles Theme bearbeiten > Farbpaletten-Symbol. Überschreibt die automatisch erkannte Hintergrundfarbe, falls die automatische Erkennung nicht gefällt."}, {"id": "niagara-052", "source": "niagara", "category": "Customization", "name": "Hide Status Bar", "description": "Die Android-Statusleiste oben am Bildschirm (mit Uhrzeit, WLAN, Akku-Anzeige) kann ausgeblendet werden. Gibt dem Startbildschirm ein saubereres, immersiveres Aussehen. Nur in der Pro-Version."}, {"id": "niagara-053", "source": "niagara", "category": "Customization", "name": "Hide Alphabet Index", "description": "Den seitlichen Buchstaben-Index ein- oder ausschalten. Wer ihn nicht braucht, kann ihn ausblenden für ein noch minimalistischeres Erscheinungsbild. Die Navigationsleiste am Rand verschwindet dann komplett."}, {"id": "niagara-054", "source": "niagara", "category": "Customization", "name": "Element Show/Hide Toggle", "description": "Einzeln festlegen, welche UI-Elemente auf dem Startbildschirm sichtbar sein sollen: Uhr, Datum, Wetter, Buchstaben-Index und mehr. So lässt sich der Startbildschirm genau auf die eigenen Bedürfnisse zuschneiden — von voll ausgestattet bis extrem reduziert."}, {"id": "niagara-055", "source": "niagara", "category": "Niagara Button", "name": "Niagara Button (Google Button Replacement)", "description": "Anpassbare Schaltfläche, die den Google-Button ersetzt. Einer beliebigen App, einem Shortcut, einem Ordner oder einer Aktion kann per Tippen zugewiesen werden. Unterstützt auch eine Wisch-nach-oben-Geste für eine zweite Aktion. Shortcuts und Ordner nur in der Pro-Version."}, {"id": "niagara-056", "source": "niagara", "category": "Niagara Button", "name": "Niagara Button Quick Actions", "description": "Vom Niagara-Button aus den Taschenrechner starten, eine WhatsApp-Unterhaltung beginnen, Popup-Ordner öffnen oder beliebige andere benutzerdefinierte Aktionen ausführen. Ein vielseitiger Schnellzugriff, der sich an den eigenen Workflow anpassen lässt."}, {"id": "niagara-057", "source": "niagara", "category": "Digital Wellbeing", "name": "Usage Breaker (App Timer)", "description": "Apps auswählen, die man zu viel nutzt, und sanfte Erinnerungen erhalten: Nach einer eingestellten Zeit zeigt der Launcher die Sitzungsdauer und ermutigt zu einer Pause. Kein harter Blocker, sondern ein achtsamer Hinweis. Nur in der Pro-Version."}, {"id": "niagara-058", "source": "niagara", "category": "Digital Wellbeing", "name": "App Usage Tracking", "description": "Verfolgt die Nutzungszeit pro App mithilfe der integrierten Android-Nutzungserfassung. Fokussiert sich auf 'potenziell unerwünschte Handynutzung' statt auf reine Bildschirmzeit — misst also die Apps, die am ehesten zur Ablenkung beitragen."}, {"id": "niagara-059", "source": "niagara", "category": "Media", "name": "Headset Auto-Detection / Plug and Play", "description": "Startet automatisch deine Musik-App, wenn Kopfhörer oder Lautsprecher verbunden werden. Unterstützt Bluetooth, BLE-Headsets, Hörgeräte und USB-Kopfhörer. So ist die Musik sofort bereit, sobald du deine Kopfhörer einsteckst oder verbindest."}, {"id": "niagara-060", "source": "niagara", "category": "Integration", "name": "KLWP/KWGT Integration", "description": "Exportiert Variablen an KLWP/KWGT (bekannte Android-Widget-Customization-Apps) für fortgeschrittene Live-Wallpaper- und Widget-Anpassungen. Die Variablen umfassen Bildschirmzustand, Kalendertermine, Medienplayer-Status und 6 Farbpaletten-Werte. Unterstützt auch das niagara:// URL-Schema."}, {"id": "niagara-061", "source": "niagara", "category": "Integration", "name": "KLWP Color Variables", "description": "Exportiert Farbvariablen (Hintergrundfarbe, Text-auf-Hintergrund-Farbe, Textfarbe, Akzentfarbe, Oberflächenfarbe, Text-auf-Oberfläche-Farbe) an KLWP/KWGT. Damit können selbst gebaute Widgets farblich perfekt zum Niagara-Theme passen."}, {"id": "niagara-062", "source": "niagara", "category": "Backup", "name": "Backup & Restore", "description": "Erstellt .nlb-Sicherungsdateien mit Favoriten, Icons, Popup-Ordnern, App-Namen und Einstellungen. Auf neuen Geräten wiederherstellen — unabhängig von Androids Cloud-Backups (die Niagara als unzuverlässig einstuft). Seit einem Update wird auch die Widget-Platzierung gesichert."}, {"id": "niagara-063", "source": "niagara", "category": "Backup", "name": "Quick Share Transfer", "description": "Sicherungsdateien zwischen Geräten über Androids eingebaute Quick-Share-Funktion (ab Android 6) übertragen. Einfach die .nlb-Datei per Quick Share an das andere Gerät senden — kein Cloud-Upload nötig."}, {"id": "niagara-064", "source": "niagara", "category": "Performance", "name": "Lightweight / Low Resource Usage", "description": "Minimaler RAM- und CPU-Verbrauch. Funktioniert auch gut auf älteren Handys und Tablets mit begrenzten Ressourcen. Der Launcher fühlt sich dadurch schnell und flüssig an, selbst auf schwächerer Hardware."}, {"id": "niagara-065", "source": "niagara", "category": "Performance", "name": "Wide Android Compatibility", "description": "Unterstützt Android ab Version 5.0 (Lollipop) und neuer. Funktioniert auf einer riesigen Bandbreite von Geräten, einschließlich älterer Hardware. Dadurch kann man den Launcher auch auf alten Handys nutzen, die noch im Einsatz sind."}, {"id": "niagara-066", "source": "niagara", "category": "Privacy", "name": "Ad-Free Experience", "description": "Komplett werbefrei, sowohl in der kostenlosen als auch in der Pro-Version. Kein Tracking, keine Werbe-Anzeigen, keine gesponserten Inhalte. Man wird nicht mit Werbung belästigt, egal welche Version man nutzt."}, {"id": "niagara-067", "source": "niagara", "category": "Privacy", "name": "Optional Accessibility Service", "description": "Der Accessibility-Service (für Doppeltipp-Bildschirmsperre) ist optional und standardmäßig deaktiviert. Es wird ausdrücklich betont, dass keine Daten gesammelt oder weitergegeben werden. Man muss ihn nur einschalten, wenn man die Doppeltipp-Sperre nutzen will."}, {"id": "niagara-068", "source": "niagara", "category": "Pricing", "name": "Freemium Model", "description": "Kostenlose Version mit allen Kernfunktionen. Pro schaltet erweiterte Anpassung, Widgets, Themes und Digital-Wellbeing-Funktionen frei. Preis: ca. 14€/Jahr oder 45€ einmalig für eine lebenslange Lizenz."}, {"id": "niagara-069", "source": "niagara", "category": "Pricing", "name": "Referral Program", "description": "Empfehlungsprogramm: Einen Freund einladen und dieser bekommt 50 Tage kostenlosen Zugang zu Niagara Pro. Eine einfache Möglichkeit, den Launcher weiterzuempfehlen."}, {"id": "niagara-070", "source": "niagara", "category": "Customization", "name": "Settings Organization (Features + Look)", "description": "Einstellungen sind übersichtlich aufgeteilt in 'Funktionen' (Suche, Benachrichtigungen, Widgets, Shortcuts) und 'Aussehen' (Buchstaben-Index, Statusleiste, Themes, Icons). Durch diese klare Trennung findet man schnell die gewünschte Einstellung."}, {"id": "niagara-071", "source": "niagara", "category": "Home Screen", "name": "Two-Column Layout Option", "description": "Optionales zweispaltiges Layout für Geräte mit großem Bildschirm und Tablets. Verteilt den Inhalt über zwei Spalten, um die breitere Bildschirmfläche besser auszunutzen. Sinnvoll bei Tablets oder faltbaren Handys im aufgeklappten Zustand."}, {"id": "niagara-072", "source": "niagara", "category": "Customization", "name": "Anycon Color Customization", "description": "Jeder Anycon-Stil unterstützt Farbanpassung: Theme-Farben einstellen, Linienstärke anpassen (bei Material/Outline) und zwischen Original- oder themenbasierten Farbpaletten wählen. So lassen sich die Icon-Packs noch genauer an den eigenen Stil anpassen."}, {"id": "niagara-073", "source": "niagara", "category": "Updates", "name": "Frequent Updates & Active Development", "description": "Regelmäßige saisonale Updates (Frühling, Sommer, Winter, Artistic). Kleines Team (ehemals Studenten, mittlerweile Absolventen) entwickelt aktiv weiter. Aktive Discord-Community für Feedback und Themenaustausch. Der Launcher wird ständig verbessert."}, {"id": "niagara-074", "source": "niagara", "category": "Updates", "name": "Company: Mellowdrop Studio", "description": "Niagara Launcher wird von Mellowdrop Studio (ehemals Bitpit) entwickelt, gegründet von Peter Huber. Ein kleines unabhängiges Studio, kein Großkonzern — man unterstützt mit dem Kauf der Pro-Version direkt die Entwickler."}, {"id": "owui-001", "source": "openwebui", "category": "Chat Interface", "name": "Streaming Response with Auto-Scroll", "description": "Antworten des Modells werden Wort für Wort live angezeigt, statt erst am Ende als Ganzes. Die Ansicht scrollt dabei automatisch mit, damit man immer den neuesten Text sieht. In den Einstellungen lässt sich das Auto-Scrollen abschalten, wenn man lieber weiter oben im Gespräch lesen möchte, während die KI noch schreibt."}, {"id": "owui-002", "source": "openwebui", "category": "Chat Interface", "name": "Fade Effect for Streaming Text", "description": "Ein optionaler Einblend-Effekt lässt den gestreamten Text sanft erscheinen statt abrupt aufzuploppen. Das gibt dem Chat ein flüssigeres, angenehmeres Gefühl beim Zuschauen. Kann in den Einstellungen ein- oder ausgeschaltet werden."}, {"id": "owui-003", "source": "openwebui", "category": "Chat Interface", "name": "Multi-Model Side-by-Side", "description": "Zwei verschiedene KI-Modelle gleichzeitig im selben Chat laufen lassen und deren Antworten direkt nebeneinander vergleichen. Die Antworten können in zwei Spalten oder als Tabs angezeigt werden. Praktisch um zu sehen, welches Modell für eine bestimmte Aufgabe besser geeignet ist."}, {"id": "owui-004", "source": "openwebui", "category": "Chat Interface", "name": "Multi-Model Response Tabs", "description": "Wenn mehrere Modelle gleichzeitig antworten, können deren Antworten als Tabs statt nebeneinander angezeigt werden. Spart Platz und eignet sich besser für schmale Bildschirme oder lange Antworten. Umschaltbar in den Einstellungen."}, {"id": "owui-005", "source": "openwebui", "category": "Chat Interface", "name": "Chat Bubble UI", "description": "Optionale Sprechblasen-Darstellung wie bei Messenger-Apps: Eigene Nachrichten rechts, KI-Antworten links. Eine Alternative zum Standard-Layout, bei dem alles untereinander in einer Spalte steht. Kann in den Einstellungen aktiviert werden."}, {"id": "owui-006", "source": "openwebui", "category": "Chat Interface", "name": "Chat Background Image", "description": "Ein eigenes Hintergrundbild für den Chat-Bereich festlegen, z.B. ein Wallpaper oder eine Textur. Wird über eine URL konfiguriert und unterstützt PNG, JPEG, WebP und GIF. Gibt dem Chat eine persönliche Note."}, {"id": "owui-007", "source": "openwebui", "category": "Chat Interface", "name": "Widescreen Mode", "description": "Erweitert den Chat-Bereich, damit er mehr horizontalen Platz auf dem Bildschirm nutzt. Besonders nützlich auf breiten Monitoren, wo der Chat sonst nur eine schmale Spalte in der Mitte einnimmt. Umschaltbar in den Einstellungen."}, {"id": "owui-008", "source": "openwebui", "category": "Chat Interface", "name": "Chat Direction (LTR/RTL)", "description": "Die Textrichtung im Chat kann auf Automatisch, Links-nach-Rechts oder Rechts-nach-Links gestellt werden. Wichtig für Sprachen wie Arabisch oder Hebräisch, die von rechts nach links geschrieben werden. Ermöglicht mehrsprachige Nutzung."}, {"id": "owui-009", "source": "openwebui", "category": "Chat Interface", "name": "Temporary Chat", "description": "Ein temporäres Gespräch starten, das nicht im Verlauf gespeichert wird. Praktisch für schnelle Fragen, die man nicht aufheben möchte. Kann als Standard-Verhalten eingestellt oder einzeln per /temporary-Befehl aktiviert werden."}, {"id": "owui-010", "source": "openwebui", "category": "Chat Interface", "name": "Chat Overview Map", "description": "Eine Übersichtskarte des gesamten Gesprächs, erreichbar über den Übersicht-Tab in den Chat-Steuerungen. Zeigt die Struktur der Konversation auf einen Blick, damit man sich in langen Gesprächen schnell zurechtfindet und zu bestimmten Stellen springen kann."}, {"id": "owui-011", "source": "openwebui", "category": "Chat Interface", "name": "Fork Chat", "description": "Ein Gespräch an beliebiger Stelle abzweigen und als eigenständige Kopie weiterführen. Der neue Chat enthält den Verlauf bis zu dieser Nachricht. Nützlich, wenn man einen anderen Weg ausprobieren möchte, ohne das Original zu verändern."}, {"id": "owui-012", "source": "openwebui", "category": "Chat Interface", "name": "Reference Chats", "description": "Ein anderes Gespräch als Klartext-Kontext an den aktuellen Chat anhängen, ohne es in Stücke zu zerlegen. So kann das Modell auf frühere Diskussionen Bezug nehmen, ohne dass man alles nochmal eintippen muss."}, {"id": "owui-013", "source": "openwebui", "category": "Chat Interface", "name": "Message Queue", "description": "Weiter tippen und Nachrichten abschicken, während die KI noch antwortet. Die Nachrichten werden in einer Warteschlange gesammelt und automatisch gesendet, sobald das Modell bereit ist. Man muss also nicht warten, bis die aktuelle Antwort fertig ist."}, {"id": "owui-014", "source": "openwebui", "category": "Chat Interface", "name": "Follow-Up Prompts", "description": "Nach jeder KI-Antwort werden automatisch passende Folgefragen als anklickbare Chips vorgeschlagen. Man kann sie direkt anklicken statt selbst tippen zu müssen. Die Vorschläge können im Chat bleiben oder ins Eingabefeld übernommen werden."}, {"id": "owui-015", "source": "openwebui", "category": "Chat Interface", "name": "Prompt Suggestions (Starter Chips)", "description": "In neuen, leeren Chats werden anklickbare Starter-Vorschläge angezeigt, z.B. 'Erkläre diesen Code Schritt für Schritt'. Können pro Modell konfiguriert und pro Sprache übersetzt werden. Helfen beim Einstieg ins Gespräch."}, {"id": "owui-016", "source": "openwebui", "category": "Chat Interface", "name": "Floating Quick Action Buttons", "description": "Frei schwebende Schnellzugriff-Buttons im Chat für häufig benutzte Aktionen. Können individuell konfiguriert und ein- oder ausgeblendet werden. Sparen Klicks bei wiederkehrenden Aufgaben."}, {"id": "owui-017", "source": "openwebui", "category": "Message Display", "name": "Markdown Rendering", "description": "Volle Markdown-Darstellung in Nutzer- und KI-Nachrichten: Überschriften, Listen, fett/kursiv, Links, Tabellen werden alle formatiert angezeigt. Kann unabhängig für Nutzer- und KI-Nachrichten ein- oder ausgeschaltet werden. Macht Antworten deutlich lesbarer."}, {"id": "owui-018", "source": "openwebui", "category": "Message Display", "name": "LaTeX Rendering", "description": "Mathematische Formeln und Gleichungen werden direkt im Chat als hübsch formatierte Ausdrücke dargestellt, statt als roher LaTeX-Code. Ideal für technische und wissenschaftliche Gespräche, bei denen Formeln vorkommen."}, {"id": "owui-019", "source": "openwebui", "category": "Message Display", "name": "Syntax-Highlighted Code Blocks", "description": "Codeblöcke werden mit sprachspezifischer Syntaxhervorhebung angezeigt — Schlüsselwörter, Strings und Kommentare in verschiedenen Farben. Dazu gibt es einen Kopier-Button und ein Sprach-Label. Code-Blöcke können auf Wunsch immer eingeklappt dargestellt werden."}, {"id": "owui-020", "source": "openwebui", "category": "Message Display", "name": "Mermaid Diagram Rendering", "description": "Mermaid-Diagramm-Code in Nachrichten wird automatisch als visuelles Diagramm dargestellt (Flussdiagramme, Sequenzdiagramme, Gantt-Charts usw.). Man sieht das fertige Bild direkt im Chat statt nur den Quellcode."}, {"id": "owui-021", "source": "openwebui", "category": "Message Display", "name": "Table Rendering", "description": "Markdown-Tabellen werden als formatierte HTML-Tabellen mit sauberen Spalten und Zeilen dargestellt. Deutlich besser lesbar als die rohe Markdown-Syntax, besonders bei Datenvergleichen oder strukturierten Übersichten."}, {"id": "owui-022", "source": "openwebui", "category": "Message Display", "name": "Writing & Content Blocks", "description": "Antworten mit speziellen Inhaltsblöcken (Colon-Fence-Syntax) werden als gestylte Container dargestellt, ähnlich wie ein Dokument mit Abschnitten. Ermöglicht strukturierte, dokumentartige Ausgaben innerhalb des Chats."}, {"id": "owui-023", "source": "openwebui", "category": "Message Display", "name": "Link Rendering (Safe Links)", "description": "Links werden nur für sichere Protokolle (http, https, mailto, tel) als anklickbare Verweise dargestellt. Andere Protokolle erscheinen als Klartext aus Sicherheitsgründen. Schützt vor potenziell gefährlichen Links in KI-Antworten."}, {"id": "owui-024", "source": "openwebui", "category": "Message Display", "name": "Citations & Source References", "description": "Wenn RAG oder Websuche benutzt wird, erscheinen Quellenangaben neben der Antwort. Man kann nachvollziehen, woher die Information stammt, und direkt zur Originalquelle springen. Erhöht die Vertrauenswürdigkeit der Antworten."}, {"id": "owui-025", "source": "openwebui", "category": "Message Display", "name": "Reasoning/Thinking Display", "description": "Spezielle Darstellung für Modelle, die ihre Gedankenkette sichtbar machen (Thinking-Tags). Die Denkschritte werden in einklappbaren Abschnitten angezeigt, sodass man nachvollziehen kann, wie die KI zur Antwort gekommen ist, ohne dass es den Chat überfüllt."}, {"id": "owui-026", "source": "openwebui", "category": "Message Display", "name": "Status Updates / Progress Indicators", "description": "Fortschrittsanzeigen während das Modell arbeitet, z.B. bei Tool-Aufrufen oder Dokumentensuche. Zeigt an, was die KI gerade tut, statt nur einen Ladebalken zu zeigen. Man sieht z.B. 'Durchsuche Wissensdatenbank...' oder 'Führe Websuche aus...'."}, {"id": "owui-027", "source": "openwebui", "category": "Message Display", "name": "Display Username vs 'You'", "description": "Option, den eigenen Benutzernamen statt 'Du' bei eigenen Nachrichten anzuzeigen. Sinnvoll in geteilten Umgebungen oder wenn man Gespräche teilt, damit klar ist, wer geschrieben hat."}, {"id": "owui-028", "source": "openwebui", "category": "Message Editing", "name": "Edit User Messages", "description": "Bereits gesendete Nachrichten nachträglich bearbeiten und die KI-Antwort ab diesem Punkt neu generieren lassen. Nützlich, wenn man einen Tippfehler korrigieren oder die Frage umformulieren möchte, ohne ein neues Gespräch starten zu müssen."}, {"id": "owui-029", "source": "openwebui", "category": "Message Editing", "name": "Structured Response Editing", "description": "Einklappbare Editor-Felder für Tool-Aufrufe, Denkblöcke und Code-Ausgaben in KI-Nachrichten. Bei komplexen Nachrichten mit Tool-Calls kann man zwischen formatierter Ansicht und rohem JSON umschalten, um die Details zu inspizieren."}, {"id": "owui-030", "source": "openwebui", "category": "Message Editing", "name": "Regenerate Response", "description": "Die Antwort des Modells neu generieren lassen, wenn sie nicht zufriedenstellend war. Ein Menü bietet verschiedene Optionen für die Neugenerierung. So kann man mehrere Varianten ausprobieren, ohne die Frage nochmal stellen zu müssen."}, {"id": "owui-031", "source": "openwebui", "category": "Message Editing", "name": "Copy Response to Clipboard", "description": "Den Text einer KI-Antwort in die Zwischenablage kopieren, wahlweise als formatierten oder als reinen Text. Kann so eingestellt werden, dass jede Antwort automatisch kopiert wird. Spart den Umweg über Markieren und Rechtsklick."}, {"id": "owui-032", "source": "openwebui", "category": "Input", "name": "Expandable Message Box", "description": "Wenn der Text im Eingabefeld auf eine zweite Zeile umbricht, erscheint ein Button, der einen großen Editor mit Formatierungs-Toolbar öffnet. Ideal für längere Nachrichten oder wenn man vor dem Absenden noch formatieren möchte."}, {"id": "owui-033", "source": "openwebui", "category": "Input", "name": "Rich Text Input", "description": "Formatierungsmöglichkeiten direkt im Eingabefeld: fett, kursiv, Listen usw. über eine schwebende Formatierungs-Toolbar. Kann in den Einstellungen ein- oder ausgeschaltet werden. Macht es einfacher, strukturierte Nachrichten zu verfassen."}, {"id": "owui-034", "source": "openwebui", "category": "Input", "name": "Prompt Autocomplete", "description": "KI-gestützte Textvervollständigung, die beim Tippen inline Vorschläge anzeigt und hilft, Prompts schneller zu formulieren. Nutzt ein Task-Modell im Hintergrund. Ähnlich wie Autocomplete in einer IDE, nur für Chat-Eingaben."}, {"id": "owui-035", "source": "openwebui", "category": "Input", "name": "Slash Commands (/)", "description": "Eingebaute Befehle wie /compact, /status, /fork, /model, /settings, /temporary für schnelle Aktionen direkt aus dem Eingabefeld. Tippe / und es erscheint eine Liste verfügbarer Befehle. Spart Klicks durch die Menüs."}, {"id": "owui-036", "source": "openwebui", "category": "Input", "name": "@ Model Mentions", "description": "Tippe @ um innerhalb eines Gesprächs das Modell zu wechseln oder in Kanal-Gesprächen gezielt ein Modell anzusprechen. Das Modell wird sofort aktiviert, ohne durch Dropdown-Menüs navigieren zu müssen."}, {"id": "owui-037", "source": "openwebui", "category": "Input", "name": "# URL/Document Mentions", "description": "Tippe # gefolgt von einer URL, um eine Webseite direkt in den Chat zu ziehen, oder verweise auf hochgeladene Dokumente. Das Modell kann dann Fragen zu diesem Inhalt beantworten, ohne dass man den Text manuell kopieren muss."}, {"id": "owui-038", "source": "openwebui", "category": "Input", "name": "$ Skill Mentions", "description": "Tippe $ um Skills (spezielle Fähigkeiten) spontan zu aktivieren und deren Anweisungen in den Gesprächskontext einzufügen. So kann das Modell on-the-fly spezialisiertes Wissen abrufen, ohne dass man es vorher konfigurieren muss."}, {"id": "owui-039", "source": "openwebui", "category": "Input", "name": ": Emoji Picker", "description": "Tippe : im Eingabefeld, um einen Emoji-Auswahldialog zu öffnen. Einfacher als die System-Emoji-Tastatur, da man direkt im Chat nach Emojis suchen kann."}, {"id": "owui-040", "source": "openwebui", "category": "Input", "name": "Enter vs Ctrl+Enter Send", "description": "Einstellbares Sendeverhalten: Enter zum Absenden (Standard) oder Ctrl+Enter zum Absenden (dann erzeugt Enter einen Zeilenumbruch). Wichtig für Nutzer, die oft mehrzeilige Nachrichten schreiben und versehentliches Absenden vermeiden wollen."}, {"id": "owui-041", "source": "openwebui", "category": "Input", "name": "Paste Large Text as File", "description": "Wenn man einen sehr langen Text einfügt, kann dieser automatisch als Dateianhang statt als Inline-Text behandelt werden. Verhindert, dass das Eingabefeld durch riesige Textblöcke unübersichtlich wird, und nutzt den Kontext effizienter."}, {"id": "owui-042", "source": "openwebui", "category": "Input", "name": "Keyboard Shortcuts (Rebindable)", "description": "Frei belegbare Tastenkürzel für häufige Aktionen, verwaltbar unter Einstellungen > Tastatur. Man kann die Kürzel nach eigenen Vorlieben anpassen, z.B. für neuen Chat, Suche oder Seitenleiste umschalten."}, {"id": "owui-043", "source": "openwebui", "category": "File Handling", "name": "File Upload (Documents)", "description": "PDFs, Textdateien und andere Dokumente hochladen, damit die KI sie analysieren kann. Unterstützt Drag-and-Drop — einfach die Datei in den Chat ziehen. Das Modell kann dann Fragen zum Inhalt beantworten oder Zusammenfassungen erstellen."}, {"id": "owui-044", "source": "openwebui", "category": "File Handling", "name": "Image Upload & Analysis", "description": "Bilder hochladen, damit Modelle mit Bilderkennungs-Fähigkeit (Vision) sie analysieren und besprechen können. Man kann z.B. ein Foto von einem Fehlerbildschirm schicken und fragen, was das Problem ist."}, {"id": "owui-045", "source": "openwebui", "category": "File Handling", "name": "Upload Mode Toggle (Focused vs Full)", "description": "Per Klick auf einen Anhang zwischen zwei Modi umschalten: 'Fokussierte Suche' (semantische Suche in Dokumentstücken — effizient bei großen Dateien) und 'Voller Kontext' (das gesamte Dokument wird komplett an das Modell übergeben — besser für kurze Dokumente)."}, {"id": "owui-046", "source": "openwebui", "category": "File Handling", "name": "Image Compression", "description": "Automatische Bildkomprimierung beim Hochladen mit einstellbaren Maßen. Kann pro Kontext aktiviert oder deaktiviert werden. Spart Token und beschleunigt die Verarbeitung, besonders bei hochauflösenden Fotos."}, {"id": "owui-047", "source": "openwebui", "category": "File Handling", "name": "Cloud File Picking (Google Drive / OneDrive)", "description": "Dateien direkt aus Google Drive oder OneDrive/SharePoint importieren, ohne sie erst herunterladen zu müssen. Native Integration für Firmenumgebungen, in denen Dokumente in der Cloud liegen."}, {"id": "owui-048", "source": "openwebui", "category": "Model Selection", "name": "Model Selector Dropdown", "description": "Durchsuchbares Dropdown-Menü am oberen Rand des Chats zur Auswahl des aktiven Modells. Zeigt Modellname, Beschreibung und Tags an. Tippt man einen Suchbegriff, werden die Ergebnisse live gefiltert."}, {"id": "owui-049", "source": "openwebui", "category": "Model Selection", "name": "Pin Models to Sidebar", "description": "Häufig benutzte Modelle als Schnellzugriff in der Seitenleiste anpinnen. Ein Klick genügt, um sofort einen neuen Chat mit dem bevorzugten Modell zu starten, ohne jedes Mal das Dropdown zu öffnen."}, {"id": "owui-050", "source": "openwebui", "category": "Model Selection", "name": "Model Filter & Bulk Actions", "description": "Modelle nach Status filtern (aktiviert, deaktiviert, sichtbar, versteckt, öffentlich, privat) und mehrere gleichzeitig aktivieren, deaktivieren oder ein-/ausblenden. Nützlich in Umgebungen mit vielen Modellen, um Ordnung zu halten."}, {"id": "owui-051", "source": "openwebui", "category": "Model Selection", "name": "Drag-to-Reorder Models", "description": "Modelle im Auswahl-Dropdown per Drag-and-Drop umsortieren (wenn keine Suche oder Filter aktiv sind). So kann man die wichtigsten Modelle nach oben ziehen für schnelleren Zugriff."}, {"id": "owui-052", "source": "openwebui", "category": "Model Selection", "name": "/model Slash Command", "description": "Per /model-Befehl im Eingabefeld das Modell wechseln oder anzeigen, welches gerade aktiv ist. Schneller als der Weg über das Dropdown, besonders für Poweruser."}, {"id": "owui-053", "source": "openwebui", "category": "Sidebar & Navigation", "name": "Conversation List with Search", "description": "Die Seitenleiste zeigt alle bisherigen Gespräche mit Suchfunktion. Man kann nach Stichworten suchen, um ein bestimmtes Gespräch wiederzufinden, statt endlos scrollen zu müssen."}, {"id": "owui-054", "source": "openwebui", "category": "Sidebar & Navigation", "name": "Folders & Tags for Chats", "description": "Gespräche in Ordner sortieren und mit Tags versehen für bessere Organisation. Ordner können in Projekt-Arbeitsbereiche umgewandelt werden, die eigene System-Prompts und Wissensdatenbanken haben."}, {"id": "owui-055", "source": "openwebui", "category": "Sidebar & Navigation", "name": "Sidebar Hover Previews", "description": "Beim Hovern über einen Chat in der Seitenleiste erscheint eine Vorschau der letzten Nachrichten. So erkennt man schnell, worum es in einem Gespräch ging, ohne es öffnen zu müssen. Bei langsamen Verbindungen standardmäßig deaktiviert."}, {"id": "owui-056", "source": "openwebui", "category": "Sidebar & Navigation", "name": "Mobile Swipe Sidebar", "description": "Auf Handy und Tablet kann die Seitenleiste durch Wischen nach rechts geöffnet und nach links geschlossen werden, mit visuellem Feedback. Fühlt sich natürlich an wie in einer nativen App."}, {"id": "owui-057", "source": "openwebui", "category": "Sidebar & Navigation", "name": "Three-Dot Menu per Chat", "description": "Ein immer sichtbares Drei-Punkte-Menü bei jedem Chat-Eintrag in der Seitenleiste. Bietet schnellen Zugriff auf Aktionen wie Umbenennen, Löschen, Teilen — besonders wichtig auf Mobilgeräten, wo langes Drücken umständlich ist."}, {"id": "owui-058", "source": "openwebui", "category": "Sidebar & Navigation", "name": "Pinned Chats", "description": "Wichtige Gespräche oben in der Seitenleiste anpinnen, damit sie immer sofort erreichbar sind und nicht von neuen Chats nach unten verdrängt werden."}, {"id": "owui-059", "source": "openwebui", "category": "Sidebar & Navigation", "name": "Chat Title Auto-Generation", "description": "Chat-Titel werden automatisch aus dem Gesprächsinhalt generiert, damit man nicht selbst benennen muss. Kann ausgeschaltet werden, wenn man lieber eigene Titel vergibt."}, {"id": "owui-060", "source": "openwebui", "category": "Sidebar & Navigation", "name": "Chat Title in Browser Tab", "description": "Option, den aktuellen Chat-Titel im Browser-Tab anzuzeigen. Erleichtert die Orientierung, wenn man mehrere Tabs offen hat, da man sofort sieht, welcher Tab welches Gespräch enthält."}, {"id": "owui-061", "source": "openwebui", "category": "Sidebar & Navigation", "name": "Auto-Tag Generation", "description": "Tags werden automatisch basierend auf dem Gesprächsinhalt erzeugt, z.B. 'Python', 'Rezept', 'Mathe'. Hilft bei der Organisation, ohne dass man selbst daran denken muss, Gespräche zu kategorisieren."}, {"id": "owui-062", "source": "openwebui", "category": "Sidebar & Navigation", "name": "Landing Page Mode", "description": "Auswahl, ob beim Öffnen der App eine Startseite mit Übersicht gezeigt wird oder ob man direkt in die Chat-Ansicht springt. Je nach Vorliebe und Nutzungsmuster einstellbar."}, {"id": "owui-063", "source": "openwebui", "category": "Sharing & Export", "name": "Chat Sharing (Local & Community)", "description": "Gespräche lokal innerhalb der eigenen Instanz oder über die Open WebUI Community-Plattform teilen. Datenschutz-Einstellungen bestimmen, was geteilt wird. Nützlich um Lösungen mit Kollegen zu teilen."}, {"id": "owui-064", "source": "openwebui", "category": "Sharing & Export", "name": "Stylized PDF Export", "description": "Chats als gestylte PDF-Dokumente exportieren, bei denen die Formatierung (Code-Blöcke, Überschriften, Listen) erhalten bleibt. Ideal um KI-Gespräche als Dokumentation oder Referenz zu archivieren."}, {"id": "owui-065", "source": "openwebui", "category": "Sharing & Export", "name": "Copy Chat Link", "description": "Einen teilbaren Link zu einem Chat generieren, der auch das verwendete Modell als Parameter enthält. So kann jemand anderes denselben Chat mit denselben Einstellungen öffnen."}, {"id": "owui-066", "source": "openwebui", "category": "Sharing & Export", "name": "Model Export/Import (JSON)", "description": "Modell-Voreinstellungen als JSON-Dateien exportieren und importieren, inklusive Hintergrundbilder. Ermöglicht einfaches Teilen von Agent-Konfigurationen zwischen Instanzen oder mit anderen Nutzern."}, {"id": "owui-067", "source": "openwebui", "category": "Voice & Audio", "name": "Voice Mode (Hands-Free Conversation)", "description": "Komplett freihändige Sprachkonversation: Sprachmodus-Button drücken, sprechen, und die KI-Antwort wird Satz für Satz vorgelesen. Das Gespräch wird trotzdem als lesbarer Text gespeichert. Ideal z.B. beim Kochen oder Autofahren."}, {"id": "owui-068", "source": "openwebui", "category": "Voice & Audio", "name": "Speech-to-Text (STT)", "description": "Nachrichten per Spracheingabe diktieren statt tippen. Unterstützt verschiedene STT-Engines: lokales Whisper (privat, kein Internet nötig), OpenAI, Azure, Deepgram, Mistral. Die erkannte Sprache wird als Text im Eingabefeld angezeigt."}, {"id": "owui-069", "source": "openwebui", "category": "Voice & Audio", "name": "Text-to-Speech (TTS)", "description": "KI-Antworten vorlesen lassen statt selbst zu lesen. Unterstützt verschiedene TTS-Engines: Azure, ElevenLabs, OpenAI, Transformers, WebAPI. Die Stimme kann pro Modell individuell gewählt werden."}, {"id": "owui-070", "source": "openwebui", "category": "Voice & Audio", "name": "Voice Cloning", "description": "Die Stimme der KI personalisieren — eigene Stimmcharakteristiken anpassen für individualisierte Audio-Antworten. So kann die KI z.B. mit einer bestimmten Stimmlage oder einem bestimmten Stil sprechen."}, {"id": "owui-071", "source": "openwebui", "category": "Voice & Audio", "name": "Voice/Video Call", "description": "Integrierte Sprach- und Videoanrufe mit dem Modell. Bei Vision-fähigen Modellen kann die Kamera als Eingabe genutzt werden — man zeigt etwas und fragt, was die KI sieht. Fühlt sich an wie ein Videogespräch."}, {"id": "owui-072", "source": "openwebui", "category": "Voice & Audio", "name": "Voice Interruption", "description": "Option, die KI mitten im Sprechen unterbrechen zu können. Nützlich wenn die Antwort in die falsche Richtung geht und man sofort korrigieren möchte, statt warten zu müssen. Umschaltbar in den Einstellungen."}, {"id": "owui-073", "source": "openwebui", "category": "Voice & Audio", "name": "Emoji Display in Call", "description": "Während Sprach-/Videoanrufen werden Emoji-Reaktionen angezeigt, die visuelles Feedback geben. Macht die Sprachinteraktion lebendiger und gibt einen Hinweis darauf, wie die KI den Kontext einschätzt."}, {"id": "owui-074", "source": "openwebui", "category": "Image Generation", "name": "Inline Image Generation", "description": "Bilder direkt im Chat aus Textbeschreibungen generieren. Im Eingabefeld den 'Bild'-Modus aktivieren, Prompt eintippen, absenden — das generierte Bild erscheint inline im Gespräch. Kein Wechsel zu einer separaten App nötig."}, {"id": "owui-075", "source": "openwebui", "category": "Image Generation", "name": "Image Editing (Inpainting)", "description": "Ein Bild hochladen und per Textbeschreibung Änderungen vornehmen, z.B. 'Ändere den Hintergrund auf Sonnenuntergang'. Das Modell generiert eine modifizierte Version. Braucht eine Edit-Engine wie ComfyUI oder Gemini."}, {"id": "owui-076", "source": "openwebui", "category": "Image Generation", "name": "Image Compositing", "description": "Mehrere Bilder hochladen und sie per Textbeschreibung zu einer zusammenhängenden Szene kombinieren. Praktisch für kreative Projekte, bei denen man Elemente aus verschiedenen Bildern zusammenführen möchte."}, {"id": "owui-077", "source": "openwebui", "category": "Image Generation", "name": "Multiple Image Engines", "description": "Unterstützt verschiedene Bildgenerierungs-Engines: DALL-E, Gemini, ComfyUI (lokal) und AUTOMATIC1111 (lokal). Verschiedene Checkpoint-Modelle ermöglichen unterschiedliche Stilvarianten — von fotorealistisch bis Illustration."}, {"id": "owui-078", "source": "openwebui", "category": "Knowledge & RAG", "name": "Knowledge Base Collections", "description": "Benannte Dokumentensammlungen unter Workspace > Wissen anlegen. Dateien, Ordner, Webseiten oder Textinhalte hochladen und in verschachtelten Verzeichnissen organisieren. Die KI kann dann gezielt in diesen Sammlungen suchen und Fragen beantworten."}, {"id": "owui-079", "source": "openwebui", "category": "Knowledge & RAG", "name": "Hybrid Search (BM25 + Vector)", "description": "Kombiniert klassische Stichwortsuche (BM25) mit semantischer Vektorsuche und Cross-Encoder-Reranking für bessere Suchergebnisse. Findet relevante Stellen auch wenn die exakten Begriffe nicht übereinstimmen, aber der Sinn passt."}, {"id": "owui-080", "source": "openwebui", "category": "Knowledge & RAG", "name": "Agentic Retrieval", "description": "Modelle durchsuchen und kombinieren eigenständig die Wissensdatenbanken, wenn sie Informationen brauchen, ohne dass man es explizit anweisen muss. Die KI entscheidet selbst, wann und wo sie nachschlagen sollte."}, {"id": "owui-081", "source": "openwebui", "category": "Knowledge & RAG", "name": "Full Context Mode", "description": "Ganze Dokumente komplett in den Kontext einfügen, ohne sie in Stücke zu zerlegen. Keine semantische Suche — das Modell sieht das vollständige Dokument. Ideal für kurze Dokumente, bei denen man sicher sein will, dass nichts übersehen wird."}, {"id": "owui-082", "source": "openwebui", "category": "Knowledge & RAG", "name": "Multiple Vector Databases", "description": "Unterstützung für 13 verschiedene Vektordatenbanken: ChromaDB, PGVector, Qdrant, Milvus, Elasticsearch, Pinecone und weitere. Man kann die Datenbank wählen, die am besten zur eigenen Infrastruktur passt."}, {"id": "owui-083", "source": "openwebui", "category": "Knowledge & RAG", "name": "Multiple Extraction Engines", "description": "8 verschiedene Optionen zum Einlesen von Dokumenten: Tika, Docling, Azure OCR, Mistral OCR und weitere. Verschiedene Engines eignen sich für verschiedene Dateitypen — OCR z.B. für gescannte PDFs."}, {"id": "owui-084", "source": "openwebui", "category": "Knowledge & RAG", "name": "Knowledge Base File Management UI", "description": "Dateiverwaltung für die Wissensdatenbank mit sortierbarer Liste (Titel, Aktualisierungsdatum), Breadcrumb-Navigation, Drag-and-Drop in Ordner, Umbenennen direkt in der Liste, und Ordner erstellen/löschen. Wie ein kleiner Dateimanager."}, {"id": "owui-085", "source": "openwebui", "category": "Knowledge & RAG", "name": "Incremental Sync (SHA-256)", "description": "Intelligente Dateisynchronisation per SHA-256-Hash: nur neue oder geänderte Dateien werden hochgeladen, bestehende übersprungen. Die Ordnerstruktur bleibt erhalten. Spart Zeit und Bandbreite bei großen Dokumentensammlungen."}, {"id": "owui-086", "source": "openwebui", "category": "Web Search", "name": "Web Search in Chat", "description": "Die KI durchsucht in Echtzeit das Internet und liefert Antworten mit Quellenangaben. Unterstützt Dutzende Anbieter: SearXNG, Google PSE, Brave, Kagi, Tavily, Perplexity, Firecrawl. So sind die Antworten immer aktuell, nicht nur aus dem Trainigswissen."}, {"id": "owui-087", "source": "openwebui", "category": "Web Search", "name": "Web Browsing (#URL)", "description": "Jede beliebige Webseite in den Chat ziehen mit dem #-Befehl gefolgt von einer URL. Das Modell kann die Seite auch eigenständig abrufen, wenn es die Information braucht. So kann man z.B. über einen Blogartikel oder eine Dokumentationsseite diskutieren."}, {"id": "owui-088", "source": "openwebui", "category": "Web Search", "name": "Save Search Results to Knowledge", "description": "Ergebnisse aus der Websuche in die persönliche Wissensdatenbank speichern für spätere Nutzung. So baut man sich nach und nach eine Sammlung auf, die die KI bei künftigen Fragen durchsuchen kann."}, {"id": "owui-089", "source": "openwebui", "category": "Memory", "name": "Persistent Memory Across Chats", "description": "Die KI merkt sich Fakten über den Nutzer über mehrere Gespräche hinweg, z.B. bevorzugte Programmiersprache oder Arbeitskontext. In den Daten-Einstellungen kann man verwalten, was gespeichert bleibt und was gelöscht werden soll."}, {"id": "owui-090", "source": "openwebui", "category": "Memory", "name": "Memory Injection per Model", "description": "Gespeicherte Erinnerungen können pro Modell-Preset in den Kontext eingefügt werden. So weiß ein bestimmter Agent z.B. über Projektdetails Bescheid, während ein anderer Agent diese Infos nicht bekommt."}, {"id": "owui-091", "source": "openwebui", "category": "Memory", "name": "Privacy / Data Controls", "description": "Kontrolle darüber, welche Daten gespeichert, geteilt oder pro Anfrage übertragen werden. Erinnerungen, Verlauf und Privatsphäre-Einstellungen können individuell verwaltet werden. Wichtig für datensensible Umgebungen."}, {"id": "owui-092", "source": "openwebui", "category": "Notes", "name": "Notes Workspace (Rich Editor)", "description": "Ein eigener Arbeitsbereich für Inhalte außerhalb von Gesprächen — z.B. Notizen, Entwürfe, Sammlungen. Bietet einen Rich-Text-Editor mit Markdown und Formatierungs-Toolbar. Wie ein eingebauter Notizblock neben dem Chat."}, {"id": "owui-093", "source": "openwebui", "category": "Notes", "name": "AI Enhance for Notes", "description": "Text in einer Notiz markieren und per KI umschreiben oder verbessern lassen, direkt an Ort und Stelle. Ideal um Entwürfe zu polieren, Formulierungen zu verbessern oder Texte zu kürzen/erweitern."}, {"id": "owui-094", "source": "openwebui", "category": "Notes", "name": "Notes as Chat Context", "description": "Notizen an beliebige Chats anhängen, damit das Modell vollen Zugriff auf den Inhalt hat. Modelle können Notizen auch eigenständig durchsuchen, lesen und aktualisieren. So werden Notizen zu lebendigem Wissenskontext."}, {"id": "owui-095", "source": "openwebui", "category": "Channels", "name": "Team Channels", "description": "Echtzeit-Gruppenräume, in denen Team und KI-Modelle gemeinsam in einer Timeline arbeiten. Öffentliche, private, gruppenbasierte und Direktnachrichten-Kanäle verfügbar. Wie Slack oder Discord, aber mit eingebauter KI."}, {"id": "owui-096", "source": "openwebui", "category": "Channels", "name": "@Model Tagging in Channels", "description": "In Kanal-Gesprächen per @-Erwähnung jedes verfügbare KI-Modell spontan hinzuziehen. Man tippt z.B. @claude und das Modell antwortet im Kanal. So kann das Team gemeinsam mit verschiedenen Modellen arbeiten."}, {"id": "owui-097", "source": "openwebui", "category": "Channels", "name": "Threads & Reactions in Channels", "description": "Antwort-Threads, Pins und Emoji-Reaktionen innerhalb von Kanälen für strukturierte Teamdiskussionen. Hält Nebendiskussionen übersichtlich, ohne den Hauptkanal zu überladen."}, {"id": "owui-098", "source": "openwebui", "category": "Agents & Models", "name": "Model Presets / Agent Builder", "description": "Agent-Konfigurationen auf Basis von Grundmodellen erstellen: System-Prompt, Wissensdatenbanken, Tools, Skills, Parameter, Avatar und Hintergrundbild zuweisen. So baut man spezialisierte Assistenten, die sofort einsatzbereit sind."}, {"id": "owui-099", "source": "openwebui", "category": "Agents & Models", "name": "Dynamic Variables in System Prompts", "description": "Dynamische Variablen wie {{USER_NAME}}, {{CURRENT_DATE}}, {{CURRENT_TIME}}, {{USER_GROUPS}} werden automatisch in System-Prompts eingefügt. So kann der Agent z.B. den Nutzer beim Namen ansprechen oder das aktuelle Datum kennen."}, {"id": "owui-100", "source": "openwebui", "category": "Agents & Models", "name": "Bound Tools per Model", "description": "Bestimmte Tools fest an ein Modell-Preset binden, sodass Nutzer einen fertig konfigurierten Agenten bekommen, ohne selbst Tools aktivieren zu müssen. Der Agent hat seine Werkzeuge sofort dabei."}, {"id": "owui-101", "source": "openwebui", "category": "Agents & Models", "name": "Bound Knowledge per Model", "description": "Wissenssammlungen oder Dateien fest an ein Modell-Preset binden. Pro Bindung kann zwischen fokussierter Suche und vollem Kontext umgeschaltet werden. So hat ein spezialisierter Agent immer Zugriff auf sein Fachwissen."}, {"id": "owui-102", "source": "openwebui", "category": "Agents & Models", "name": "Model Access Control", "description": "Modelle auf bestimmte Nutzer oder Gruppen beschränken. Sichtbarkeit als privat oder öffentlich einstellen. Ermöglicht kuratierte Bereitstellungen, bei denen Basis-Modelle versteckt und nur fertige Agenten gezeigt werden."}, {"id": "owui-103", "source": "openwebui", "category": "Agents & Models", "name": "Custom Model Avatar & Background", "description": "Jedem Modell-Preset ein eigenes Avatar-Bild (auch animiertes GIF/WebP) und Hintergrundbild zuweisen. Gibt jedem Agenten eine eigene visuelle Identität, die im Chat sofort erkennbar ist."}, {"id": "owui-104", "source": "openwebui", "category": "Agents & Models", "name": "Model Capabilities Toggles", "description": "Pro Modell einzeln umschalten, welche Fähigkeiten verfügbar sind: Vision, Websuche, Code-Interpreter, Terminal, Bildgenerierung, Datei-Upload, Quellenangaben, Erinnerung und mehr. Feingranulare Kontrolle über das Verhalten jedes Agenten."}, {"id": "owui-105", "source": "openwebui", "category": "Agents & Models", "name": "Advanced Parameters (Temperature, etc.)", "description": "Pro Modell oder pro Chat die Generierungsparameter anpassen: Temperature (Kreativität), Top-P, Stop-Sequenzen und eigene Parameter. Für fortgeschrittene Nutzer, die das Antwortverhalten feintunen möchten."}, {"id": "owui-106", "source": "openwebui", "category": "Agents & Models", "name": "Model Translations", "description": "Pro Sprache eigene Varianten von Modellname, Beschreibung und Prompt-Vorschlägen hinterlegen. Nutzer sehen automatisch die Version in ihrer Sprache. Nützlich für mehrsprachige Teams."}, {"id": "owui-107", "source": "openwebui", "category": "Agents & Models", "name": "Clone Model", "description": "Eine bearbeitbare Kopie eines beliebigen Modell-Presets erstellen. Ideal zum Experimentieren — man kann Einstellungen ändern, ohne das Original zu verändern."}, {"id": "owui-108", "source": "openwebui", "category": "Agents & Models", "name": "Share Model to Community", "description": "Modell-Presets auf der Open WebUI Community-Plattform teilen, damit andere Nutzer sie nutzen können. So entstehen wiederverwendbare Agenten-Vorlagen."}, {"id": "owui-109", "source": "openwebui", "category": "Agents & Models", "name": "Builtin Tools Selection", "description": "Pro Modell festlegen, welche eingebauten Tools verfügbar sind: Zeit & Rechner, Nutzer fragen, Erinnerung, Chat-Verlauf, Notizen, Wissensdatenbank, Dateien, Kanäle, Benachrichtigungen, Websuche, Bildgenerierung, Code-Interpreter, Aufgabenverwaltung, Automationen, Kalender, Sub-Agenten."}, {"id": "owui-110", "source": "openwebui", "category": "Agentic Features", "name": "Sub-agents", "description": "Ein Modell kann fokussierte Teilaufgaben an parallele Sub-Agenten delegieren, die dasselbe Modell und dieselben Tools nutzen. Ermöglicht mehrstufige Workflows, bei denen mehrere Aufgaben gleichzeitig bearbeitet werden."}, {"id": "owui-111", "source": "openwebui", "category": "Agentic Features", "name": "Task Management in Chat", "description": "Agenten können strukturierte Aufgaben-/Todo-Listen im Chat pflegen, um mehrstufige Workflows zu verfolgen. Man sieht, welche Schritte erledigt sind und welche noch ausstehen."}, {"id": "owui-112", "source": "openwebui", "category": "Agentic Features", "name": "Temporal Awareness (Time Tools)", "description": "Modelle kennen die aktuelle Uhrzeit und das Datum und haben native Tools für präzise Zeitberechnungen. So können sie z.B. korrekt sagen 'Das war vor 3 Tagen' oder Deadlines berechnen."}, {"id": "owui-113", "source": "openwebui", "category": "Agentic Features", "name": "Native Function Calling (Agentic Mode)", "description": "Standardmäßiger agentischer Modus, in dem das Modell eigenständig entscheidet, wann es das Internet durchsuchen, Wissensdatenbanken abfragen oder Erinnerungen speichern soll. Kein manuelles Auslösen nötig — die KI handelt von sich aus."}, {"id": "owui-114", "source": "openwebui", "category": "Scheduling & Automation", "name": "Automations (Recurring Prompts)", "description": "Prompts auf wiederkehrenden Zeitplänen automatisch ausführen lassen (stündlich, täglich, wöchentlich, monatlich oder per eigener RRULE). Die Ausführungen erscheinen im Kalender. Ideal für regelmäßige Berichte, Zusammenfassungen oder Prüfungen."}, {"id": "owui-115", "source": "openwebui", "category": "Scheduling & Automation", "name": "Timers (One-Shot)", "description": "Einmalige Timer, die einen Prompt nach Ablauf in den Chat senden. Nützlich z.B. als Erinnerung oder um eine Aufgabe zeitversetzt ausführen zu lassen."}, {"id": "owui-116", "source": "openwebui", "category": "Scheduling & Automation", "name": "Calendar Integration", "description":
