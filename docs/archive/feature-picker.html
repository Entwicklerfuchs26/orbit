 "category": "Chat Interface", "name": "Live Tool-Call Bubbles", "description": "Tool-Aufrufe werden als Live-Blasen während des Streamings angezeigt: Tool-Name, Label und Status (läuft/fertig) sind sichtbar, während der Agent arbeitet. So siehst du in Echtzeit, welche Werkzeuge der Agent gerade benutzt."}, {"id": "hermes-193", "source": "sojus-frontend", "category": "Chat Interface", "name": "Tier-3 Approval in Chat", "description": "Ja/Nein-Freigabe-Buttons für gefährliche Operationen erscheinen direkt im Chatverlauf, verbunden mit dem mcp-approval-service. Gefährliche Aktionen können genehmigt oder abgelehnt werden, ohne den Chat zu verlassen."}, {"id": "hermes-194", "source": "sojus-frontend", "category": "Voice", "name": "Voice Round-Trip", "description": "Kompletter Sprach-Kreislauf: Mikrofon → Whisper STT (auf nous) → Text senden → Antwort → Chatterbox TTS (auf nous) → Vorlesen. Das gleiche Backend wird für Desktop-Widget und mobile App verwendet."}, {"id": "hermes-195", "source": "sojus-frontend", "category": "Voice", "name": "TTS Volume Slider", "description": "Ein Zahnrad-Symbol öffnet die Einstellungen mit einem Lautstärke-Regler für die Sprachausgabe. Desktop nutzt pw-play mit --volume, die App nutzt player.volume. Die Lautstärke wird pro Gerät unabhängig gespeichert."}, {"id": "hermes-196", "source": "sojus-frontend", "category": "Chat Interface", "name": "File Uploads / Attachments", "description": "Dateien können hochgeladen und als Anhänge an Nachrichten im Chat angefügt werden. Der Agent kann die Dateien dann analysieren oder verarbeiten — z.B. Bilder beschreiben oder Dokumente zusammenfassen."}, {"id": "hermes-197", "source": "sojus-frontend", "category": "Chat Interface", "name": "Edit/Delete/Regenerate Messages", "description": "Gesendete Nachrichten können nachträglich bearbeitet oder gelöscht werden. Agenten-Antworten können neu generiert werden, falls das Ergebnis nicht passt. Volle Kontrolle über den Gesprächsverlauf."}, {"id": "hermes-198", "source": "sojus-frontend", "category": "Chat Interface", "name": "Server-Side Chart Rendering", "description": "Der Agent schreibt sojus-chart-Codeblöcke, die serverseitig per Matplotlib als PNG gerendert werden. Ein Workaround für QtWebEngineView-Abstürze — Diagramme werden zuverlässig als Bilder im Chat angezeigt."}, {"id": "hermes-199", "source": "sojus-frontend", "category": "Session", "name": "Hermes Session Continuation", "description": "Nutzt den X-Hermes-Session-Id-Header für native Sitzungsfortsetzung. Hermes kümmert sich intern um die Kontextkomprimierung — lange Gespräche können nahtlos fortgesetzt werden, ohne dass der Kontext überläuft."}, {"id": "hermes-200", "source": "sojus-frontend", "category": "Session", "name": "FTS5 Full-Text Search", "description": "Lokaler SQLite-FTS5-Index über die komplette unkomprimierte Chat-Historie. Über den Endpunkt GET /messages/search?q= können alle vergangenen Gespräche durchsucht werden — findet auch Inhalte aus sehr alten Sitzungen."}, {"id": "hermes-201", "source": "sojus-frontend", "category": "Architecture", "name": "Shared SQLite Backend", "description": "Das Dashboard-Widget (Quickshell/QML) und die Expo-App teilen sich dieselbe SQLite-Datenbank. Der Gesprächsverlauf ist auf Desktop und Handy identisch — eine einzige Datenquelle für alle Clients."}, {"id": "hermes-202", "source": "sojus-frontend", "category": "Architecture", "name": "WebSocket Live Broadcast", "description": "Die sojus-api sendet Nachrichten per WebSocket (/ws) an alle verbundenen Clients gleichzeitig. Neue Nachrichten erscheinen in Echtzeit auf allen Geräten — Desktop-Widget und Handy-App aktualisieren sich sofort."}, {"id": "hermes-203", "source": "sojus-frontend", "category": "Architecture", "name": "Quickshell/QML Desktop Widget", "description": "Ein ca. 1700+ Zeilen großes QML-Widget, eingebettet im Hyprland-Dashboard neben Kalender, Vikunja-Aufgaben, System-Auslastung und News. Der KI-Chat als fester Bestandteil des Desktop-Arbeitsplatzes."}, {"id": "hermes-204", "source": "sojus-frontend", "category": "Architecture", "name": "Expo-Go Mobile App", "description": "Eine React Native/Expo App fürs Handy als mobiler Client, die auf denselben sojus-api-Endpunkt zeigt. Die gleiche Funktionalität wie das Desktop-Widget, optimiert für Touchscreen-Bedienung."}, {"id": "hermes-205", "source": "sojus-frontend", "category": "Voice", "name": "Unified Voice Architecture", "description": "Desktop-Widget und Expo-App nutzen dieselben Backend-Endpunkte für Spracherkennung (/voice/stt) und Sprachausgabe (/voice/tts). Wird eine URL geändert, wirkt sich das sofort auf beide Clients aus — zentrale Konfiguration."}, {"id": "cgui-001", "source": "chatgpt", "category": "Collaborative Editing", "name": "Canvas — Side-by-Side Editor", "description": "Geteilter Bildschirm: links der Chat, rechts ein vollwertiger Dokumenten-Editor. Man kann Inhalte ins Dokument schreiben oder einfügen und dann per Chat gezielt Änderungen an einzelnen Abschnitten anfordern. Nicht nur eine Vorschau wie bei Artifacts — sondern eine echte, gemeinsam nutzbare Bearbeitungsfläche für Texte und Code."}, {"id": "cgui-002", "source": "chatgpt", "category": "Collaborative Editing", "name": "Canvas — Echtzeit-Zusammenarbeit mit mehreren Nutzern", "description": "Mehrere Personen können gleichzeitig am selben Canvas-Dokument arbeiten, Inline-Kommentare an Absätzen oder Code-Blöcken hinterlassen und Abschnitte an Teammitglieder zuweisen. Ähnlich wie bei Google Docs, aber direkt in der KI-Oberfläche integriert."}, {"id": "cgui-003", "source": "chatgpt", "category": "Collaborative Editing", "name": "Canvas — Versionshistorie & Diff", "description": "Zeigt Unterschiede zwischen verschiedenen Dokumentversionen an und erlaubt es, zu früheren Entwürfen zurückzukehren. Man sieht genau, was sich geändert hat und wer die Änderung vorgenommen hat — hilfreich um Überarbeitungen nachzuvollziehen."}, {"id": "cgui-004", "source": "chatgpt", "category": "Collaborative Editing", "name": "Canvas — Export als PDF/Word/ausführbarer Code", "description": "Canvas-Inhalte lassen sich als PDF, Word-Dokument oder als ausführbaren Code mit Syntax-Highlighting exportieren. Das Exportformat passt sich automatisch dem Inhaltstyp an — Text wird als Dokument, Code als lauffähige Datei ausgegeben."}, {"id": "cgui-005", "source": "chatgpt", "category": "Collaborative Editing", "name": "Canvas — Inhaltsvorlagen", "description": "Vorgefertigte Vorlagen für Blogbeiträge, E-Mails, Code-Reviews und Projekt-Briefs, um Canvas-Sitzungen schnell zu starten. Statt bei null anzufangen, wählt man eine Vorlage und passt sie an — spart Zeit beim Einstieg."}, {"id": "cgui-006", "source": "chatgpt", "category": "Deep Research", "name": "Deep Research — Autonomer Recherche-Agent", "description": "Ein autonomer Recherche-Agent, der 5–30 Minuten lang selbstständig arbeitet: er stellt nacheinander Web-Suchanfragen, liest Seiten durch und fasst Ergebnisse zusammen. Während der Arbeit zeigt ein Live-Aktivitäts-Panel die Denkschritte und durchsuchten Webseiten an. Vor der Ausführung kann man den Recherche-Plan überprüfen und anpassen."}, {"id": "cgui-007", "source": "chatgpt", "category": "Deep Research", "name": "Deep Research — Strukturierte Berichte", "description": "Erzeugt formatierte Berichte mit mehreren Abschnitten, Quellenangaben und strukturierten Erkenntnissen — nicht einfach eine Chat-Antwort, sondern ein richtiges, ablieferbares Dokument. Quellen werden direkt zugeordnet, sodass man jede Aussage nachprüfen kann."}, {"id": "cgui-008", "source": "chatgpt", "category": "Deep Research", "name": "Deep Research — MCP-Datenquellen-Anbindung", "description": "Deep Research kann über MCP-Server mit internen Dokumentationen, Wissensdatenbanken oder eigenen Datenquellen verbunden werden. Diese werden dann neben dem öffentlichen Web als Recherche-Quellen genutzt — so kann die KI auch firmeninterne Informationen durchsuchen."}, {"id": "cgui-009", "source": "chatgpt", "category": "Voice", "name": "Advanced Voice — Live-Video-Teilen", "description": "Man richtet die Handy-Kamera auf etwas in der echten Welt, während man sich mit ChatGPT unterhält — die KI sieht in Echtzeit, was die Kamera zeigt, und reagiert darauf. Zum Beispiel: Kamera auf ein kaputtes Gerät richten und fragen 'Was ist hier das Problem?' — die KI erkennt das Bild und antwortet kontextbezogen."}, {"id": "cgui-010", "source": "chatgpt", "category": "Voice", "name": "Advanced Voice — Bildschirmfreigabe", "description": "Den Handybildschirm während eines Sprachgesprächs teilen, um Folien, Dokumente oder Apps zu erklären. Das Modell sieht, was auf dem Bildschirm angezeigt wird, und kann gezielt darauf eingehen — nützlich für Präsentationen oder Debugging."}, {"id": "cgui-011", "source": "chatgpt", "category": "Voice", "name": "Advanced Voice — Extrem niedrige Latenz", "description": "Die Sprachantwort kommt im Durchschnitt nach nur 232 Millisekunden — ein fast sofortiges Gesprächsgefühl, schneller als die typische menschliche Reaktionszeit. Das macht Sprachunterhaltungen flüssig und natürlich, ohne störende Pausen."}, {"id": "cgui-012", "source": "chatgpt", "category": "Projects", "name": "Projects — Geteilte Team-Arbeitsbereiche", "description": "Projekte können per E-Mail mit Teammitgliedern geteilt werden, mit zwei Berechtigungsstufen: 'Kann chatten' (anschauen und mitdiskutieren) und 'Kann bearbeiten' (Einstellungen ändern und Dateien hochladen). Echte Zusammenarbeit mehrerer Personen in einem gemeinsamen Arbeitsbereich."}, {"id": "cgui-013", "source": "chatgpt", "category": "Projects", "name": "Projects — Deep Research + Canvas zusammen", "description": "Innerhalb eines Projekts hat Deep Research Zugriff auf alle Projektdateien und Anweisungen, und Canvas-Bearbeitung ist integriert. Man kann recherchieren, schreiben und bearbeiten in einem einzigen, zusammenhängenden Arbeitsbereich — ohne zwischen verschiedenen Tools zu wechseln."}, {"id": "cgui-014", "source": "chatgpt", "category": "Memory", "name": "Memory — Zwei-Schichten-System", "description": "Zwei unabhängige Gedächtnis-Schalter: 'Gespeicherte Erinnerungen nutzen' (einzelne Fakten, die man ansehen, bearbeiten und löschen kann) und 'Chat-Verlauf nutzen' (implizite Kontinuität über Gespräche hinweg). Jeder Schalter kann unabhängig ein- und ausgeschaltet werden — volle Kontrolle darüber, was die KI sich merkt."}, {"id": "cgui-015", "source": "chatgpt", "category": "Agent", "name": "Agent Mode — Autonome Mehrstufen-Ausführung", "description": "Die KI nutzt einen eigenen virtuellen Computer, um selbstständig Webseiten zu besuchen, Buttons zu klicken, Formulare auszufüllen, Code auszuführen und Dateien zu bearbeiten. Läuft 5–30 Minuten unbeaufsichtigt und liefert fertige Ergebnisse ab — ein echter digitaler Assistent, der komplexe Aufgaben eigenständig erledigt."}, {"id": "cgui-016", "source": "chatgpt", "category": "Agent", "name": "Operator — Browser-Automatisierung für die echte Welt", "description": "Ein dedizierter Cloud-Browser, der echte Webseiten physisch navigiert: Flüge buchen, Preise vergleichen, Formulare ausfüllen, Daten extrahieren. Nutzt visuelle HTML-Analyse mit echten Mausklicks und Tastatureingaben. Bei CAPTCHAs gibt es einen 'Menschliche Übernahme'-Modus, wo man kurz einspringen kann."}, {"id": "cgui-017", "source": "chatgpt", "category": "Agent", "name": "Codex — Multi-Agent-Coding-Kommandozentrale", "description": "Mehrere Programmieraufgaben gleichzeitig zuweisen, jede läuft parallel in einer eigenen Sandbox. Die Agenten lesen und verändern Code über ganze Repositories hinweg, führen Tests aus, beheben Fehler, erstellen Branches und öffnen Pull Requests. Die Oberfläche zeigt Aufgabenkarten mit Fortschrittsanzeige."}, {"id": "cgui-018", "source": "chatgpt", "category": "Image Generation", "name": "Native multimodale Bildgenerierung", "description": "GPT-4o erzeugt Bilder nativ innerhalb von Gesprächen — nicht über einen separaten DALL-E-Aufruf, sondern als Teil seiner multimodalen Ausgabe. Versteht komplexe Beschreibungen mit besonders hoher Genauigkeit und kann Text in Bildern korrekt darstellen."}, {"id": "cgui-019", "source": "claude-ai", "category": "Artifacts", "name": "Artifacts — Live-Interaktive Vorschau", "description": "Erzeugtes HTML, React, SVG und Mermaid werden als voll interaktive Live-Vorschau in einem rechten Seitenpanel dargestellt. Apps laufen sicher in Sandbox-iframes mit echter Interaktivität — nicht nur Code-Anzeige, sondern funktionierende Anwendungen, die man direkt ausprobieren kann."}, {"id": "cgui-020", "source": "claude-ai", "category": "Artifacts", "name": "Artifacts — Markieren-und-Bearbeiten", "description": "Text in einem Artifact markieren, auf 'Mit Claude bearbeiten' klicken und die gewünschte Änderung beschreiben — Claude bearbeitet nur den markierten Teil und lässt den Rest unverändert. Man muss nicht umständlich beschreiben, welchen Absatz man meint — einfach markieren und anweisen."}, {"id": "cgui-021", "source": "claude-ai", "category": "Artifacts", "name": "Artifacts — Vorschau/Code-Umschalter", "description": "Oben im Artifact-Panel kann man zwischen gerendeter Vorschau und dem zugrunde liegenden Quellcode umschalten. So sieht man das Ergebnis und kann gleichzeitig den Code inspizieren oder kopieren — beides direkt nebeneinander."}, {"id": "cgui-022", "source": "claude-ai", "category": "Artifacts", "name": "Artifacts — Gezielte Edits statt komplette Neugenerierung", "description": "Claude entscheidet intelligent, ob eine gezielte Textersetzung für kleine Änderungen reicht (3–4x schneller) oder ob eine komplette Neugenerierung nötig ist. Keine unnötige Wartezeit durch überflüssiges Neu-Erzeugen des gesamten Inhalts."}, {"id": "cgui-023", "source": "claude-ai", "category": "Thinking", "name": "Extended Thinking — Adaptive Denkschritte-Anzeige", "description": "Claude entscheidet selbstständig, ob und wie tief es nachdenken muss. Denkschritte werden in einklappbaren Abschnitten angezeigt. Bei einfachen Anfragen wird das Nachdenken komplett übersprungen, um schneller zu antworten. Ein visueller Indikator zeigt die Denktiefe an."}, {"id": "cgui-024", "source": "claude-ai", "category": "Style", "name": "Ausgabestile / Tonfall-Voreinstellungen", "description": "Pro Chat einstellbarer Tonfall, Stimme, Wortwahl und Detailgrad. Wird mit kontoweiten und projektspezifischen Anweisungen kombiniert. So bestimmt man, wie Claude kommuniziert, ohne System-Prompts umschreiben zu müssen — z.B. 'förmlich und knapp' oder 'locker und ausführlich'."}, {"id": "cgui-025", "source": "claude-ai", "category": "Projects", "name": "Projects — Drei-Schichten-Anweisungssystem", "description": "Kontoweite Anweisungen + projektspezifische Anweisungen + chatspezifische Stile — drei unabhängige Ebenen, die sich überlagern. Projektanweisungen gelten automatisch für jeden Chat in diesem Projekt. So muss man grundlegende Vorgaben nicht in jedem Gespräch wiederholen."}, {"id": "cgui-026", "source": "claude-ai", "category": "Research", "name": "Research Mode — Mehrstufige Quellen-Synthese", "description": "Automatisierte Web-Recherche über mehrere Schritte, die Belege aus verschiedenen Quellen zusammenträgt und verifizierte Berichte mit transparenten Quellenangaben erstellt. Verfügbar für Pro/Max/Team/Enterprise-Abonnements."}, {"id": "cgui-027", "source": "claude-ai", "category": "Connectors", "name": "414+ MCP-Connectoren im Verzeichnis", "description": "Ein Verzeichnis mit über 414 Ein-Klick-Integrationen: Projektmanagement (Linear, Asana, monday.com), Kreativ-Tools (Figma, Canva) und mehr. Drei Typen: Verzeichnis-Connectoren, interaktive Apps (zeigen Live-Oberflächen direkt in Claude an) und eigene MCP-Server-URLs."}, {"id": "cgui-028", "source": "claude-ai", "category": "Connectors", "name": "Interaktive Apps direkt im Chat", "description": "Manche Connectoren zeigen live-interaktive Oberflächen direkt in Claude an — Slack, Figma, Canva, Asana erscheinen als eingebettete, bedienbare Widgets, nicht nur als API-Anbindungen. Man kann damit arbeiten, ohne die Chat-Oberfläche zu verlassen."}, {"id": "cgui-029", "source": "claude-ai", "category": "Computer Use", "name": "Computer Use — Desktop-Steuerung per Screenshots", "description": "Claude macht Screenshots vom Desktop, analysiert sie mit Bilderkennung und gibt präzise Maus-/Tastatur-Aktionen zurück. Navigiert selbstständig durch Browser und Desktop-Programme. Aktuell nur auf macOS über Claude Desktop verfügbar — das Modell kann deinen Computer fernsteuern."}, {"id": "cgui-030", "source": "claude-ai", "category": "Memory", "name": "Memory — Dauerhaftes Gedächtnis auch im Free-Tier", "description": "Dauerhaftes Gedächtnis ist auch in der kostenlosen Version verfügbar (seit März 2026). Merkt sich Name, Kommunikationsstil, Schreibvorlieben und Projektkontext über Gespräche hinweg — ohne dass man jedes Mal neu erklären muss, wer man ist und woran man arbeitet."}, {"id": "cgui-031", "source": "lobechat", "category": "Agents", "name": "Agent-Gruppen — Multi-Agent-Zusammenarbeit", "description": "Teams aus spezialisierten Agenten orchestrieren, die parallel an Aufgaben arbeiten — jeder mit eigener Wissensbasis, Persönlichkeit und Tool-Zugriff. Nicht nur einzelne Chats, sondern koordinierte Zusammenarbeit mehrerer KI-Agenten an einem gemeinsamen Ziel."}, {"id": "cgui-032", "source": "lobechat", "category": "Agents", "name": "Agent-Erstellung per natürlicher Sprache", "description": "Beschreibe einfach, was du brauchst — System-Prompt, Modell, Tools und Wissensbasis werden automatisch aus der Beschreibung konfiguriert. Kein manuelles Zusammenbauen nötig: 'Ich brauche einen Agenten der NixOS-Configs reviewed' → fertig."}, {"id": "cgui-033", "source": "lobechat", "category": "Marketplace", "name": "Agent-Marktplatz — Community-Agenten", "description": "Vorgefertigte Agenten aus der Community durchsuchen und installieren — mit spezialisierten Persönlichkeiten, Wissen und Tool-Konfigurationen. Eine umfangreiche Bibliothek fertiger Assistenten für Arbeit, Lernen und spezielle Anwendungsfälle."}, {"id": "cgui-034", "source": "lobechat", "category": "Marketplace", "name": "Plugin-Marktplatz — 100+ Plugins", "description": "Plugins für Web-Suche, Bildgenerierung, PDF-Analyse, Code-Ausführung, Wetter und mehr aus einem visuellen Marktplatz installieren, ohne Konfigurationsdateien anfassen zu müssen. Ein-Klick-Installation direkt in der Oberfläche."}, {"id": "cgui-035", "source": "lobechat", "category": "Topics", "name": "Themenbasierte Gesprächsverwaltung", "description": "Jedes Agent-Gespräch wird in 'Themen' organisiert — nach Zeitgruppen sortiert, mit Favoriten immer oben. Man kann Themen suchen, umbenennen, als Favorit markieren und aufräumen — unabhängig voneinander. Wechsel zwischen gruppierter und flacher Listenansicht möglich."}, {"id": "cgui-036", "source": "lobechat", "category": "UI Design", "name": "Modell-zuerst — Schnelles Umschalten", "description": "Die gesamte Bedienung ist darauf ausgelegt, schnell zwischen verschiedenen KI-Anbietern innerhalb eines Gesprächs wechseln zu können — damit jedes Modell das tut, was es am besten kann. Die Modellauswahl ist das zentrale Bedienkonzept, nicht ein nachträgliches Feature."}, {"id": "cgui-037", "source": "lobechat", "category": "MCP", "name": "10.000+ Skills über MCP", "description": "Native MCP-Integration, die Agenten mit über 10.000 Skills verbindet — externe Tools, Datenbanken und Dienste, die über das Model Context Protocol erreichbar sind. Riesige Erweiterbarkeit ohne eigene Entwicklung."}, {"id": "cgui-038", "source": "lobechat", "category": "Collaboration", "name": "Pages — Kollaboratives Schreiben", "description": "Ein eigener Bereich für gemeinsames, längeres Schreiben, getrennt vom Chat. Gedacht für Texte, die über eine einzelne Chat-Antwort hinausgehen — Berichte, Dokumentationen, Artikel. KI-Unterstützung direkt im Editor."}, {"id": "cgui-039", "source": "lobechat", "category": "Design", "name": "Herausragendes Open-Source-UI-Design", "description": "Gilt weithin als die am besten gestaltete Open-Source-Chat-Oberfläche — mit durchdachtem Design, flüssigen Animationen und mobilfreundlichem, responsivem Layout. Setzt den visuellen Maßstab für selbst gehostete KI-Frontends."}, {"id": "cgui-040", "source": "lobechat", "category": "Agents", "name": "SKILL.md Agent-Skills-Standard", "description": "Unterstützt Agent-Skills im offenen SKILL.md-Format, kompatibel mit Claude Skills. Ein standardisiertes Format, um Agenten spezialisierte Herangehensweisen an Aufgaben beizubringen — wiederverwendbar und austauschbar zwischen verschiedenen Plattformen."}, {"id": "code-001", "source": "cursor", "category": "Inline Editing", "name": "Ghost Text Tab Completion", "description": "Die KI schlägt Code als ausgegrautem Geistertext direkt an der Cursor-Position vor. Tab drücken übernimmt den ganzen Vorschlag, Esc verwirft ihn, Cmd+→ übernimmt Wort für Wort. Fühlt sich an wie Autocomplete auf Steroiden — man schreibt und die KI ergänzt in Echtzeit."}, {"id": "code-002", "source": "cursor", "category": "Inline Editing", "name": "Mehrzeiliges Inline-Diff-Popup", "description": "Wenn die KI mehrzeilige Änderungen vorschlägt, erscheint direkt im Editor ein Vergleichs-Popup mit alter und neuer Version nebeneinander, plus Annehmen/Ablehnen-Buttons. Kein Wechsel zu einem separaten Diff-Viewer nötig — alles passiert dort, wo man gerade arbeitet."}, {"id": "code-003", "source": "cursor", "category": "Inline Editing", "name": "Cmd+K Inline-Bearbeitung", "description": "Code markieren, Cmd+K drücken, die gewünschte Änderung in natürlicher Sprache beschreiben — die KI schreibt nur die markierte Stelle um und zeigt eine Diff-Vorschau. Schnelle, chirurgische Eingriffe ohne die Datei zu verlassen. Ideal für kleine, präzise Anpassungen."}, {"id": "code-004", "source": "cursor", "category": "Context System", "name": "@Mention Kontext-Einspeisung", "description": "Umfangreiches @Mention-System: @file (Datei einbeziehen), @folder (ganzer Ordner), @codebase (semantische Suche über die Codebasis), @web (URL abrufen), @git (Diff/Verlauf), @terminal (letzte Ausgabe), @docs (indexierte Dokumentation). Damit hat man präzise Kontrolle darüber, welchen Kontext die KI sieht."}, {"id": "code-005", "source": "cursor", "category": "Context System", "name": "Automatische Semantische Codebase-Suche", "description": "Im Agent-Modus durchsucht die KI automatisch den indexierten Code, um relevante Dateien und Symbole zu finden — ohne dass man @codebase manuell tippen muss. Findet die passendsten Code-Stellen über Embedding-Ähnlichkeit, sodass der Agent immer den richtigen Kontext hat."}, {"id": "code-006", "source": "cursor", "category": "Context System", "name": "Vorindexierte Dokumentation (@Docs)", "description": "Dokumentations-URLs (Framework-Docs, API-Referenzen, interne Wikis) in den Einstellungen hinterlegen — Cursor crawlt und indexiert sie. Mit @Docs im Prompt werden relevante Dokumentationsabschnitte in den Kontext eingefügt. So hat die KI immer die aktuelle Doku griffbereit."}, {"id": "code-007", "source": "cursor", "category": "Agent Management", "name": "Agent-Sidebar mit Plänen und Ausführungen", "description": "Rechte Seitenleiste, die alle Agenten als eigenständige Einträge mit Status (läuft/fertig/wartet), Fortschrittsanzeige und Ausgabe-Logs zeigt. Das Gespräch und die Diffs jedes Agenten stehen im Vordergrund — wie ein Pull Request reviewen, aber für KI-Arbeit."}, {"id": "code-008", "source": "cursor", "category": "Agent Management", "name": "Plan-Modus (Strukturierte Planung)", "description": "Ein eigener Modus, in dem die KI erst einen Mehrschritte-Plan erstellt, bevor sie etwas ausführt. Man kann den Plan reviewen, bearbeiten und genehmigen — erst danach arbeitet der Agent ihn Schritt für Schritt ab. Pläne sind eigenständige Objekte, die in der Sidebar sichtbar bleiben."}, {"id": "code-009", "source": "cursor", "category": "Agent Management", "name": "Parallele Agenten (bis zu 8)", "description": "Bis zu 8 Agenten gleichzeitig an verschiedenen Aufgaben arbeiten lassen. Jeder arbeitet in seinem eigenen Git-Worktree, damit keine Dateikonflikte entstehen. Alle sind in der Sidebar mit unabhängiger Statusverfolgung sichtbar — echter Parallelbetrieb."}, {"id": "code-010", "source": "cursor", "category": "Agent Management", "name": "Hintergrund-Agenten mit Checkpoints", "description": "Agenten laufen im Hintergrund, während man selbst im Vordergrund weiterarbeitet. Jeder abgeschlossene Schritt erzeugt einen Checkpoint, zu dem man jederzeit zurückkehren kann — einfach auf 'Wiederherstellen' bei einem beliebigen Checkpoint klicken. Checkpoints bleiben auch nach einem Neustart erhalten."}, {"id": "code-011", "source": "cursor", "category": "Agent Management", "name": "Auto-Run-Modus (früher YOLO)", "description": "Entfernt die Bestätigungsabfrage vor jedem Befehl, sodass der Agent Terminal-Befehle ohne Nachfragen ausführt. Über Team-Richtlinien konfigurierbar und bleibt auch nach Session-Neustart aktiv. Für erfahrene Nutzer, die den Agenten arbeiten lassen wollen, ohne ständig zu bestätigen."}, {"id": "code-012", "source": "cursor", "category": "Code Review", "name": "BugBot PR-Review", "description": "Ein KI-Code-Reviewer, der automatisch jeden GitHub Pull Request inspiziert, Inline-Kommentare über Regressionen und riskante Änderungen postet und direkt Fixes auf dem PR vorschlagen kann. Wie ein automatischer Code-Reviewer, der bei jedem PR mitliest."}, {"id": "code-013", "source": "cursor", "category": "Code Review", "name": "Pull-Request-artige Änderungsübersicht", "description": "Alle Agent-Änderungen über mehrere Dateien hinweg in einer einheitlichen Diff-Ansicht sehen, die sich anfühlt wie ein Pull Request reviewen. Kein Herumspringen zwischen einzelnen Dateien nötig — alles auf einen Blick."}, {"id": "code-014", "source": "cursor", "category": "Layout", "name": "Klassische vs. Agent-Ansicht", "description": "Umschalten zwischen klassischem Editor-Layout (Dateibaum links, traditionelle IDE) und Agent-zuerst-Layout (Agenten/Pläne-Sidebar rechts, Diffs im Vordergrund). Per 'Agents'-Button wechseln — je nachdem ob man selbst tippt oder die KI arbeiten lässt."}, {"id": "code-015", "source": "windsurf", "category": "Agent Flow", "name": "Cascade Write Mode (Multi-Datei-Agent)", "description": "Eine Anweisung in natürlicher Sprache löst eine ganze Pipeline aus: Plan erstellen → ausführen → Diffs bereitstellen. Cascade erstellt, ändert und löscht Dateien über das gesamte Projekt hinweg in einem einzigen Durchgang — mit Schritt-für-Schritt-Sichtbarkeit, was gerade passiert."}, {"id": "code-016", "source": "windsurf", "category": "Agent Flow", "name": "Plan-Vorschau vor der Ausführung", "description": "Nach dem Absenden einer Anweisung zeigt Cascade erst einen Schritt-für-Schritt-Plan, BEVOR irgendeine Datei angefasst wird. Man kann den Plan überprüfen, abbrechen oder anpassen. Erst nach der Freigabe beginnt die eigentliche Ausführung — keine überraschenden Änderungen."}, {"id": "code-017", "source": "windsurf", "category": "Agent Flow", "name": "Schritt-für-Schritt-Freigabe", "description": "Während der Ausführung kann jeder Schritt eine Freigabe erfordern. Die Diff-Bereitstellungs-Oberfläche zeigt jede geänderte Datei mit Annehmen/Rückgängig-Kontrollen auf Dateiebene — vertrauenswürdig genug für Produktions-Code."}, {"id": "code-018", "source": "windsurf", "category": "Context Awareness", "name": "Echtzeit-Aktionsverfolgung", "description": "Cascade beobachtet deine Bearbeitungen, Terminal-Befehle, Zwischenablage und Datei-Navigation in Echtzeit mit. Nach einer manuellen Änderung reicht es, 'mach weiter' zu sagen — die KI macht nahtlos dort weiter, wo man aufgehört hat, ohne den Kontext explizit teilen zu müssen."}, {"id": "code-019", "source": "windsurf", "category": "Context Awareness", "name": "Automatisch generierte Erinnerungen", "description": "Cascade speichert automatisch nützliche Fakten aus Gesprächen — bevorzugte Bibliotheken, wiederkehrende Muster, Projekt-Konventionen — und bringt sie in zukünftigen Sitzungen wieder ein. Kein manuelles Konfigurieren nötig, die KI lernt mit."}, {"id": "code-020", "source": "windsurf", "category": "Context Awareness", "name": ".windsurfrules Projektkontext", "description": "Eine Regeldatei auf Projektebene, die Coding-Konventionen, bevorzugte Muster und projektspezifische Anweisungen definiert. Die KI befolgt diese automatisch in jeder Sitzung — ähnlich wie CLAUDE.md bei Claude Code."}, {"id": "code-021", "source": "windsurf", "category": "Agent Flow", "name": "Selbstkorrigierende Ausführung", "description": "Während der Ausführung führt Cascade Terminal-Befehle aus, liest die Ausgabe, erkennt Fehler und korrigiert sich selbst, bevor verbleibende Probleme gemeldet werden. Eine automatische Wiederholungsschleife bei Fehlschlägen — die KI gibt nicht beim ersten Fehler auf."}, {"id": "code-022", "source": "windsurf", "category": "Input", "name": "Screenshot-zu-Code-Eingabe", "description": "Screenshots per Drag-and-Drop in den Chat ziehen, um daraus Frontend-Code zu generieren. Cascade analysiert das Bild und erzeugt passenden Code dazu — ideal für 'Mach es so wie hier'-Arbeitsabläufe, wo man ein Design nachbauen möchte."}, {"id": "code-023", "source": "claude-code", "category": "Layout", "name": "Frei verschiebbare Panel-Anordnung", "description": "Jedes Panel (Chat, Diff, Browser, Terminal, Datei-Editor, Plan, Aufgaben, Subagenten) lässt sich frei in jede beliebige Gitter-Anordnung ziehen. Terminal links, Chat in der Mitte, Diff rechts, Vorschau unten — wie es zum eigenen Workflow passt."}, {"id": "code-024", "source": "claude-code", "category": "Layout", "name": "Drei Ansichtsmodi (Ausführlich/Normal/Zusammenfassung)", "description": "Die Oberfläche lässt sich von voller Transparenz (jeder Tool-Aufruf sichtbar) bis zum Zusammenfassungsmodus (nur Ergebnisse) einstellen. Normal liegt dazwischen. Steuert, wie viel von den internen Prozessen der KI man sehen möchte — Entwickler wollen mehr, Endnutzer weniger."}, {"id": "code-025", "source": "claude-code", "category": "Layout", "name": "Seiten-Chat (Abzweigende Gespräche)", "description": "Cmd+; öffnet einen Seiten-Chat, um schnelle Fragen zu stellen oder Nebenpfade zu erkunden, ohne das Hauptgespräch zu unterbrechen. Man verzweigt, bekommt die Antwort und kehrt zum Hauptthread zurück — ohne den Kontext zu verlieren."}, {"id": "code-026", "source": "claude-code", "category": "Multi-Session", "name": "Projektgruppierte Session-Sidebar", "description": "Alle Sessions werden nach Projekt gruppiert in der Seitenleiste angezeigt, mit Status-Filtern (aktiv/ruhend/fertig) und Umgebungs-Tags. So kann man gleichzeitig ein Refactoring, einen Bugfix und eine Test-Sitzung über verschiedene Repositories verwalten."}, {"id": "code-027", "source": "claude-code", "category": "Multi-Session", "name": "Hintergrund-Agent-Pläne als eigene Fenster", "description": "Pläne und Hintergrundaufgaben öffnen sich in eigenen Fenstern, die den Plan und die Aufgabenausführung des Agenten zeigen — nicht versteckt im Terminal-Scroll. Jeder Plan ist ein eigenes, einsehbares und überprüfbares Objekt."}, {"id": "code-028", "source": "claude-code", "category": "Preview", "name": "In-App Live-Vorschau", "description": "Die laufende App direkt im Editor anschauen — ohne separates Browser-Fenster. Änderungen, die der Agent vornimmt, werden live in der Vorschau sichtbar. Spart das ständige Wechseln zwischen Editor und Browser."}, {"id": "code-029", "source": "claude-code", "category": "Code Review", "name": "Code-Review-Button (Lokale Diff-Prüfung)", "description": "Ein-Klick-Button, der lokale Änderungen durchsucht und Inline-Kommentare über echte Fehler hinterlässt, BEVOR man pusht. Wie einen Code-Reviewer zu haben, der die Arbeit prüft, bevor der Pull Request überhaupt existiert."}, {"id": "code-030", "source": "claude-code", "category": "Preview", "name": "Erweiterte HTML- & PDF-Vorschau", "description": "Eingebautes Vorschau-Panel, das HTML-Seiten und PDF-Dokumente direkt neben dem Chat rendert — ohne externen Viewer. Nützlich wenn die KI Dokumente erstellt oder analysiert und man das Ergebnis sofort sehen will."}, {"id": "code-031", "source": "claude-code", "category": "Multi-Session", "name": "Routines (Geplante Agenten)", "description": "Wiederkehrende geplante Aufgaben erstellen, die Agenten automatisch ausführen — tägliche Code-Gesundheitschecks, regelmäßige Test-Durchläufe, Dokumentations-Synchronisation. Routinen werden gespeichert und laufen nach Zeitplan — die KI arbeitet auch wenn man nicht da ist."}, {"id": "code-032", "source": "claude-code", "category": "Layout", "name": "Verschiebbare Plan- & Aufgaben-Panels", "description": "Plan und Aufgaben sind eigenständige, verschiebbare Panels — man kann sie überall im Gitter andocken. So sieht man den Plan des Agenten neben dem Chat und Diff gleichzeitig, ohne zwischen Tabs wechseln zu müssen. Alles Wichtige auf einen Blick."}];

const SOURCES = [
  { key: 'all', label: 'Alle' },
  { key: 'niagara', label: 'Niagara', color: '#E87B35' },
  { key: 'openwebui', label: 'Open WebUI', color: '#7C3AED' },
  { key: 'hermes', label: 'Hermes', color: '#0891B2' },
  { key: 'chatgpt', label: 'ChatGPT', color: '#10A37F' },
  { key: 'claude', label: 'Claude', color: '#D4793C' },
  { key: 'lobechat', label: 'LobeChat', color: '#4F8EF7' },
  { key: 'code', label: 'Code-GUIs', color: '#F7C948' },
];
const FILTERS = [
  { key: 'all', label: 'Alle' },
  { key: 'unreviewed', label: 'Offen' },
  { key: 'yes', label: 'Ja' },
  { key: 'maybe', label: 'Vielleicht' },
  { key: 'no', label: 'Nein' },
];
const PRIO_LABELS = ['', 'Niedrig', 'Mittel', 'Hoch', 'Wichtig', 'Muss rein'];
const STORAGE_KEY = 'fuchs-launcher-features-v1';

let state = {
  source: 'all',
  filter: 'all',
  search: '',
  decisions: {},
  openCategories: {},
};

let db = null;
let dbReady = false;
let saveTimeout = null;
let localChangeAt = 0;

async function initDb() {
  try {
    db = await claude.use('db');
    if (!db) { console.log('db nicht verfügbar, nutze localStorage'); return; }
    dbReady = true;
    document.getElementById('syncStatus').textContent = '(Cloud-Sync aktiv)';
    db.doc('state/decisions').onSnapshot(
      snap => {
        if (Date.now() - localChangeAt < 2000) return;
        if (snap.exists) {
          const data = snap.data();
          if (data.decisions) state.decisions = data.decisions;
          if (data.openCategories) state.openCategories = data.openCategories;
          render();
        }
      },
      err => { console.log('db snapshot fehler:', err.code); dbReady = false; }
    );
  } catch(e) { console.log('db init fehler:', e); }
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state.decisions = parsed.decisions || {};
      state.openCategories = parsed.openCategories || {};
    }
  } catch(e) {}
}

function saveState() {
  localChangeAt = Date.now();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      decisions: state.decisions,
      openCategories: state.openCategories,
    }));
  } catch(e) {}
  if (dbReady && db) {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      db.doc('state/decisions').set({
        decisions: state.decisions,
        openCategories: state.openCategories,
        lastUpdated: new Date().toISOString(),
      }).catch(e => console.log('db save fehler:', e.code || e));
    }, 300);
  }
}

function getSourceKey(f) {
  if (f.source === 'niagara') return 'niagara';
  if (f.source === 'openwebui') return 'openwebui';
  if (f.source === 'chatgpt') return 'chatgpt';
  if (f.source === 'claude-ai') return 'claude';
  if (f.source === 'lobechat') return 'lobechat';
  if (f.source === 'cursor' || f.source === 'windsurf' || f.source === 'claude-code') return 'code';
  return 'hermes';
}


function getSourceColor(f) {
  const k = getSourceKey(f);
  return SOURCES.find(s => s.key === k)?.color || '#888';
}

function getDecision(id) {
  return state.decisions[id] || { vote: null, priority: 0, target: null, note: '' };
}

function setDecision(id, vote, priority, target) {
  if (!state.decisions[id]) state.decisions[id] = { vote: null, priority: 0, target: null, note: '' };
  if (vote !== undefined) state.decisions[id].vote = vote;
  if (priority !== undefined) state.decisions[id].priority = priority;
  if (target !== undefined) state.decisions[id].target = target;
  if (vote === 'no') { state.decisions[id].priority = 0; state.decisions[id].target = null; }
  saveState();
  render();
}

function setNote(id, note) {
  if (!state.decisions[id]) state.decisions[id] = { vote: null, priority: 0, target: null, note: '' };
  state.decisions[id].note = note;
  saveState();
}

function matchesFilter(f) {
  const d = getDecision(f.id);
  if (state.source !== 'all' && getSourceKey(f) !== state.source) return false;
  if (state.filter === 'unreviewed' && d.vote !== null) return false;
  if (state.filter === 'yes' && d.vote !== 'yes') return false;
  if (state.filter === 'no' && d.vote !== 'no') return false;
  if (state.filter === 'maybe' && d.vote !== 'maybe') return false;
  if (state.search) {
    const q = state.search.toLowerCase();
    if (!f.name.toLowerCase().includes(q) && !f.description.toLowerCase().includes(q) && !f.category.toLowerCase().includes(q)) return false;
  }
  return true;
}

function renderProgress() {
  const total = FEATURES.length;
  let yes = 0, no = 0, maybe = 0;
  FEATURES.forEach(f => {
    const d = getDecision(f.id);
    if (d.vote === 'yes') yes++;
    else if (d.vote === 'no') no++;
    else if (d.vote === 'maybe') maybe++;
  });
  const reviewed = yes + no + maybe;
  const pct = total ? Math.round(reviewed / total * 100) : 0;

  document.getElementById('progress').innerHTML = `
    <div class="progress-stats">
      <span class="stat"><strong>${pct}%</strong> bewertet (${reviewed}/${total})</span>
      <span class="stat"><span class="stat-dot" style="background:var(--yes)"></span> Ja: ${yes}</span>
      <span class="stat"><span class="stat-dot" style="background:var(--maybe)"></span> Vielleicht: ${maybe}</span>
      <span class="stat"><span class="stat-dot" style="background:var(--no)"></span> Nein: ${no}</span>
      <span class="stat"><span class="stat-dot" style="background:var(--border)"></span> Offen: ${total - reviewed}</span>
    </div>
    <div class="progress-bar-track">
      <div style="width:${total?yes/total*100:0}%;background:var(--yes)"></div>
      <div style="width:${total?maybe/total*100:0}%;background:var(--maybe)"></div>
      <div style="width:${total?no/total*100:0}%;background:var(--no)"></div>
    </div>
  `;
}

function renderSourceTabs() {
  const el = document.getElementById('sourceTabs');
  el.innerHTML = SOURCES.map(s => {
    const count = s.key === 'all' ? FEATURES.length : FEATURES.filter(f => getSourceKey(f) === s.key).length;
    return `<button class="source-tab ${state.source === s.key ? 'active' : ''}" data-source="${s.key}">${s.label}<span class="count">${count}</span></button>`;
  }).join('');
}

function renderFilterPills() {
  const el = document.getElementById('filterPills');
  el.innerHTML = FILTERS.map(f => {
    return `<button class="filter-pill ${state.filter === f.key ? 'active' : ''}" data-filter="${f.key}">${f.label}</button>`;
  }).join('');
}

function renderFeatures() {
  const visible = FEATURES.filter(matchesFilter);
  const el = document.getElementById('featureList');

  if (visible.length === 0) {
    el.innerHTML = '<div class="empty-state">Keine Features gefunden.</div>';
    return;
  }

  const grouped = {};
  visible.forEach(f => {
    const cat = f.category;
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(f);
  });

  const cats = Object.keys(grouped).sort();
  el.innerHTML = cats.map(cat => {
    const items = grouped[cat];
    const reviewed = items.filter(f => getDecision(f.id).vote !== null).length;
    const isOpen = state.openCategories[cat + '_' + state.source] !== false;
    const pctDone = items.length ? Math.round(reviewed / items.length * 100) : 0;

    return `
      <div class="category-section ${isOpen ? 'open' : ''}" data-cat="${cat}">
        <div class="category-header ${isOpen ? 'open' : ''}" data-cat="${cat + '_' + state.source}">
          <span class="arrow">▶</span>
          <span class="cat-name">${cat}</span>
          <span class="cat-count">${reviewed}/${items.length}</span>
          <div class="cat-progress"><div class="cat-progress-fill" style="width:${pctDone}%"></div></div>
        </div>
        <div class="category-items">
          ${items.map(f => renderFeature(f)).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderFeature(f) {
  const d = getDecision(f.id);
  const cls = d.vote ? `decided-${d.vote}` : '';
  const srcColor = getSourceColor(f);

  let starsHtml = '';
  for (let i = 1; i <= 5; i++) {
    starsHtml += `<button class="priority-star ${d.priority >= i ? 'filled' : ''}" data-id="${f.id}" data-prio="${i}" title="${PRIO_LABELS[i]}">★</button>`;
  }

  return `
    <div class="feature ${cls}" id="f-${f.id}">
      <div class="feature-top">
        <div class="feature-info">
          <p class="feature-name"><span class="feature-source-dot" style="background:${srcColor}"></span>${f.name}</p>
          <p class="feature-desc">${f.description}</p>
        </div>
        <div class="feature-actions">
          <button class="btn-vote vote-yes ${d.vote==='yes'?'active':''}" data-id="${f.id}" data-vote="yes" title="Ja">✓</button>
          <button class="btn-vote vote-maybe ${d.vote==='maybe'?'active':''}" data-id="${f.id}" data-vote="maybe" title="Vielleicht">?</button>
          <button class="btn-vote vote-no ${d.vote==='no'?'active':''}" data-id="${f.id}" data-vote="no" title="Nein">✗</button>
        </div>
      </div>
      <div class="priority-row">
        <span class="priority-label">Priorität</span>
        <div class="priority-stars">${starsHtml}</div>
        <span class="priority-text">${d.priority ? PRIO_LABELS[d.priority] : '—'}</span>
      </div>
      <div class="target-row">
        <span class="target-label">Ziel</span>
        <div class="target-pills">
          <button class="target-pill ${d.target==='launcher'?'active':''}" data-id="${f.id}" data-target="launcher">Launcher</button>
          <button class="target-pill ${d.target==='desktop'?'active':''}" data-id="${f.id}" data-target="desktop">Desktop</button>
          <button class="target-pill ${d.target==='both'?'active':''}" data-id="${f.id}" data-target="both">Beide</button>
        </div>
      </div>
      <div class="note-row">
        <input class="note-input" type="text" placeholder="Notiz..." value="${(d.note||'').replace(/"/g,'&quot;')}" data-note-id="${f.id}">
      </div>
    </div>
  `;
}

function setSource(key) {
  state.source = key;
  render();
}

function setFilter(key) {
  state.filter = key;
  render();
}

function toggleCategory(key) {
  state.openCategories[key] = state.openCategories[key] === false ? true : (state.openCategories[key] === true ? false : false);
  saveState();
  render();
}

function toggleAllSections(open) {
  const visible = FEATURES.filter(matchesFilter);
  const cats = new Set(visible.map(f => f.category));
  cats.forEach(cat => {
    state.openCategories[cat + '_' + state.source] = open;
  });
  saveState();
  render();
}

function render() {
  renderProgress();
  renderSourceTabs();
  renderFilterPills();
  renderFeatures();
}

function exportDecisions() {
  const result = FEATURES.map(f => {
    const d = getDecision(f.id);
    return {
      id: f.id,
      source: f.source,
      category: f.category,
      name: f.name,
      description: f.description,
      vote: d.vote,
      priority: d.priority,
      priorityLabel: d.priority ? PRIO_LABELS[d.priority] : null,
      target: d.target || null,
      note: d.note || '',
    };
  }).filter(f => f.vote !== null);

  const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fuchs-launcher-features-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function resetAll() {
  if (!confirm('Alle Bewertungen zurücksetzen? Das kann nicht rückgängig gemacht werden.')) return;
  state.decisions = {};
  saveState();
  render();
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  render();
});

loadState();
render();
initDb();

document.getElementById('btnExpandAll').addEventListener('click', function() { toggleAllSections(true); });
document.getElementById('btnCollapseAll').addEventListener('click', function() { toggleAllSections(false); });
document.getElementById('btnExport').addEventListener('click', exportDecisions);
document.getElementById('btnReset').addEventListener('click', resetAll);
document.getElementById('btnTestDirect').addEventListener('click', function() { this.textContent = 'GEHT!'; this.style.background = 'var(--yes)'; });
document.getElementById('evtStatus').textContent = 'EVENTS: OK ✓';
document.getElementById('evtStatus').style.color = 'var(--yes)';

function findData(el, attr, root) {
  while (el && el !== root) {
    if (el.dataset && el.dataset[attr]) return el;
    el = el.parentElement;
  }
  return null;
}

document.addEventListener('click', function(e) {
  var el = e.target;

  var vote = findData(el, 'vote', document.body);
  if (vote) { setDecision(vote.dataset.id, vote.dataset.vote); return; }

  var star = findData(el, 'prio', document.body);
  if (star) { setDecision(star.dataset.id, undefined, parseInt(star.dataset.prio)); return; }

  var tgt = findData(el, 'target', document.body);
  if (tgt) { setDecision(tgt.dataset.id, undefined, undefined, tgt.dataset.target); return; }

  var cat = findData(el, 'cat', document.body);
  if (cat) { toggleCategory(cat.dataset.cat); return; }

  var src = findData(el, 'source', document.body);
  if (src) { setSource(src.dataset.source); return; }

  var flt = findData(el, 'filter', document.body);
  if (flt) { setFilter(flt.dataset.filter); return; }
});

document.addEventListener('change', function(e) {
  var el = e.target;
  if (el.dataset && el.dataset.noteId) { setNote(el.dataset.noteId, el.value); }
});
</script>
