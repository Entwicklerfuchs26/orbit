"Eingebauter persönlicher und geteilter Kalender mit Monats-, Wochen- und Tagesansicht, wiederkehrenden Terminen, Farbcodierung, Teilnehmern und Erinnerungen. Verknüpft mit den Automationen für zeitgesteuerte KI-Aufgaben."}, {"id": "owui-117", "source": "openwebui", "category": "Scheduling & Automation", "name": "Notifications / Webhooks", "description": "Webhook-Ziele, die Nutzer benachrichtigen, wenn Chats abgeschlossen werden, fehlschlagen oder Kalender-Events auslösen. Konfigurierbare Benachrichtigungsziele, z.B. Slack, E-Mail oder eigene Dienste."}, {"id": "owui-118", "source": "openwebui", "category": "Code Execution", "name": "Code Interpreter (Python)", "description": "Python-Code direkt im Browser oder über das integrierte Terminal ausführen. Ergebnisse werden inline im Chat angezeigt. Die KI kann Code schreiben und sofort testen, z.B. für Datenanalyse oder Berechnungen."}, {"id": "owui-119", "source": "openwebui", "category": "Code Execution", "name": "Open Terminal", "description": "Voller Terminal-Zugang für KI-Agenten: echte Befehle ausführen, Dateien durchsuchen/hoch-/herunterladen in der Seitenleiste, und eine Live-Vorschau von Webseiten. Gibt der KI die gleiche Arbeitsumgebung wie einem Entwickler."}, {"id": "owui-120", "source": "openwebui", "category": "Code Execution", "name": "Terminal File Browser", "description": "Datei-Browser-Seitenleiste im Terminal zum Durchsuchen, Hochladen, Herunterladen und Bearbeiten von Dateien. Wie ein grafischer Dateimanager neben dem Terminal."}, {"id": "owui-121", "source": "openwebui", "category": "Code Execution", "name": "Website Preview in Terminal", "description": "Live-Vorschau von Web-Projekten, die innerhalb des Terminals laufen, direkt inline gerendert. Man kann z.B. eine Webseite im Terminal starten und sofort sehen, wie sie aussieht."}, {"id": "owui-122", "source": "openwebui", "category": "Artifacts", "name": "Artifact Detection & Display", "description": "Automatische Erkennung von Artifacts (HTML/interaktive Inhalte) in KI-Antworten und Darstellung in sicher abgeschotteten iframes. Die Sandbox-Berechtigungen sind konfigurierbar. So können z.B. kleine Webapps oder interaktive Visualisierungen direkt im Chat laufen."}, {"id": "owui-123", "source": "openwebui", "category": "Artifacts", "name": "Persistent Artifact Storage", "description": "Eingebauter Key-Value-Speicher für Artifacts, der Tagebücher, Tracker, Bestenlisten und kollaborative Tools mit persönlichen und geteilten Datenbereichen ermöglicht. Artifacts können so Daten über Sitzungen hinweg behalten."}, {"id": "owui-124", "source": "openwebui", "category": "Extensibility", "name": "Tools (Python Scripts)", "description": "Python-Skripte, die die Fähigkeiten des Modells erweitern — z.B. auf Datenbanken zugreifen, APIs abfragen oder Berechnungen durchführen. Ein eingebauter Code-Editor erlaubt das Erstellen und Bearbeiten von Tools direkt in der Oberfläche."}, {"id": "owui-125", "source": "openwebui", "category": "Extensibility", "name": "Skills (Markdown Instructions)", "description": "Markdown-Anleitungen, die Modellen spezialisierte Herangehensweisen für bestimmte Aufgaben beibringen. Werden bei Bedarf geladen und geben dem Modell Expertenwissen für z.B. Code-Review, Textbearbeitung oder Datenanalyse."}, {"id": "owui-126", "source": "openwebui", "category": "Extensibility", "name": "Pipelines (Plugin Framework)", "description": "Modulares Plugin-Framework mit Filtern, Actions und Pipes, um eigene Logik in den Anfrage-/Antwort-Ablauf einzufügen. Z.B. Nachrichten vor dem Senden automatisch anpassen oder Antworten nachbearbeiten."}, {"id": "owui-127", "source": "openwebui", "category": "Extensibility", "name": "MCP Support (Model Context Protocol)", "description": "Native Unterstützung für MCP-Server (Model Context Protocol) als Tool-Anbieter über Streamable HTTP. So können externe Dienste als Tools angebunden werden, die das Modell nutzen kann."}, {"id": "owui-128", "source": "openwebui", "category": "Extensibility", "name": "OpenAPI Tool Servers", "description": "Automatisches Entdecken und Verbinden von Tools über jeden OpenAPI-kompatiblen Endpunkt. Bestehende REST-APIs können so direkt als Tools genutzt werden, ohne speziellen MCP-Server."}, {"id": "owui-129", "source": "openwebui", "category": "Extensibility", "name": "Prompt Templates with Variables", "description": "Wiederverwendbare Prompt-Vorlagen als Slash-Befehle mit typisierten Eingabevariablen und Versionierung. Statt immer denselben langen Prompt zu tippen, einmal eine Vorlage erstellen und dann nur die Variablen ausfüllen."}, {"id": "owui-130", "source": "openwebui", "category": "Theming & Appearance", "name": "Theme Selection (Light/Dark/System/High Contrast)", "description": "Eingebaute Themes: Hell, Dunkel, System (folgt dem Betriebssystem) und Hoher Kontrast. Wird pro Nutzer in den Einstellungen gewählt. Der Hohe-Kontrast-Modus ist besonders für Barrierefreiheit wichtig."}, {"id": "owui-131", "source": "openwebui", "category": "Theming & Appearance", "name": "UI Scale", "description": "Einstellbare Text-/UI-Skalierung von 1.0 bis 1.5 für bessere Lesbarkeit oder persönliche Vorlieben. Skaliert die gesamte Oberfläche gleichmäßig, nicht nur den Text."}, {"id": "owui-132", "source": "openwebui", "category": "Theming & Appearance", "name": "Custom Font Family", "description": "Eine eigene Schriftart für die gesamte Oberfläche wählen. Man kann z.B. eine gut lesbare Schrift wie Atkinson Hyperlegible oder eine persönliche Lieblingsschrift einstellen."}, {"id": "owui-133", "source": "openwebui", "category": "Theming & Appearance", "name": "Enterprise White-Labeling", "description": "Das Standard-Branding durch eigenes Firmenlogo, Farben und visuellen Stil ersetzen (Enterprise-Lizenz). So sieht Open WebUI aus wie ein firmeneigenes Produkt."}, {"id": "owui-134", "source": "openwebui", "category": "Theming & Appearance", "name": "Haptic Feedback (Android)", "description": "Vibrations-Feedback auf Android-Geräten bei Touch-Interaktionen. Gibt ein physisches Gefühl beim Tippen und Navigieren, ähnlich wie in nativen Android-Apps."}, {"id": "owui-135", "source": "openwebui", "category": "Responsive Design", "name": "Progressive Web App (PWA)", "description": "Installierbar als PWA für eine native App-ähnliche Erfahrung auf Handy und Desktop. Auf dem Startbildschirm erscheint ein eigenes Icon, die App läuft im Vollbild ohne Browser-Leiste. Offline-Zugang bei lokaler Installation."}, {"id": "owui-136", "source": "openwebui", "category": "Responsive Design", "name": "Responsive Layout (Desktop/Mobile)", "description": "Nahtlose Nutzung auf Desktop, Laptop und Handy mit automatisch angepasstem Layout. Die Oberfläche reorganisiert sich je nach Bildschirmbreite, damit alles immer gut nutzbar bleibt."}, {"id": "owui-137", "source": "openwebui", "category": "Admin", "name": "Usage Analytics Dashboard", "description": "Admin-Dashboard zum Verfolgen von Nachrichtenvolumen, Token-Verbrauch und Kosten über alle Nutzer und Modelle hinweg. Zeigt, welche Modelle am meisten genutzt werden und wo die Kosten entstehen."}, {"id": "owui-138", "source": "openwebui", "category": "Admin", "name": "Model Evaluation Arena (A/B Testing)", "description": "Eingebaute Modell-Arena mit A/B-Tests und ELO-basierter Bestenliste zum Vergleich der Modellqualität. Nutzer bewerten blind, welche Antwort besser ist — so entsteht eine datenbasierte Rangliste."}, {"id": "owui-139", "source": "openwebui", "category": "Admin", "name": "System Banners", "description": "Anpassbare systemweite Ankündigungsbanner, die allen Nutzern angezeigt werden. Nützlich für Wartungshinweise, neue Features oder wichtige Mitteilungen an alle."}, {"id": "owui-140", "source": "openwebui", "category": "Admin", "name": "Default Interface Settings (Admin)", "description": "Instanzweite Standardwerte für alle Oberflächen-Optionen festlegen. Neue Accounts starten mit den vom Admin definierten Voreinstellungen; Nutzer können sie individuell überschreiben."}, {"id": "owui-141", "source": "openwebui", "category": "Admin", "name": "RBAC (Roles, Groups, Permissions)", "description": "Fein abgestufte rollenbasierte Zugriffskontrolle: Rollen, Gruppen und Berechtigungen pro Ressource definieren. So bekommt z.B. das Entwickler-Team Zugriff auf Code-Modelle, aber nicht auf die Admin-Einstellungen."}, {"id": "owui-142", "source": "openwebui", "category": "Admin", "name": "SSO / OIDC / LDAP Authentication", "description": "Verbund-Authentifizierung mit jedem Identitätsanbieter über SSO, OIDC oder LDAP. Nutzer melden sich mit ihrem bestehenden Firmen-Account an, ohne ein separates Passwort erstellen zu müssen."}, {"id": "owui-143", "source": "openwebui", "category": "Admin", "name": "API Keys for Users", "description": "Programmatischer Zugriff über API-Schlüssel für Skripte, Bots und Integrationen. Ermöglicht die Nutzung von Open WebUI als Backend für eigene Anwendungen."}, {"id": "owui-144", "source": "openwebui", "category": "Admin", "name": "Signup Webhooks", "description": "Webhooks, die bei Nutzerregistrierung, abgeschlossenen Chats und anderen Ereignissen ausgelöst werden. Ermöglicht Benachrichtigungen an externe Systeme, z.B. ein Willkommens-Bot oder ein Monitoring-Dashboard."}, {"id": "owui-145", "source": "openwebui", "category": "Admin", "name": "Update Toast & Changelog", "description": "Toast-Benachrichtigungen bei neuen Updates und ein 'Was ist neu'-Dialog beim Login mit Versionshinweisen. So bleiben Nutzer über neue Funktionen informiert, ohne selbst nach Änderungen suchen zu müssen."}, {"id": "owui-146", "source": "openwebui", "category": "Connections", "name": "Direct Model Endpoints", "description": "Den Client direkt auf eigene OpenAI-kompatible Modell-Endpunkte zeigen lassen, ohne serverseitige Konfiguration. Ermöglicht schnelles Anbinden eigener Modelle ohne Admin-Zugang."}, {"id": "owui-147", "source": "openwebui", "category": "Connections", "name": "Multiple API Provider Support", "description": "Gleichzeitig mit Ollama, OpenAI, LMStudio, GroqCloud, Mistral, OpenRouter, vLLM und jeder OpenAI-kompatiblen API verbinden. Alle Modelle erscheinen in einem gemeinsamen Dropdown — man kann nahtlos zwischen Anbietern wechseln."}, {"id": "owui-148", "source": "openwebui", "category": "Localization", "name": "Multilingual Interface (i18n)", "description": "Die gesamte Oberfläche ist in vielen Sprachen verfügbar, mit von der Community beigetragenen Übersetzungen. Jeder Nutzer kann seine bevorzugte Sprache in den Einstellungen wählen."}, {"id": "owui-149", "source": "openwebui", "category": "Projects", "name": "Folder-to-Project Workspaces", "description": "Ordner in Projekt-Arbeitsbereiche umwandeln mit eigenen System-Prompts und angehängten Wissensdatenbanken, die für alle Chats innerhalb des Projekts gelten. So hat jedes Projekt seinen eigenen Kontext und seine eigenen Einstellungen."}, {"id": "owui-150", "source": "openwebui", "category": "Chat Interface", "name": "URL Parameters for Chat Setup", "description": "Chat-Sitzungen über URL-Parameter vorkonfigurieren: Modell, Tools und Features direkt per Link festlegen. Nützlich für vorgefertigte Einstiegspunkte, z.B. ein Link 'Chat mit GPT-4 + Websuche aktiviert'."}, {"id": "owui-151", "source": "openwebui", "category": "Chat Interface", "name": "Chat Parameters (System Prompt Levels)", "description": "System-Prompts und erweiterte Parameter auf verschiedenen Ebenen steuern: global, pro Modell und pro Chat. Platzhalter-Variablen werden automatisch ausgefüllt. So lassen sich allgemeine Anweisungen und chatspezifische Ergänzungen kombinieren."}, {"id": "owui-152", "source": "openwebui", "category": "Agentic Features", "name": "Autonomous Chat History Search", "description": "Modelle können eigenständig den bisherigen Gesprächsverlauf des Nutzers durchsuchen, um relevanten Kontext zu finden. So kann die KI sich an frühere Gespräche 'erinnern', ohne dass man alles nochmal erzählen muss."}, {"id": "owui-153", "source": "openwebui", "category": "Agentic Features", "name": "Ask User Tool", "description": "Eingebautes Tool, mit dem das Modell die Verarbeitung pausieren und dem Nutzer eine Klärungsfrage stellen kann. Statt einfach zu raten, fragt die KI nach, wenn ihr Informationen fehlen — wie ein menschlicher Assistent."}, {"id": "owui-154", "source": "openwebui", "category": "Input", "name": "Formatting Toolbar", "description": "Schwebende Formatierungs-Toolbar für die Rich-Text-Eingabe mit Optionen für fett, kursiv, Listen usw. Kann ein- oder ausgeblendet werden. Macht Formatierung auch ohne Markdown-Kenntnisse zugänglich."}, {"id": "owui-155", "source": "openwebui", "category": "Misc", "name": "User Location Access", "description": "Optionale Standortfreigabe, damit Modelle den Aufenthaltsort des Nutzers kennen und kontextbezogene Antworten geben können. Z.B. für Wetterabfragen, lokale Empfehlungen oder zeitzonenbezogene Berechnungen."}, {"id": "owui-156", "source": "openwebui", "category": "Misc", "name": "Copy Formatted Text", "description": "Beim Kopieren von Text aus KI-Antworten bleibt die Formatierung erhalten (Rich Text) statt nur Klartext zu kopieren. So kann man formatierte Antworten direkt in andere Anwendungen einfügen, ohne die Formatierung zu verlieren."}, {"id": "hermes-001", "source": "hermes-desktop", "category": "Chat Interface", "name": "Streaming Responses", "description": "Antworten des Agenten werden live Wort für Wort angezeigt, während sie generiert werden. Die Textbox passt sich dabei dynamisch an die Breite an. So siehst du sofort, was der Agent denkt, statt auf die komplette Antwort warten zu müssen."}, {"id": "hermes-002", "source": "hermes-desktop", "category": "Chat Interface", "name": "Markdown Rendering", "description": "Nachrichten werden mit voller Markdown-Formatierung dargestellt — Überschriften, Codeblöcke mit Syntax-Highlighting, Tabellen, Listen und korrekte Zeilenumbrüche. Dadurch sind auch komplexe technische Antworten gut lesbar und strukturiert."}, {"id": "hermes-003", "source": "hermes-desktop", "category": "Chat Interface", "name": "Tool Call Display", "description": "Wenn der Agent ein Tool aufruft (z.B. eine Datei lesen oder einen Befehl ausführen), wird das als aufklappbare Zusammenfassung im Chat angezeigt. Du siehst den Funktionsnamen, die übergebenen Parameter als JSON und das Ergebnis — alles direkt im Gesprächsverlauf eingebettet."}, {"id": "hermes-004", "source": "hermes-desktop", "category": "Chat Interface", "name": "Image Preview in Chat", "description": "Bilder, die von Tools erzeugt oder analysiert werden (z.B. Screenshots oder Diagramme), erscheinen direkt als Vorschau im Chat. Du musst keine Datei separat öffnen, sondern siehst das Ergebnis sofort im Gesprächsfluss."}, {"id": "hermes-005", "source": "hermes-desktop", "category": "Chat Interface", "name": "Drag-and-Drop Attachments", "description": "Dateien lassen sich per Drag-and-Drop in den Chat ziehen, um sie als Anhang zur nächsten Nachricht hinzuzufügen. Bilder können auch direkt aus der Zwischenablage eingefügt werden. Das spart den Umweg über einen Datei-Dialog."}, {"id": "hermes-006", "source": "hermes-desktop", "category": "Chat Interface", "name": "Composer History & Queue", "description": "Mit den Pfeiltasten kannst du frühere Eingaben wieder aufrufen, ähnlich wie in einem Terminal. Außerdem kannst du Nachrichten in eine Warteschlange stellen und vor dem Absenden noch bearbeiten. Der Stopp-Button zeigt die Warteschlange zur Überprüfung an."}, {"id": "hermes-007", "source": "hermes-desktop", "category": "Chat Interface", "name": "Conversation Timeline Rail", "description": "Eine schmale Markierungsleiste am Rand zeigt einen Punkt pro Eingabe an. Beim Überfahren erscheint eine Liste der Nachrichten, und per Klick springst du direkt zu einer bestimmten Stelle im Gespräch. Unterstützt auch das Zurückblättern in längeren Verläufen."}, {"id": "hermes-008", "source": "hermes-desktop", "category": "Chat Interface", "name": "Reading Position Memory", "description": "Wenn du eine Sitzung erneut öffnest, springt die Ansicht zu der Stelle zurück, an der du zuletzt gelesen hast — nicht automatisch ganz nach unten. Nur wenn du bereits am Ende warst, folgt die Ansicht neuen Nachrichten automatisch."}, {"id": "hermes-009", "source": "hermes-desktop", "category": "Chat Interface", "name": "Find in Page", "description": "Mit Cmd/Strg+F öffnet sich eine Suchleiste, mit der du im gesamten Gesprächsverlauf nach Text suchen kannst. Mit Enter/Shift+Enter springst du zwischen den Treffern hin und her — praktisch bei langen Sitzungen."}, {"id": "hermes-010", "source": "hermes-desktop", "category": "Chat Interface", "name": "Directive Chip Actions", "description": "Verweise auf URLs oder andere Ressourcen im Chat werden als interaktive Chips dargestellt. Beim Überfahren erscheinen Schnellaktionen (z.B. öffnen, kopieren), die nach kurzer Verzögerung wieder verschwinden, damit sie nicht im Weg sind."}, {"id": "hermes-011", "source": "hermes-desktop", "category": "Chat Interface", "name": "Draft Management", "description": "Verborgene Tabs speichern separate Nachrichtenentwürfe, ohne den aktiven Eingabebereich zu beeinflussen. Nicht gesendete Nachrichten bleiben erhalten und werden wiederhergestellt, auch wenn du zwischen Tabs wechselst oder die App neu startest."}, {"id": "hermes-012", "source": "hermes-desktop", "category": "Chat Interface", "name": "Async Completion Disclosure", "description": "Ergebnisse von geplanten Aufgaben (Cron-Jobs) oder delegierten Arbeiten erscheinen als zusammengeklappte Einträge in der Timeline. Du kannst sie aufklappen, um den vollständigen Markdown-Bericht zu lesen, ohne dass sie den normalen Chatverlauf überladen."}, {"id": "hermes-013", "source": "hermes-desktop", "category": "Chat Interface", "name": "Task Progress Display", "description": "Über dem Eingabefeld erscheint eine aufklappbare Aufgaben-Übersicht, die jede Phase einer laufenden Operation anzeigt. Bei vielen Aufgaben scrollt die Liste intern, ohne dass sich das Eingabefeld verschiebt — du behältst immer den Überblick über den Fortschritt."}, {"id": "hermes-014", "source": "hermes-desktop", "category": "Chat Interface", "name": "Mid-Turn Redirection", "description": "Du kannst Korrekturen eintippen, während der Agent noch arbeitet — der laufende Arbeitsschritt wird mit deiner Korrektur umgeleitet, ohne dass bisherige Arbeit verloren geht. Doppeltes ESC verwirft den Entwurf komplett. So kannst du den Agenten spontan umlenken."}, {"id": "hermes-015", "source": "hermes-desktop", "category": "Chat Interface", "name": "Undo Turns", "description": "Mit dem Befehl /undo [N] kannst du die letzten N Gesprächsrunden rückgängig machen. Die gelöschten Runden werden weich entfernt und können wiederhergestellt werden. Praktisch, wenn der Agent in eine falsche Richtung gelaufen ist."}, {"id": "hermes-016", "source": "hermes-desktop", "category": "Preview & Artifacts", "name": "Right-Hand Preview Rail", "description": "Webseiten, Dateien und Tool-Ergebnisse werden in einem rechten Seitenbereich neben dem Chat dargestellt. So kannst du ein Ergebnis ansehen und gleichzeitig weiter chatten, ohne ständig zwischen Fenstern wechseln zu müssen."}, {"id": "hermes-017", "source": "hermes-desktop", "category": "Preview & Artifacts", "name": "Artifacts", "description": "Vom Agenten erzeugter HTML-Code oder kleine Apps werden als versionierte Karten mit Live-Vorschau in einer gesicherten Sandbox angezeigt. Du siehst das Ergebnis sofort interaktiv im rechten Bereich — wie eine eingebettete Mini-App direkt im Chat."}, {"id": "hermes-018", "source": "hermes-desktop", "category": "Preview & Artifacts", "name": "Artifact Gallery", "description": "Eine Seitenleiste sammelt alle erzeugten Bilder, Dateien und Links in einer durchsuchbaren Galerie. Jedes Element kann heruntergeladen, geöffnet oder kopiert werden und hat einen Rückverweis auf die Sitzung, in der es entstanden ist."}, {"id": "hermes-019", "source": "hermes-desktop", "category": "Preview & Artifacts", "name": "Artifact Suggestions", "description": "Über dem Eingabefeld erscheinen Vorschläge für Vorschauen, basierend auf der aktuellen Sitzung. Diese können weggewischt werden — das Entfernen löscht auch die zugehörigen historischen Tool-Vorschläge, damit der Bereich aufgeräumt bleibt."}, {"id": "hermes-020", "source": "hermes-desktop", "category": "Preview & Artifacts", "name": "In-App Browser", "description": "Der Agent kann den eingebauten Browser direkt steuern — Seiten öffnen, darauf klicken und Inhalte lesen. Webseiten können auch in den Systembrowser ausgelagert werden. Du musst den Browser nicht selbst bedienen, der Agent navigiert eigenständig."}, {"id": "hermes-021", "source": "hermes-desktop", "category": "Preview & Artifacts", "name": "Browser Annotation Mode", "description": "Im Annotationsmodus kannst du auf geladene Webseiten klicken, um nummerierte Markierungen mit Notizen zu setzen. Das System schwärzt dabei automatisch Passwörter und sensible Daten, bevor die Informationen an den Agenten gesendet werden."}, {"id": "hermes-022", "source": "hermes-desktop", "category": "Model Selection", "name": "Live Model Picker", "description": "Durch Klick auf den Modell-Selektor im Eingabebereich wechselst du das aktive Modell. Beim Überfahren der Einträge erscheinen Optionen für Denkmodus, Aufwandsstufe und Schnellmodus. Eine unscharfe Suche hilft beim schnellen Finden des richtigen Modells."}, {"id": "hermes-023", "source": "hermes-desktop", "category": "Model Selection", "name": "Reasoning Pill", "description": "Ein kleines Kennzeichen zeigt die aktuelle Aufwandsstufe des Modells an (z.B. Mittel, Hoch). Per Klick kannst du die Stufe direkt ändern, ohne erst das Modell-Menü öffnen zu müssen. Schneller Zugriff auf die wichtigste Modell-Einstellung."}, {"id": "hermes-024", "source": "hermes-desktop", "category": "Model Selection", "name": "Route Clamping Display", "description": "Wenn das Gateway die Denkstufe automatisch begrenzt (z.B. weil das Modell nicht alle Stufen unterstützt), zeigt das Kennzeichen beide Werte an (z.B. 'Ultra→Max') mit einem erklärenden Tooltip. So weißt du immer, was tatsächlich verwendet wird."}, {"id": "hermes-025", "source": "hermes-desktop", "category": "Model Selection", "name": "Risky Switch Warnings", "description": "Vor dem Wechsel zu teuren Modellen, bei großem gecachtem Kontext oder zu Modellen mit Datentraining erscheint ein Bestätigungsdialog. Das verhindert versehentlich hohe Kosten oder ungewollte Datenweitergabe."}, {"id": "hermes-026", "source": "hermes-desktop", "category": "Model Selection", "name": "Sticky Model Selection", "description": "Die Modellauswahl wird lokal pro Gerät gespeichert und bleibt über verschiedene Chats und Neustarts hinweg erhalten. Sie wird nie ins Profil geschrieben — jedes Gerät behält seine eigene bevorzugte Auswahl."}, {"id": "hermes-027", "source": "hermes-desktop", "category": "Model Selection", "name": "Per-Model Effort Presets", "description": "Jedes Modell merkt sich seine eigene Denkstufe und Schnellmodus-Einstellung. Wenn du ein Modell auswählst, werden dessen gespeicherte Voreinstellungen automatisch wiederhergestellt — du musst nicht jedes Mal neu konfigurieren."}, {"id": "hermes-028", "source": "hermes-desktop", "category": "Model Selection", "name": "Favorite Models", "description": "Modelle können als Favoriten markiert werden und erscheinen dann oben in einem eigenen Bereich — im Eingabefeld, bei Sitzungskarten und in allen Modell-Auswahldialogen. Spart Zeit beim täglichen Wechseln zwischen den meistgenutzten Modellen."}, {"id": "hermes-029", "source": "hermes-desktop", "category": "Model Selection", "name": "Mid-Chat Model Switching", "description": "Du kannst das Modell mitten im Gespräch wechseln. Bei langen Konversationen warnt das System, dass der Prompt-Cache zurückgesetzt wird und die nächste Antwort dadurch teurer sein kann. So triffst du bewusste Entscheidungen über Kosten."}, {"id": "hermes-030", "source": "hermes-desktop", "category": "Model Selection", "name": "Mixture-of-Agents (MoA)", "description": "MoA kann als eigenständiges 'Modell' ausgewählt werden. Deine Anfrage wird dann an mehrere Modelle gleichzeitig gesendet, jede Antwort erscheint als beschrifteter Block, und anschließend wird live eine Synthese aus allen Antworten generiert. Nutzt die Stärken verschiedener Modelle kombiniert."}, {"id": "hermes-031", "source": "hermes-desktop", "category": "Status Bar", "name": "Context-Usage Meter", "description": "Ein Live-Meter zeigt an, wie voll das Kontextfenster des Modells ist (in Prozent). Per Klick siehst du eine Aufschlüsselung nach Kategorien: System-Prompt, Tools, Skills, Memory und Konversation. So erkennst du rechtzeitig, wann der Kontext knapp wird."}, {"id": "hermes-032", "source": "hermes-desktop", "category": "Status Bar", "name": "Cache Hit Rate Display", "description": "Ein optionales Meter zeigt den Anteil der Prompt-Token, die aus dem Provider-Cache bedient werden. Ein hoher Wert bedeutet schnellere und günstigere Antworten — hilft beim Optimieren der Kosten."}, {"id": "hermes-033", "source": "hermes-desktop", "category": "Status Bar", "name": "Tokens Per Second Meter", "description": "Zeigt die durchschnittliche Ausgabe-Geschwindigkeit des Modells an (Token pro Sekunde), gemittelt über die letzten 10 Aufrufe. Aktualisiert sich live während der Generierung — nützlich zum Vergleichen verschiedener Modelle oder Provider."}, {"id": "hermes-034", "source": "hermes-desktop", "category": "Status Bar", "name": "Per-Session YOLO Toggle", "description": "Ein Schalter, mit dem du die Bestätigungsdialoge für gefährliche Befehle nur für diese eine Sitzung ein- oder ausschalten kannst, ohne deine Profil-Einstellungen dauerhaft zu ändern. Praktisch für konzentriertes Arbeiten, wenn du weißt, was du tust."}, {"id": "hermes-035", "source": "hermes-desktop", "category": "Status Bar", "name": "Customizable Status Bar", "description": "Per Rechtsklick auf die Statusleiste wählst du aus, welche Elemente angezeigt werden: Kontextmeter, Cache-Rate, Token/s, Arbeitsbereich, Modell, Freigaben, Timer, Version. Jeder kann sich die Leiste so zusammenstellen, wie es am nützlichsten ist."}, {"id": "hermes-036", "source": "hermes-desktop", "category": "Status Bar", "name": "Emergency Stop Button", "description": "Ein globaler Not-Stopp-Button in der Statusleiste, der den Agenten sofort anhält. Wenn etwas schiefläuft oder der Agent in eine Endlosschleife gerät, unterbrichst du damit alles mit einem Klick."}, {"id": "hermes-037", "source": "hermes-desktop", "category": "File Management", "name": "File Browser Sidebar", "description": "Eine Dateibrowser-Seitenleiste, mit der du das Arbeitsverzeichnis durchsuchen und Dateien vorab ansehen kannst, ohne die App zu verlassen. Der Startpfad kann beim Start über den --cwd-Parameter festgelegt werden."}, {"id": "hermes-038", "source": "hermes-desktop", "category": "File Management", "name": "Remote File Artifacts", "description": "Beim Öffnen von Artifacts auf entfernten Gateways werden die Dateien über dieses Gateway heruntergeladen. Relative Pfade werden gegen das Arbeitsverzeichnis der jeweiligen Sitzung aufgelöst — du musst dich nicht um Pfade kümmern."}, {"id": "hermes-039", "source": "hermes-desktop", "category": "Voice", "name": "Dictation / Voice Input", "description": "Du kannst per Mikrofon mit dem Agenten sprechen — deine Sprache wird automatisch in Text umgewandelt (Speech-to-Text). Das Timeout ist konfigurierbar (Standard 60 Sekunden). Ideal für schnelle Anweisungen ohne Tippen."}, {"id": "hermes-040", "source": "hermes-desktop", "category": "Voice", "name": "Read Replies Aloud (TTS)", "description": "Die Antworten des Agenten können per Text-to-Speech vorgelesen werden. Per Schalter aktivierbar — praktisch wenn du gerade nicht auf den Bildschirm schauen kannst oder die Hände voll hast."}, {"id": "hermes-041", "source": "hermes-desktop", "category": "Voice", "name": "Wake Word", "description": "Ein globales Aktivierungswort (wie 'Hey Siri' oder 'OK Google'), das den Agenten aus jeder App heraus per Sprache aufweckt. Die Erkennung läuft lokal auf dem Gerät — das Audio verlässt den Rechner nicht, solange das Wake Word nicht erkannt wurde."}, {"id": "hermes-042", "source": "hermes-desktop", "category": "Voice", "name": "Streaming TTS", "description": "Anstatt die komplette Antwort abzuwarten, wird die Sprachausgabe satzweise gestartet, während die Antwort noch generiert wird. Das fühlt sich natürlicher an und die Wartezeit wird deutlich kürzer."}, {"id": "hermes-043", "source": "hermes-desktop", "category": "Voice", "name": "Barge-In", "description": "Du kannst den Agenten mitten im Vorlesen unterbrechen, indem du einfach sprichst. Das Modell wird über die Unterbrechung informiert und passt seine Antwort entsprechend an — wie ein echtes Gespräch."}, {"id": "hermes-044", "source": "hermes-desktop", "category": "Voice", "name": "Silence Detection", "description": "Die Spracherkennung merkt, wenn du gerade beschäftigt bist, und spricht dich nicht an, solange du selbst redest. Verhindert, dass sich die Sprachausgabe mit deiner eigenen Stimme überlappt."}, {"id": "hermes-045", "source": "hermes-desktop", "category": "Windows & Layout", "name": "Session Tabs", "description": "Mit Cmd/Strg+T öffnest du neue Sitzungs-Tabs, mit Strg+Tab wechselst du zwischen ihnen, und Strg+1-9 springt direkt zum gewünschten Tab. Tabs können geschlossen und wieder geöffnet werden — wie in einem Browser."}, {"id": "hermes-046", "source": "hermes-desktop", "category": "Windows & Layout", "name": "Multiple Windows", "description": "Mit Cmd/Strg+Shift+N öffnest du ein neues Fenster. Jede Sitzung kann per Kontextmenü in ein eigenes Fenster ausgelagert werden — ideal für Multi-Monitor-Setups, wo du verschiedene Gespräche auf verschiedenen Bildschirmen sehen willst."}, {"id": "hermes-047", "source": "hermes-desktop", "category": "Windows & Layout", "name": "Sidebar Toggling", "description": "Mit Tastenkombinationen blendest du die linke Seitenleiste (Cmd/Strg+B), die rechte Seitenleiste (Cmd/Strg+J) ein/aus oder tauschst die Seiten (Cmd/Strg+Backslash). So passt du das Layout schnell an deinen aktuellen Bedarf an."}, {"id": "hermes-048", "source": "hermes-desktop", "category": "Windows & Layout", "name": "Layout Editor & Presets", "description": "Ein Button in der Titelleiste öffnet Layout-Vorlagen: Basis (nur Chat), Fokus, Standard, Terminal-Deck und Vierer-Konfiguration. So wechselst du mit einem Klick zwischen verschiedenen Arbeitsmodi, je nachdem ob du chattest, programmierst oder debuggst."}, {"id": "hermes-049", "source": "hermes-desktop", "category": "Windows & Layout", "name": "Simple vs Advanced Mode", "description": "Im einfachen Modus werden Statusleiste, Profil-Leiste, Terminal, Dateibrowser und technische Tool-Ansichten ausgeblendet — es bleibt nur der Chat. Ideal für Nutzer, die keine Entwickler-Features brauchen und eine aufgeräumte Oberfläche bevorzugen."}, {"id": "hermes-050", "source": "hermes-desktop", "category": "Windows & Layout", "name": "Layout Memory", "description": "Jeder Modus merkt sich die Positionen und Größen der Bereiche, welche Tabs aktiv oder versteckt sind, ob Seitenleisten eingeklappt sind und wo schwebende Fenster positioniert waren. Beim Moduswechsel wird alles exakt wiederhergestellt."}, {"id": "hermes-051", "source": "hermes-desktop", "category": "Windows & Layout", "name": "Hide vs Close Panes", "description": "Verstecken klappt einen Bereich zusammen, behält aber den Zustand bei (Scroll-Position, laufende Shells, Formulardaten). Schließen gibt den Bereich komplett frei. Der Unterschied ist wichtig, damit du nichts verlierst, wenn du nur Platz schaffen willst."}, {"id": "hermes-052", "source": "hermes-desktop", "category": "Windows & Layout", "name": "Minimize to Tray", "description": "Das Fenster kann ins System-Tray minimiert werden und verschwindet aus der Taskleiste/dem Dock, während Sitzungen im Hintergrund weiterlaufen. Über das Tray-Symbol stellst du das Fenster wieder her. Spart Platz in der Taskleiste."}, {"id": "hermes-053", "source": "hermes-desktop", "category": "HUD Mode", "name": "Floating Bar", "description": "Mit Cmd/Strg+Shift+H verwandelt sich der Chat in eine rahmenlose, immer-im-Vordergrund-Leiste, die über allen anderen Fenstern schwebt. So kannst du den Agenten nutzen, während du in einer anderen App arbeitest, ohne ständig umschalten zu müssen."}, {"id": "hermes-054", "source": "hermes-desktop", "category": "HUD Mode", "name": "HUD Movement & Resize", "description": "Die schwebende Leiste lässt sich durch Gedrückthalten verschieben und an den Rändern/Ecken in der Größe anpassen. 'Layout zurücksetzen' stellt Standardgröße und -position wieder her. Volle Freiheit bei der Platzierung auf dem Bildschirm."}, {"id": "hermes-055", "source": "hermes-desktop", "category": "HUD Mode", "name": "Tap to Summon", "description": "Eine konfigurierbare Geste (Cmd+Option auf macOS, Strg+Alt auf anderen Systemen): ein kurzes Tippen-und-Loslassen innerhalb von 0,5 Sekunden ruft das HUD herbei. Funktioniert aus jeder App heraus — super schneller Zugriff."}, {"id": "hermes-056", "source": "hermes-desktop", "category": "HUD Mode", "name": "Snap to Pointer", "description": "Mit Cmd/Strg+Shift+G springt das HUD zur aktuellen Mausposition (globale Tastenkombination, funktioniert aus jeder App). So ist der Agent immer genau dort, wo du gerade arbeitest."}, {"id": "hermes-057", "source": "hermes-desktop", "category": "HUD Mode", "name": "Context Positioning", "description": "Die Position des HUD verrät dem Agenten, in welcher App und auf welchem Bildschirm du arbeitest. Wenn du 'dieses hier' oder 'diese Seite' sagst, bezieht sich das automatisch auf das, was unter dem HUD liegt. Kontext ohne explizite Erklärung."}, {"id": "hermes-058", "source": "hermes-desktop", "category": "Quick Entry", "name": "Global Hotkey Composer", "description": "Ein konfigurierbarer globaler Hotkey (Standard: Strg/Cmd+Shift+Leertaste) öffnet von überall ein Eingabefeld, in das du Anfragen eintippen kannst, ohne erst zur Hermes-App wechseln zu müssen. Wie Spotlight auf dem Mac, aber für KI-Anfragen."}, {"id": "hermes-059", "source": "hermes-desktop", "category": "Terminal", "name": "Embedded Terminal", "description": "Mit Strg+Backtick öffnest du ein eingebettetes Terminal direkt in der App. Strg+Shift+Backtick startet weitere Terminals, die als Tabs nebeneinander angezeigt werden. So musst du für Shell-Befehle nicht in eine andere App wechseln."}, {"id": "hermes-060", "source": "hermes-desktop", "category": "Terminal", "name": "Shell Persistence", "description": "Das Schließen oder Verstecken des Terminal-Bereichs beendet die Shell nicht — jedes offene Terminal behält seinen Scrollback-Verlauf und laufende Prozesse bei. Du kannst das Terminal also bedenkenlos einklappen und später genau dort weitermachen."}, {"id": "hermes-061", "source": "hermes-desktop", "category": "Terminal", "name": "Add to Chat", "description": "Du kannst Terminal-Ausgaben markieren und als Kontext in den Eingabebereich des Chats senden. Praktisch, wenn du dem Agenten eine Fehlermeldung oder ein Ergebnis zeigen willst, ohne es abtippen zu müssen."}, {"id": "hermes-062", "source": "hermes-desktop", "category": "Git Integration", "name": "Review Pane", "description": "Mit Cmd/Strg+G öffnest du einen Überprüfungsbereich, der den Branch-Status, wie viele Commits vor/hinter dem Remote liegen, geänderte Dateien und Diffs anzeigt. Ein vollständiger Git-Überblick, ohne das Terminal nutzen zu müssen."}, {"id": "hermes-063", "source": "hermes-desktop", "category": "Git Integration", "name": "Stage/Commit/Push", "description": "Dateien können per Klick gestaged oder unstaged werden, Änderungen können zurückgesetzt werden. Commit-Nachrichten lassen sich manuell schreiben oder automatisch generieren. Commit und Push direkt aus der Oberfläche — der komplette Git-Workflow ohne Terminal."}, {"id": "hermes-064", "source": "hermes-desktop", "category": "Git Integration", "name": "PR Creation", "description": "Pull Requests können über die GitHub CLI (gh) erstellt werden, oder du übergibst die Aufgabe an den Agenten mit 'Erstell einen PR'. Der Agent formuliert Titel und Beschreibung und erstellt den PR auf GitHub."}, {"id": "hermes-065", "source": "hermes-desktop", "category": "Git Integration", "name": "Branch & Worktree Management", "description": "Branches können erstellt und gewechselt werden. Git-Worktrees ermöglichen parallele Arbeit des Agenten an verschiedenen Aufgaben, ohne dass sich die Änderungen gegenseitig beeinflussen. Worktrees erscheinen als eigene Bereiche unter dem Projekt."}, {"id": "hermes-066", "source": "hermes-desktop", "category": "Git Integration", "name": "File Change Scoping", "description": "Du kannst dir Änderungen in verschiedenen Ansichten zeigen lassen: noch nicht committete Änderungen, alle Branch-Änderungen, oder nur die Änderungen des letzten Agenten-Schritts ('Letzte Runde'). So behältst du den Überblick, was wann passiert ist."}, {"id": "hermes-067", "source": "hermes-desktop", "category": "Subagent Management", "name": "Live Subagents Frame", "description": "Ein Bereich über dem Eingabefeld zeigt alle delegierten Unter-Agenten an: ihre Anzahl, Aufgabennamen, verstrichene Zeit und die letzte Aktivität. So siehst du auf einen Blick, was der Agent gerade im Hintergrund erledigen lässt."}, {"id": "hermes-068", "source": "hermes-desktop", "category": "Subagent Management", "name": "Subagent Controls", "description": "Für jeden Unter-Agenten gibt es Steuerungsmöglichkeiten: Umlenken (neue Anweisungen geben) und Stoppen. Die Umlenkung wird am nächsten Checkpoint übernommen. Du kannst laufende Unter-Agenten auflisten und mitten in der Arbeit umleiten."}, {"id": "hermes-069", "source": "hermes-desktop", "category": "Subagent Management", "name": "Per-Delegation Cost", "description": "Die Kosten (Token-Verbrauch) werden pro delegierter Aufgabe einzeln ausgewiesen. So siehst du genau, welcher Unter-Agent wie viel verbraucht hat — wichtig zur Kostenkontrolle bei komplexen Aufgaben."}, {"id": "hermes-070", "source": "hermes-desktop", "category": "Memory & Learning", "name": "Memory Graph (Star Map)", "description": "Eine interaktive Netzwerk-Visualisierung aller gelernten Fähigkeiten und Erinnerungen. Die Knoten lassen sich zoomen, verschieben und filtern, und eine Timeline zeigt, wann welches Wissen gelernt wurde. Eine visuelle Karte dessen, was der Agent über dich und deine Projekte weiß."}, {"id": "hermes-071", "source": "hermes-desktop", "category": "Memory & Learning", "name": "Memory Graph Share", "description": "Das Layout der Wissenskarte kann als kompakter Code exportiert werden. Andere können diesen Code importieren, um nur das Layout zu übernehmen — die eigentlichen Inhalte werden dabei nicht geteilt. Gut zum Vergleichen von Wissenstrukturen."}, {"id": "hermes-072", "source": "hermes-desktop", "category": "Memory & Learning", "name": "Journey Command", "description": "Der Befehl /journey öffnet eine spielbare Lernpfad-Konstellation — eine Timeline, die visuell zeigt, was der Agent im Laufe der Zeit gelernt hat. Eine Art Zeitreise durch die Zusammenarbeit mit dem Agenten."}, {"id": "hermes-073", "source": "hermes-desktop", "category": "Memory & Learning", "name": "Inline Memory Editing", "description": "Gelernte Fähigkeiten und Erinnerungen können direkt im Wissensgraph-Bereich bearbeitet oder gelöscht werden. Du musst nicht in Dateien herumsuchen — alles geht über die grafische Oberfläche."}, {"id": "hermes-074", "source": "hermes-desktop", "category": "Bot Mode", "name": "Bot Roster", "description": "Unter 'Sitzungen | Bots' erscheint eine Liste aller Profile als eigenständige Bots. Jeder Bot hat einen Avatar (geometrisches Gesicht, hochgeladenes Bild, KI-generiert oder Pixel-Haustier). Eine Art Kontaktliste für deine verschiedenen KI-Persönlichkeiten."}, {"id": "hermes-075", "source": "hermes-desktop", "category": "Bot Mode", "name": "Bot Chat Sessions", "description": "Jeder Bot hat eine eigene, dauerhafte und einsehbare Konversation, getrennt von deinen persönlichen Gesprächen. So kannst du verschiedene Agenten für verschiedene Zwecke nutzen, ohne dass sich die Kontexte vermischen."}, {"id": "hermes-076", "source": "hermes-desktop", "category": "Bot Mode", "name": "Group Chats", "description": "Gruppenchats im Discord-Stil, in denen mehrere Bots zusammen kommunizieren. Gestapelte Avatare, Mitgliederzahl, letzte Nachricht als Vorschau und ein 'braucht dich'-Abzeichen wenn deine Eingabe nötig ist. Wie ein Team-Chat, aber mit KI-Mitgliedern."}, {"id": "hermes-077", "source": "hermes-desktop", "category": "Bot Mode", "name": "Inter-Bot Messaging", "description": "Bots können sich gegenseitig Nachrichten schicken — tippe @researcher um eine Aufgabe an einen anderen Bot weiterzureichen. Mit 'hermes peer' funktionieren sogar Direktnachrichten zwischen verschiedenen Gateway-Instanzen. Multi-Agenten-Kommunikation."}, {"id": "hermes-078", "source": "hermes-desktop", "category": "Bot Mode", "name": "Create Agents from Roster", "description": "Neue Agenten werden direkt aus der Bot-Liste erstellt: Name, Titel und Beschreibung eingeben, plus erweiterte Einstellungen für Modell, Persönlichkeit (SOUL), Skills, Toolsets und MCP-Server. Ein vollständiger Agent-Baukasten."}, {"id": "hermes-079", "source": "hermes-desktop", "category": "Bot Mode", "name": "Routines", "description": "Wiederkehrende Aufgaben, die per Cron-Zeitplan automatisch ausgeführt werden und einem bestimmten Bot zugeordnet sind. Der Bot arbeitet regelmäßig Aufgaben ab, auch wenn du nicht am Rechner sitzt."}, {"id": "hermes-080", "source": "hermes-desktop", "category": "Bot Mode", "name": "Hide Bots", "description": "Per Rechtsklick können ungenutzte Bots ausgeblendet werden. Ein Augen-Symbol zeigt versteckte Bots abgedunkelt an. Hat ein versteckter Bot ungelesene Aktivität, erscheint ein Punkt — du verpasst nichts, auch wenn der Bot nicht sichtbar ist."}, {"id": "hermes-081", "source": "hermes-desktop", "category": "Session Management", "name": "Session History Sync", "description": "Konversationen werden zwischen CLI, TUI und Desktop synchronisiert. Du kannst eine Sitzung auf dem Terminal beginnen und nahtlos auf dem Desktop fortsetzen — der Verlauf ist überall derselbe."}, {"id": "hermes-082", "source": "hermes-desktop", "category": "Session Management", "name": "Session Search", "description": "Volltextsuche (FTS5) über alle Nachrichteninhalte mit hervorgehobenen Treffern. Suchbar nach ID, filterbar nach Alter, Arbeitsbereich und Plattform. Findet auch ältere Gespräche schnell wieder."}, {"id": "hermes-083", "source": "hermes-desktop", "category": "Session Management", "name": "Session Archive & Prune", "description": "Sitzungen können archiviert, gelöscht oder alte Einträge automatisch bereinigt werden. Massenarchivierung hilft beim Aufräumen des Verlaufs, wenn sich über die Zeit zu viele Sitzungen angesammelt haben."}, {"id": "hermes-084", "source": "hermes-desktop", "category": "Session Management", "name": "Session Export", "description": "Sitzungen können in verschiedenen Formaten exportiert werden: Markdown, Quarto, HTML, nur Prompts, Hugging-Face-Traces oder JSON. So lassen sich Gespräche für Dokumentation, Schulung oder Datenanalyse weiterverwenden."}, {"id": "hermes-085", "source": "hermes-desktop", "category": "Session Management", "name": "Session Pinning", "description": "Wichtige Sitzungen können angepinnt werden und erscheinen dann immer oben in der Liste. Verhindert, dass häufig gebrauchte Gespräche zwischen neuen Sitzungen verschwinden."}, {"id": "hermes-086", "source": "hermes-desktop", "category": "Session Management", "name": "Session Handoff", "description": "Mit /handoff wird eine Sitzung live übergeben — alle Nachrichten, Tool-Aufrufe und der gesamte Kontext werden mitgenommen. Dabei kannst du Modell, Persönlichkeit oder Profil wechseln, ohne die bisherige Arbeit zu verlieren."}, {"id": "hermes-087", "source": "hermes-desktop", "category": "Session Management", "name": "Concurrent Multi-Profile Sessions", "description": "Sitzungen können gleichzeitig über mehrere Profile laufen. Profilübergreifende @session-Links ermöglichen Querverweise zwischen verschiedenen Profilen. Ideal wenn du verschiedene Kontexte (Arbeit, Privat, Projekte) parallel nutzt."}, {"id": "hermes-088", "source": "hermes-desktop", "category": "Command Center", "name": "Command Palette", "description": "Cmd+K öffnet eine universelle Such-/Navigationsleiste: Aktionen ausführen, Seiten wechseln, Einstellungen ändern, Sitzungen finden, Modell/Theme wechseln, Terminal öffnen oder Gateway neustarten — alles über ein schnelles Suchfeld erreichbar."}, {"id": "hermes-089", "source": "hermes-desktop", "category": "Command Center", "name": "Rebindable Shortcuts", "description": "In den Einstellungen können fast alle Tastenkombinationen neu zugewiesen werden. Doppelbelegungen werden automatisch als Konflikte markiert. So passt du die App an deine gewohnte Bedienung an."}, {"id": "hermes-090", "source": "hermes-desktop", "category": "Command Center", "name": "UI Language Switcher", "description": "Die Oberfläche kann auf verschiedene Sprachen umgestellt werden: Englisch, Chinesisch (vereinfacht/traditionell), Japanisch, Arabisch (mit Rechts-nach-Links-Layout), Russisch, Französisch, Deutsch, Spanisch."}, {"id": "hermes-091", "source": "hermes-desktop", "category": "Appearance", "name": "Theme Presets (8+)", "description": "Acht und mehr eingebaute Farbthemen: Hermes Teal, Nous Blue, Midnight, Ember, Mono, Cyberpunk, Rosé und eine große Variante. Jedes Theme hat eigene Farbpalette und Stimmung — vom professionellen Dunkelblau bis zum auffälligen Cyberpunk."}, {"id": "hermes-092", "source": "hermes-desktop", "category": "Appearance", "name": "VS Code Marketplace Themes", "description": "Direkte Suche im VS-Code-Marketplace: jedes dort verfügbare Farbthema kann heruntergeladen, konvertiert und installiert werden. Tausende von Themes zur Auswahl, ohne manuell Dateien herunterladen zu müssen."}, {"id": "hermes-093", "source": "hermes-desktop", "category": "Appearance", "name": "Light/Dark Mode", "description": "Wechsel zwischen hellem und dunklem Modus. Standard-Tastenkombination ist Shift+X für schnelles Umschalten. Beide Modi sind sorgfältig gestaltet — nicht einfach nur invertierte Farben."}, {"id": "hermes-094", "source": "hermes-desktop", "category": "Appearance", "name": "Chat & Terminal Font Setting", "description": "Schriftarten für Chat und Terminal können separat in den Einstellungen gewählt und pro Profil gespeichert werden. Auch barrierefreie Schriften wie OpenDyslexic oder Atkinson Hyperlegible werden unterstützt."}, {"id": "hermes-095", "source": "hermes-desktop", "category": "Appearance", "name": "Profile Rail Color", "description": "Jedes Profil hat eine eigene Akzentfarbe in der Seitenleiste. So erkennst du auf einen Blick, in welchem Profil du gerade arbeitest — besonders nützlich bei mehreren gleichzeitig geöffneten Profilen."}, {"id": "hermes-096", "source": "hermes-desktop", "category": "Appearance", "name": "Custom Zoom", "description": "Halbe Zoom-Stufen für feinere Kontrolle über die Textgröße. Statt nur 100%, 125%, 150% kannst du auch Zwischenwerte wie 112,5% wählen — für perfekte Lesbarkeit auf jedem Bildschirm."}, {"id": "hermes-097", "source": "hermes-desktop", "category": "Settings", "name": "Provider Management UI", "description": "Eine eigene Oberfläche zum Verwalten von KI-Anbietern (OpenAI, Anthropic, lokale Modelle etc.) mit separaten API-Key-Eingabefeldern pro Anbieter. Übersichtlicher als eine lange Konfigurationsdatei."}, {"id": "hermes-098", "source": "hermes-desktop", "category": "Settings", "name": "Local Models View", "description": "Eine Ansicht zum Installieren und Verwalten lokaler Modelle mit der eingebauten llama.cpp-Runtime. Modelle direkt aus der App herunterladen und starten — kein separates Tool nötig."}, {"id": "hermes-099", "source": "hermes-desktop", "category": "Settings", "name": "Reasoning Blocks Toggle", "description": "In den Einstellungen unter Chat kann die Anzeige der Denk-Schritte des Modells ein- oder ausgeblendet werden. Auch über den Befehl /reasoning show|hide steuerbar. Manche wollen sehen wie das Modell denkt, andere finden es ablenkend."}, {"id": "hermes-100", "source": "hermes-desktop", "category": "Settings", "name": "Keep Computer Awake", "description": "Verhindert, dass der Computer in den Ruhezustand geht — entweder nur während der Agent aktiv arbeitet oder dauerhaft solange Hermes geöffnet ist. Wichtig bei langen Aufgaben, die sonst durch den Energiesparmodus unterbrochen würden."}, {"id": "hermes-101", "source": "hermes-desktop", "category": "Settings", "name": "Reopen Last Chat on Launch", "description": "Beim Start der App wird automatisch das letzte Gespräch wiederhergestellt. Kann ein- oder ausgeschaltet werden — je nachdem ob du lieber dort weitermachst, wo du aufgehört hast, oder frisch starten möchtest."}, {"id": "hermes-102", "source": "hermes-desktop", "category": "Settings", "name": "Export/Import Profile", "description": "Profile können als .tar.gz-Datei exportiert werden — inklusive Skills, Memory, Persönlichkeit, Cron-Jobs, Plugins und Einstellungen (API-Keys werden automatisch entfernt). Importieren stellt alles wieder her. Ideal für Backup oder Umzug auf einen neuen Rechner."}, {"id": "hermes-103", "source": "hermes-desktop", "category": "Remote & Cloud", "name": "Remote Gateway Connection", "description": "Verbindung zu Hermes-Gateways auf anderen Rechnern per Token, OAuth oder SSH-Authentifizierung. Du kannst den Desktop-Client als Oberfläche für einen entfernten Server nutzen — die KI-Rechenleistung läuft woanders."}, {"id": "hermes-104", "source": "hermes-desktop", "category": "Remote & Cloud", "name": "Multi-Connection Registry", "description": "Eine benannte Liste aller Backends (lokal, entfernt, Hermes Cloud, SSH). Bei zwei oder mehr Verbindungen erscheint ein Gateway-Auswähler. So kannst du schnell zwischen verschiedenen Servern wechseln."}, {"id": "hermes-105", "source": "hermes-desktop", "category": "Remote & Cloud", "name": "Hermes Cloud Integration", "description": "Anmeldung bei Hermes Cloud mit Auswahl von Agenten aus deinem Konto. Bei mehreren Organisationen erscheint ein Organisations-Auswähler. Verbindet lokale Oberfläche mit Cloud-gehosteten Agenten."}, {"id": "hermes-106", "source": "hermes-desktop", "category": "Error Handling", "name": "Failed Turn Error Cards", "description": "Bei einem Fehler erscheint eine Fehlerkarte, die genau benennt, welche Schicht versagt hat: Provider, Endpunkt, Streaming, Authentifizierung, Abrechnung, Gateway, Laufzeit oder Festplatte. Statt einer kryptischen Fehlermeldung weißt du sofort, wo das Problem liegt."}, {"id": "hermes-107", "source": "hermes-desktop", "category": "Error Handling", "name": "Recovery Actions", "description": "Auf Fehlerkarten erscheinen kontextbezogene Aktionen: Erneut versuchen, Anbieter wechseln, Logs öffnen, Diagnosedaten senden, Fehlerdetails kopieren. Du musst nicht raten, was als nächstes zu tun ist — die App schlägt den passenden nächsten Schritt vor."}, {"id": "hermes-108", "source": "hermes-desktop", "category": "Error Handling", "name": "Rate Limit Countdown", "description": "Wenn die API-Rate begrenzt ist, zeigt die App die verbleibende Wartezeit als Live-Countdown an und bietet einen 'Erneut versuchen wenn Limit zurückgesetzt'-Button. So musst du nicht raten, wann du es wieder probieren kannst."}, {"id": "hermes-109", "source": "hermes-desktop", "category": "Scheduling", "name": "Cron Job UI", "description": "Geplante Aufgaben können über die Oberfläche erstellt, bearbeitet, pausiert, manuell ausgelöst und überwacht werden. Natürliche Sprache ('jeden Montag um 9') oder klassische Cron-Ausdrücke werden unterstützt. Automatisierung ohne Konfigurations-Dateien."}, {"id": "hermes-110", "source": "hermes-desktop", "category": "Scheduling", "name": "Cron Job Memory", "description": "Geplante Aufgaben haben einen dauerhaften Speicher zwischen den Ausführungen. Im Kontinuitätsmodus wird die Ausgabe eines Laufs als Eingabe für den nächsten verwendet — der Agent kann sich an frühere Ergebnisse erinnern und darauf aufbauen."}, {"id": "hermes-111", "source": "hermes-desktop", "category": "Skills & Plugins", "name": "Skills Hub", "description": "Ein eigener Bereich zum Durchsuchen, Suchen, Installieren und Verwalten von Skills. Ein eingebauter Katalog mit optionalen Skills kann per Klick installiert werden. Skills erweitern die Fähigkeiten des Agenten, ähnlich wie Apps auf einem Handy."}, {"id": "hermes-112", "source": "hermes-desktop", "category": "Skills & Plugins", "name": "Plugin SDK", "description": "Ein echtes Plugin-System, in dem sich Erweiterungen in die eingebauten Seiten einklinken können. Das Kanban-Board ist das erste offizielle Plugin. Entwickler können eigene Oberflächen-Erweiterungen bauen."}, {"id": "hermes-113", "source": "hermes-desktop", "category": "Skills & Plugins", "name": "Skill Bundles", "description": "Mehrere Skills können zu einem Bundle zusammengefasst werden. Ein einziger Slash-Befehl lädt dann den gesamten Skill-Satz — praktisch für wiederkehrende Workflows, bei denen immer die gleichen Fähigkeiten gebraucht werden."}, {"id": "hermes-114", "source": "hermes-desktop", "category": "Skills & Plugins", "name": "/learn Command", "description": "Mit /learn verwandelst du alles in einen wiederverwendbaren Skill — beschreibe einfach, was gelernt werden soll. Der Agent destilliert automatisch aus einem Verzeichnis, einer URL oder einem Workflow die Essenz. Einmal lernen, immer wieder verwenden."}, {"id": "hermes-115", "source": "hermes-desktop", "category": "MCP Management", "name": "MCP Command Center", "description": "Ein zentrales Dashboard für alle MCP-Server: hinzufügen, testen, aktivieren/deaktivieren, entfernen. Server können einfach per Drag-and-Drop oder Einfügen importiert werden. Eine Oberfläche für die gesamte Tool-Infrastruktur."}, {"id": "hermes-116", "source": "hermes-desktop", "category": "MCP Management", "name": "MCP Health Checks", "description": "Im Hintergrund laufende Gesundheitsprüfungen erkennen Probleme mit MCP-Servern (z.B. abgelaufene Authentifizierung) bevor Tool-Aufrufe fehlschlagen. Tägliche Erinnerungen zur Neu-Authentifizierung verhindern überraschende Ausfälle."}, {"id": "hermes-117", "source": "hermes-desktop", "category": "MCP Management", "name": "Fleet Cost Overlay", "description": "Zeigt die geschätzten Token-Kosten pro MCP-Server-Schema und den tatsächlichen Verbrauch der letzten 30 Tage. So erkennst du, welche Tools teuer sind und kannst entscheiden, ob du sie wirklich brauchst."}, {"id": "hermes-118", "source": "hermes-desktop", "category": "MCP Management", "name": "MCP Catalog", "description": "Ein von Nous Research geprüfter Katalog von MCP-Servern, die per Klick installiert werden können. Bei Servern, die einen API-Key brauchen, erscheint direkt ein Eingabefeld. Wie ein App-Store für KI-Tools."}, {"id": "hermes-119", "source": "hermes-desktop", "category": "Messaging Channels", "name": "Multi-Platform Channels", "description": "Der Agent kann über die Oberfläche mit vielen Plattformen verbunden werden: Telegram, Discord, Slack, Matrix, WhatsApp, Signal, iMessage, E-Mail, SMS, DingTalk, WeChat, QQ, LINE, SimpleX, Buzz, Teams und mehr. Ein Agent, erreichbar über alle deine Messenger."}, {"id": "hermes-120", "source": "hermes-desktop", "category": "Messaging Channels", "name": "Telegram Quick Setup", "description": "Telegram-Einrichtung in Sekunden: Klicke 'Mit QR erstellen', scanne den Code in Telegram — Hermes erstellt den Bot automatisch, erkennt deine Nutzer-ID, speichert die Zugangsdaten und startet das Gateway neu. Kein manuelles Token-Kopieren."}, {"id": "hermes-121", "source": "hermes-desktop", "category": "Messaging Channels", "name": "Platform Button UI", "description": "Bei Multiple-Choice-Fragen erscheinen auf Telegram und Discord native Buttons statt nummerierter Textoptionen. Du tippst einfach auf den Button, statt eine Nummer einzugeben — natürlichere Bedienung auf mobilen Plattformen."}, {"id": "hermes-122", "source": "hermes-desktop", "category": "Security", "name": "Execution Approvals", "description": "Bei gefährlichen Befehlen erscheint eine Freigabekarte mit drei Optionen: einmal erlauben, für diese Sitzung erlauben oder immer erlauben. So behältst du die Kontrolle darüber, was der Agent auf deinem System ausführen darf."}, {"id": "hermes-123", "source": "hermes-desktop", "category": "Security", "name": "Smart Approval Suggestions", "description": "Der Befehl 'hermes approvals suggest' analysiert deinen Verlauf und schlägt Whitelist-Regeln vor, basierend auf den Befehlen, die du häufig genehmigst. Anpassbare Richtlinien und ein Sicherheitsschalter bei zu vielen aufeinanderfolgenden Ablehnungen."}, {"id": "hermes-124", "source": "hermes-desktop", "category": "Security", "name": "Secret Management", "description": "Ein passwortgeschützter Tresor für Zugangsdaten, der 1Password, Bitwarden und einen lokalen Hermes-Tresor unterstützt. Jeder gespeicherte Eintrag hat ein Herkunfts-Label. Secrets werden sicher verwahrt, ohne sie in Konfigurationsdateien zu schreiben."}, {"id": "hermes-125", "source": "hermes-desktop", "category": "Security", "name": "Protected Agent Files", "description": "Bestimmte Dateien (AGENTS.md, Skills, Memory) benötigen immer eine Schreibgenehmigung, bevor der Agent sie ändern darf. Das verhindert, dass der Agent versehentlich seine eigene Konfiguration oder sein gelerntes Wissen überschreibt."}, {"id": "hermes-126", "source": "hermes-desktop", "category": "Research & Grounding", "name": "Grounded Citations", "description": "Jede Behauptung des Agenten wird mit einer überprüfbaren Quelle belegt. Zitate werden gegen den tatsächlichen Seitentext abgeglichen und mit verlinkten Belegen versehen. So kannst du jede Aussage nachvollziehen und auf Richtigkeit prüfen."}, {"id": "hermes-127", "source": "hermes-desktop", "category": "Research & Grounding", "name": "Fact-Checking Mode", "description": "Dokumente oder Behauptungen können automatisch überprüft werden. Der Agent zeigt an, was sich bestätigen lässt und was nicht — eine eingebaute Faktenprüfung für Texte, die du dem Agenten gibst."}, {"id": "hermes-128", "source": "hermes-desktop", "category": "Webhooks", "name": "Outbound Webhooks", "description": "HMAC-signierte Lifecycle-Events (Sitzungsaktivität, abgeschlossene Runden, Tool-Events) können an registrierte HTTP-Endpunkte gesendet werden. Damit lassen sich externe Systeme (z.B. Monitoring, Automatisierung) über Agenten-Aktivität informieren."}, {"id": "hermes-129", "source": "hermes-desktop", "category": "Performance", "name": "Streaming Reasoning", "description": "Statt eines Lade-Indikators siehst du in Echtzeit, wie das Modell denkt — die Denkschritte werden live gestreamt. Das ist transparenter und die Wartezeit fühlt sich kürzer an, weil du schon mitlesen kannst."}, {"id": "hermes-130", "source": "hermes-desktop", "category": "Performance", "name": "Cross-Session Prompt Caching", "description": "Ein 1-Stunden-Cache bei Claude-Anbietern, der über Sitzungsgrenzen hinweg funktioniert. Wiederkehrende Anfragen (z.B. mit dem gleichen System-Prompt) werden schneller und günstiger beantwortet, weil Teile des Prompts aus dem Cache bedient werden."}, {"id": "hermes-131", "source": "hermes-web-dashboard", "category": "Dashboard", "name": "Status Dashboard", "description": "Eine Übersichtsseite mit Agenten-Version, Gateway-Status, Anzahl aktiver Sitzungen und den letzten Sitzungen mit Modell/Token-Verbrauch/Vorschau. Aktualisiert sich alle 5 Sekunden automatisch — ein Blick genügt um zu sehen, ob alles läuft."}, {"id": "hermes-132", "source": "hermes-web-dashboard", "category": "Dashboard", "name": "Resource Pressure Alerts", "description": "Warnungen bei hohem Speicherverbrauch (erhöht/kritisch), wenig Festplattenplatz oder wenn der Prozess wegen Speichermangel neugestartet wurde. Warnungen können pro Boot-Zyklus weggeklickt werden und kommen nicht wieder."}, {"id": "hermes-133", "source": "hermes-web-dashboard", "category": "Dashboard", "name": "Analytics Dashboard", "description": "Ein Analyse-Dashboard mit Zeitraumwähler (7/30/90 Tage), Zusammenfassungskarten (Token, Cache-Trefferquote, Kosten, Sitzungen), gestapeltem Tagesbalkendiagramm und Aufschlüsselung pro Modell. Hilft bei der Kostenkontrolle und Nutzungsanalyse."}, {"id": "hermes-134", "source": "hermes-web-dashboard", "category": "Dashboard", "name": "Logs Viewer", "description": "Ein Log-Betrachter für Agent-, Fehler- und Gateway-Logs mit Filterung nach Level und Komponente, einstellbarer Zeilenanzahl und Live-Verfolgung (alle 5 Sekunden). Für Fehlersuche und Überwachung, ohne sich per SSH einloggen zu müssen."}, {"id": "hermes-135", "source": "hermes-web-dashboard", "category": "Session Browser", "name": "Session Filter Tabs", "description": "Drei Tabs zum Filtern: Chats (menschliche Gespräche), Automatisierung (Cron-Jobs/Tool/API-Aufrufe) und Alle Sitzungen. Zusätzlich ein Dropdown zur Filterung nach genauer Plattform-Herkunft. Schnelles Finden der richtigen Sitzung."}, {"id": "hermes-136", "source": "hermes-web-dashboard", "category": "Session Browser", "name": "Message History View", "description": "Nachrichten werden farblich nach Rolle unterschieden (Nutzer, Assistent, System, Tool). Markdown wird gerendert, Codeblöcke haben Syntax-Highlighting, und Tool-Aufrufe sind als zusammenklappbare Blöcke dargestellt. Übersichtliche Darstellung auch komplexer Verläufe."}, {"id": "hermes-137", "source": "hermes-web-dashboard", "category": "Session Browser", "name": "Session Statistics", "description": "Statistiken über alle Sitzungen: Gesamtzahl, aktive Sitzungen, archivierte Sitzungen, Nachrichten insgesamt und Aufschlüsselung nach Herkunft. Ein schneller Überblick über die Nutzung des Systems."}, {"id": "hermes-138", "source": "hermes-web-dashboard", "category": "Chat Terminal", "name": "Embedded TUI", "description": "Ein vollwertiges Terminal (TUI) im Browser, gerendert mit xterm.js und WebGL. WebSocket-Verbindung mit Mausverfolgung, Unicode-Unterstützung und Zeichenkästchen-Symbolen. Du kannst den Agenten direkt im Browser bedienen wie auf der Kommandozeile."}, {"id": "hermes-139", "source": "hermes-web-dashboard", "category": "Chat Terminal", "name": "Session Switcher Rail", "description": "Eine Seitenleiste im ChatGPT-Stil zum schnellen Wechseln zwischen Sitzungen. Darüber ein Modell-Auswähler. Die letzten Sitzungen sind nach Aktivität sortiert — die aktivste oben."}, {"id": "hermes-140", "source": "hermes-web-dashboard", "category": "Chat Terminal", "name": "Workspace Picker", "description": "Auswahl des Arbeitsverzeichnisses (Projekte, Git-Repos, eigene Pfade) für neue Sitzungen. Bereits verwendete Arbeitsverzeichnisse werden automatisch aus früheren Sitzungen erkannt und vorgeschlagen."}, {"id": "hermes-141", "source": "hermes-web-dashboard", "category": "Config", "name": "Form-Based Config Editor", "description": "Über 150 automatisch erkannte Konfigurationsfelder in Kategorien-Tabs (Modell, Terminal, Anzeige, Agent, Delegation, Memory, Freigaben). Dynamische Eingabefelder je nach Datentyp. Konfiguration über Formulare statt Textdateien."}, {"id": "hermes-142", "source": "hermes-web-dashboard", "category": "Config", "name": "API Keys Management", "description": "Ein gruppierter Editor für Umgebungsvariablen: KI-Anbieter, Tool-APIs, Messaging-Token, Agent-Einstellungen. Die Werte werden geschwärzt angezeigt — du siehst ob ein Key gesetzt ist, aber nicht seinen Inhalt."}, {"id": "hermes-143", "source": "hermes-web-dashboard", "category": "Config", "name": "Profiles Manager", "description": "Profilkarten mit Modell/Anbieter, Skill-Anzahl und Gateway-Status. Profile können erstellt, dupliziert, umbenannt und gelöscht werden. Ein Profil-Baukasten für verschiedene Einsatzzwecke (Arbeit, Privat, Entwicklung)."}, {"id": "hermes-144", "source": "hermes-web-dashboard", "category": "Admin", "name": "System Console", "description": "Host-Informationen (Betriebssystem, CPU, Speicher, Festplatte, Laufzeit), Update-Prüfung, Gateway-Steuerung (Start/Stopp/Neustart), Speicherverwaltung und Diagnose. Die Kommandozentrale für den Server-Betrieb."}, {"id": "hermes-145", "source": "hermes-web-dashboard", "category": "Admin", "name": "Operations Panel", "description": "Wartungsoperationen: Systemdiagnose, Sicherheitsaudit, Backup, Wiederherstellung, Skills aktualisieren, Prompt-Größe analysieren, Support-Dump erstellen, Konfiguration migrieren — alles mit Live-Log-Streaming. Ein Werkzeugkasten für die Systempflege."}, {"id": "hermes-146", "source": "hermes-web-dashboard", "category": "Admin", "name": "Shell Hooks Management", "description": "Shell-Hooks können erstellt und gelöscht werden: Event, Befehl, Muster, Timeout und Genehmigung konfigurierbar. Bei der Erstellung erscheint eine Sicherheitswarnung. Hooks führen automatisch Befehle bei bestimmten Ereignissen aus."}, {"id": "hermes-147", "source": "hermes-web-dashboard", "category": "Admin", "name": "Credential Pool", "description": "Rotierende API-Keys pro Anbieter hinzufügen und entfernen. Die Schlüssel werden in der Liste geschwärzt angezeigt. Mehrere Keys für denselben Anbieter ermöglichen Lastverteilung und Ausfallsicherheit."}, {"id": "hermes-148", "source": "hermes-web-dashboard", "category": "Auth", "name": "Multi-Provider Auth", "description": "Verschiedene Authentifizierungsmethoden: Benutzername/Passwort, Nous-Portal-OAuth, selbst gehostetes OIDC (Authentik, Keycloak etc.) oder benutzerdefinierte OAuth-Provider. Passt sich an die bestehende Infrastruktur an."}, {"id": "hermes-149", "source": "hermes-web-dashboard", "category": "Auth", "name": "Messaging Pairing", "description": "Offene Kopplungsanfragen von Messaging-Plattformen (Telegram, Discord etc.) können genehmigt oder widerrufen werden. Ausstehende Codes können gelöscht werden. Kontrolle darüber, wer über welchen Messenger auf den Agenten zugreifen darf."}, {"id": "hermes-150", "source": "hermes-web-dashboard", "category": "Theming", "name": "8 Built-in Themes", "description": "Acht eingebaute Farbthemen: Hermes Teal, Nous Blue, Midnight, Ember, Mono, Cyberpunk, Rosé — jeweils mit eigener Farbpalette, Typografie und Layout. Deckt verschiedene Geschmäcker ab, von professionell bis verspielt."}, {"id": "hermes-151", "source": "hermes-web-dashboard", "category": "Theming", "name": "Font Override", "description": "Eine unabhängige Schriftart-Auswahl, die die Standardschrift des aktiven Themes überschreibt. Die Einstellung bleibt auch beim Wechsel des Themes erhalten — deine Lieblingsschrift ist immer aktiv."}, {"id": "hermes-152", "source": "hermes-web-dashboard", "category": "Theming", "name": "Plugin Theme Extension", "description": "Eigene Themes können per YAML-Datei erstellt werden: Farbpalette, Typografie, Layout-Varianten (Standard/Cockpit/Kacheln), Komponentenstile und eigenes CSS. Vollständige visuelle Anpassung über das eingebaute Theme-System hinaus."}, {"id": "hermes-153", "source": "hermes-studio", "category": "Multi-Agent", "name": "Multi-Agent Crews", "description": "Benannte Teams aus spezialisierten Agenten erstellen und Aufgaben an alle oder einzelne Mitglieder verteilen. Jedes Mitglied kann ein eigenes Modell zugewiesen bekommen. Wie ein Büro voller KI-Mitarbeiter, jeder mit seiner Spezialität."}, {"id": "hermes-154", "source": "hermes-studio", "category": "Multi-Agent", "name": "Persona Agents", "description": "Vorgefertigte Agenten-Typen mit Namen und Rollen: Roger/Frontend, Sally/Backend, Ada/QA, Kai/Allgemein — jeweils mit eigenem Emoji und Farbe. Schneller Einstieg ohne jeden Agenten von Null konfigurieren zu müssen."}, {"id": "hermes-155", "source": "hermes-studio", "category": "Multi-Agent", "name": "Live Activity Feed", "description": "Eine einheitliche Timeline als Server-Sent-Events-Stream, die Tool-Aufrufe, Nachrichten und Fehler aller Crew-Mitglieder farblich kodiert anzeigt. Du siehst in Echtzeit, was jeder Agent gerade tut."}, {"id": "hermes-156", "source": "hermes-studio", "category": "Multi-Agent", "name": "Agent Library", "description": "Eigene Agenten erstellen, bearbeiten und löschen: System-Prompt, Emoji, Rollen-Label und Modell-Überschreibung festlegen. Eine Bibliothek deiner KI-Spezialisten, die du immer wieder einsetzen kannst."}, {"id": "hermes-157", "source": "hermes-studio", "category": "Multi-Agent", "name": "Crew Templates", "description": "Sieben eingebaute Team-Vorlagen (Recherche-Team, Full-Stack-Trupp, Code-Review-Crew etc.) plus selbst erstellte Vorlagen. Ein neues Team mit bewährter Zusammensetzung ist mit einem Klick einsatzbereit."}, {"id": "hermes-158", "source": "hermes-studio", "category": "Workflow", "name": "Visual Workflow Builder", "description": "Ein visueller Knotengraph für Agenten-Pipelines: Aufgaben hinzufügen, Verbindungen ziehen, automatisches Layout per topologischer Sortierung. Verschieben, Zoomen und Ziehen mit der Maus. Komplexe Workflows als visuelles Diagramm statt als Code."}, {"id": "hermes-159", "source": "hermes-studio", "category": "Workflow", "name": "DAG Editor", "description": "Bézier-Kanten zwischen Aufgaben zeichnen mit automatischer Zykluserkennung (verhindert Endlosschleifen). Kahns BFS-Algorithmus ordnet die Knoten automatisch von links nach rechts in parallelen Spalten an. Technisch korrekte Workflows garantiert."}, {"id": "hermes-160", "source": "hermes-studio", "category": "Workflow", "name": "Live Node Status", "description": "Workflow-Knoten zeigen ihren Status farblich an: wartend → läuft → fertig → Fehler. Farbige Ränder und Abzeichen aktualisieren sich live. Du siehst sofort, welcher Schritt gerade arbeitet und wo es hakt."}, {"id": "hermes-161", "source": "hermes-studio", "category": "Workflow", "name": "Kanban Board", "description": "Ein fünfspaltiges Kanban-Board (Backlog → Zu erledigen → In Arbeit → Review → Fertig) mit nativem Drag-and-Drop. Prioritäten und Tags pro Karte. Aufgabenmanagement direkt in der KI-Umgebung."}, {"id": "hermes-162", "source": "hermes-studio", "category": "Conductor", "name": "Conductor V2", "description": "Gateway-native Missions-Orchestrierung mit animierter SVG-Büro-Darstellung (Raster-, Runder-Tisch- und War-Room-Layouts). Die Agenten werden visuell als Figuren in einem virtuellen Büro dargestellt, das ihre Zusammenarbeit zeigt."}, {"id": "hermes-163", "source": "hermes-studio", "category": "Conductor", "name": "Quick Actions", "description": "Vordefinierte Missionstypen (Recherche/Bauen/Review/Deployment) mit Missions-Verlauf, Kostenverfolgung und Ergebnis-Dokumentation. Schnellstart für häufige Aufgaben, ohne jedes Mal von vorne konfigurieren zu müssen."}, {"id": "hermes-164", "source": "hermes-studio", "category": "Conductor", "name": "Mission Controls", "description": "Laufende Missionen können abgebrochen, pausiert oder erneut gestartet werden. Volle Kontrolle über mehrstufige Agenten-Operationen, auch wenn sie bereits laufen."}, {"id": "hermes-165", "source": "hermes-studio", "category": "Knowledge", "name": "Interactive Knowledge Graph", "description": "Ein interaktiver, kraftgesteuerter Graph, der Wiki-Link-Beziehungen zwischen Wissenseinträgen visualisiert. Zoomen, Verschieben, Knoten ziehen und Hover-Hervorhebung. Eine visuelle Landkarte des gesamten gespeicherten Wissens."}, {"id": "hermes-166", "source": "hermes-studio", "category": "Knowledge", "name": "Identity File Editor", "description": "SOUL.md (Persönlichkeit), persona.md und CLAUDE.md können direkt im Browser gelesen und bearbeitet werden. Die Identitätsdateien des Agenten sind ohne Dateisystem-Zugriff editierbar."}, {"id": "hermes-167", "source": "hermes-studio", "category": "Knowledge", "name": "Patterns & Corrections Viewer", "description": "Vom Agenten gelernte Muster und Nutzerkorrekturen aus MEMORY.md können durchblättert werden. Du siehst, was der Agent aus früheren Gesprächen gelernt hat und kannst fehlerhaftes Wissen korrigieren."}, {"id": "hermes-168", "source": "hermes-studio", "category": "Knowledge", "name": "Memory Browser", "description": "Memory-Dateien des Agenten können durchsucht, gelesen und bearbeitet werden. Voller Zugriff auf das gespeicherte Wissen, ohne sich durch Dateisystem-Pfade navigieren zu müssen."}, {"id": "hermes-169", "source": "hermes-studio", "category": "Monitoring", "name": "Operations Dashboard", "description": "Eine einheitliche Ansicht aller laufenden Agenten über alle Crews hinweg. Raster- und Ausgabe-Ansicht umschaltbar, Status-Filter verfügbar. Der Überblick über das gesamte Agenten-Ökosystem auf einen Blick."}, {"id": "hermes-170", "source": "hermes-studio", "category": "Monitoring", "name": "Cost Tracking", "description": "Token-Verbrauch (Eingabe/Ausgabe) und geschätzte API-Kosten pro Agent innerhalb einer Crew. Ein 14-Tage-Flächendiagramm zeigt den Kostenverlauf. Transparent nachvollziehbar, was wieviel kostet."}, {"id": "hermes-171", "source": "hermes-studio", "category": "Monitoring", "name": "Rate Limit Display", "description": "Ein Nutzungsmeter, das die API-Rate-Limit-Header des Anbieters anzeigt: verbleibende Anfragen und Token plus Countdown bis zum Reset. So weißt du immer, wie viel Kapazität noch verfügbar ist."}, {"id": "hermes-172", "source": "hermes-studio", "category": "Monitoring", "name": "Event Analytics", "description": "Aggregierte Ereignisstatistiken, tägliches Volumen als Balkendiagramm und ein Top-15-Diagramm der häufigsten Tool-Aufrufe. Zeigt, welche Tools am meisten genutzt werden und wie aktiv das System insgesamt ist."}, {"id": "hermes-173", "source": "hermes-studio", "category": "Monitoring", "name": "Audit Trail", "description": "Eine chronologische Timeline jedes Tool-Aufrufs, jeder Nutzernachricht und jeder Freigabeanfrage über alle Sitzungen hinweg. Lückenlose Nachvollziehbarkeit — wer hat wann was getan? Wichtig für Sicherheit und Fehlersuche."}, {"id": "hermes-174", "source": "hermes-studio", "category": "Monitoring", "name": "System Health Footer", "description": "Eine fixierte Fußleiste, die live CPU-Auslastung, Speicher, Festplattennutzung und Betriebszeit anzeigt. Farbliche Schwellenwerte warnen bei hoher Last. Der Systemzustand immer im Blick, ohne extra Tools öffnen zu müssen."}, {"id": "hermes-175", "source": "hermes-studio", "category": "Approvals", "name": "Execution Approvals UI", "description": "Echtzeit-Freigabekarten mit Kontextansicht zum Aufklappen, Auswahl des Geltungsbereichs (einmalig/Sitzung/immer), Ablehnung und Quittungen direkt in der Karte. Gefährliche Operationen sicher genehmigen oder ablehnen."}, {"id": "hermes-176", "source": "hermes-studio", "category": "Approvals", "name": "Pending Badge", "description": "Ein Indikator in der Seitenleiste zeigt an, wenn Freigaben auf eine Entscheidung warten. So übersiehst du keine ausstehende Genehmigung, auch wenn du gerade auf einer anderen Seite bist."}, {"id": "hermes-177", "source": "hermes-studio", "category": "Approvals", "name": "Permissions Config", "description": "Konfiguration des Freigabemodus (automatisch/immer fragen/nie), Timeouts und eine Whitelist erlaubter Befehle mit Tag-Eingabe-Editor. Einmal konfigurieren, welche Befehle der Agent ohne Rückfrage ausführen darf."}, {"id": "hermes-178", "source": "hermes-studio", "category": "Files", "name": "File Explorer", "description": "Ein vollständiger Arbeitsbereich-Browser mit Verzeichnisnavigation, Vorschau, Bearbeitung, Upload, Löschen, Umbenennen und Ordner erstellen. Dateiverwaltung direkt im Browser, ohne separates Tool."}, {"id": "hermes-179", "source": "hermes-studio", "category": "Files", "name": "Monaco Editor", "description": "Codebearbeitung mit Syntax-Highlighting über den Monaco-Editor (derselbe Editor wie in VS Code). Dateien können direkt im Browser geöffnet und mit professionellem Highlighting bearbeitet werden."}, {"id": "hermes-180", "source": "hermes-studio", "category": "Files", "name": "Profile-Scoped Workspaces", "description": "Jedes Crew-Mitglied (Agent) bekommt eine eigene, isolierte Dateisystem-Ansicht über profilspezifische Arbeitsverzeichnisse. Die Agenten arbeiten in getrennten Verzeichnissen und können sich nicht gegenseitig in die Quere kommen."}, {"id": "hermes-181", "source": "hermes-studio", "category": "Skills", "name": "2000+ Skills Registry", "description": "Über 2000 Skills auf skillsmp.com durchsuchen und installieren — mit Details, Kategorien und Dokumentation pro Skill. Wie ein App-Store für Agenten-Fähigkeiten: suchen, lesen, installieren."}, {"id": "hermes-182", "source": "hermes-studio", "category": "Skills", "name": "Skill Toggle", "description": "Skills direkt im Browser installieren, deinstallieren und ein-/ausschalten. Lade-Animationen und Erfolgsbenachrichtigungen sorgen für klares Feedback. Fähigkeiten des Agenten per Schalter steuern."}, {"id": "hermes-183", "source": "hermes-studio", "category": "Session History", "name": "Session History Archive", "description": "Ein zweispaltiger Sitzungsbrowser, sortierbar nach Datum, Modell, Token-Verbrauch und Kosten. Die vollständige Nachrichtenhistorie wird erst beim Öffnen einer Sitzung nachgeladen — schnell auch bei tausenden Einträgen."}, {"id": "hermes-184", "source": "hermes-studio", "category": "UI", "name": "8-Theme System", "description": "Vier Themes (Official, Classic, Slate, Mono) jeweils mit heller und dunkler Variante. Die Theme-Einstellung bleibt über Sitzungen hinweg erhalten. Acht verschiedene Looks für verschiedene Vorlieben und Tageszeiten."}, {"id": "hermes-185", "source": "hermes-studio", "category": "UI", "name": "Command Palette (Ctrl+K)", "description": "Schnellnavigation für Seiten, Aktionen und Einstellungen per Tastenkombination. Wie Spotlight auf dem Mac: tippen, finden, ausführen — ohne sich durch Menüs klicken zu müssen."}, {"id": "hermes-186", "source": "hermes-studio", "category": "UI", "name": "Clone Crew", "description": "Jedes bestehende Team kann mit einem Klick dupliziert werden. Für jedes Mitglied wird automatisch eine neue Sitzung erstellt. Schnelles Experimentieren mit Team-Zusammensetzungen ohne die Original-Konfiguration zu verlieren."}, {"id": "hermes-187", "source": "hermes-studio", "category": "UI", "name": "PWA Support", "description": "Installierbar als Progressive Web App auf Desktop und Mobilgeräten. Mobile-First-Design mit vollem Funktionsumfang — du brauchst keine native App, die Web-Version funktioniert wie eine installierte Anwendung."}, {"id": "hermes-188", "source": "hermes-studio", "category": "UI", "name": "Setup Wizard", "description": "Ein geführter Einrichtungsassistent für die Erstkonfiguration. Schritt für Schritt durch die wichtigsten Einstellungen, damit neue Nutzer schnell loslegen können, ohne die Dokumentation lesen zu müssen."}, {"id": "hermes-189", "source": "hermes-studio", "category": "Deployment", "name": "Systemd Auto-start", "description": "In den Einstellungen kann ein systemd-User-Service generiert und installiert werden, der Hermes automatisch beim Systemstart startet. Kein manuelles Anlegen von Service-Dateien nötig."}, {"id": "hermes-190", "source": "hermes-studio", "category": "Deployment", "name": "Docker Support", "description": "Containerisiertes Deployment per Docker Compose. Eine vorkonfigurierte Compose-Datei, die alles mitbringt — ideal für Server-Installationen ohne aufwändige manuelle Konfiguration."}, {"id": "hermes-191", "source": "hermes-studio", "category": "Deployment", "name": "Tailscale Integration", "description": "Zugriff von unterwegs über sicheres Mesh-Networking mit Tailscale. Der Agent ist über das Tailscale-Netzwerk erreichbar, ohne Ports öffnen oder VPNs konfigurieren zu müssen."}, {"id": "hermes-192", "source": "sojus-frontend",
